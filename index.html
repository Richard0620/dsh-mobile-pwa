<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI-HUB">
<title>AI-HUB</title>
<script>
  // 手动主题要在首屏绘制前应用，避免闪一下；auto 时不设属性，走系统配色
  try {
    var t = localStorage.getItem('dsh.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    var sk = localStorage.getItem('dsh.skin');
    if (sk === 'carbon' || sk === 'paper' || sk === 'auto') document.documentElement.dataset.skin = sk;
  } catch (e) {}
</script>
<style>
  :root{
    --r-card:22px; --r-bubble:20px;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
    --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-press: cubic-bezier(0.2, 0.8, 0.2, 1);
    /* 皮肤：纸面（默认）。暖灰纸面 + 柔和环境投影 + 清晰锚定黑 */
    --bg:#F5F4EF; --card:#FFFFFF; --surface-2:#ECEAE2; --surface-3:#E3E0D6;
    --surface-glass:rgba(245,244,239,.84); --tab-glass:rgba(255,255,255,.88);
    --fg:#161613; --dim:#838176; --line:rgba(26,26,22,.09); --line-2:rgba(26,26,22,.15);
    --shadow-card:0 1px 2px rgba(26,26,22,.04), 0 4px 12px rgba(26,26,22,.03);
    --shadow-dock:0 6px 24px rgba(26,26,22,.08), 0 1px 3px rgba(26,26,22,.05);
    --bubble:#ECEAE2; --accent:#161613; --accent-fg:#FFFFFF; --accent-2:#5E5D54;
    --ok:#27673B; --bad:#B33A30; --warn:#9A6310;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]):not([data-skin="carbon"]):not([data-skin="auto"]){
      --bg:#0E0E0B; --card:#171714; --surface-2:#22221D; --surface-3:#2B2B24;
      --surface-glass:rgba(14,14,11,.80); --tab-glass:rgba(23,23,20,.88);
      --fg:#F2F0E8; --dim:#7B786D; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
      --shadow-card:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 10px rgba(0,0,0,.32);
      --shadow-dock:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 28px rgba(0,0,0,.48);
      --bubble:#24241E; --accent:#F2F0E8; --accent-fg:#171714; --accent-2:#ACA99D;
      --ok:#7CBF90; --bad:#E0837A; --warn:#D9AC57;
    }
  }
  /* 手动主题：覆盖系统配色；auto 时不设 data-theme，仍走上面的媒体查询 */
  :root[data-theme="dark"]:not([data-skin="carbon"]):not([data-skin="auto"]){
    --bg:#0E0E0B; --card:#171714; --surface-2:#22221D; --surface-3:#2B2B24;
    --surface-glass:rgba(14,14,11,.80); --tab-glass:rgba(23,23,20,.88);
    --fg:#F2F0E8; --dim:#7B786D; --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
    --shadow-card:inset 0 1px 0 rgba(255,255,255,.04), 0 2px 10px rgba(0,0,0,.32);
    --shadow-dock:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 28px rgba(0,0,0,.48);
    --bubble:#24241E; --accent:#F2F0E8; --accent-fg:#171714; --accent-2:#ACA99D;
    --ok:#7CBF90; --bad:#E0837A; --warn:#D9AC57;
  }
  :root[data-theme="light"]:not([data-skin="carbon"]):not([data-skin="auto"]){
    --bg:#F5F4EF; --card:#FFFFFF; --surface-2:#ECEAE2; --surface-3:#E3E0D6;
    --surface-glass:rgba(245,244,239,.84); --tab-glass:rgba(255,255,255,.88);
    --fg:#161613; --dim:#838176; --line:rgba(26,26,22,.09); --line-2:rgba(26,26,22,.15);
    --shadow-card:0 1px 2px rgba(26,26,22,.04), 0 4px 12px rgba(26,26,22,.03);
    --shadow-dock:0 6px 24px rgba(26,26,22,.08), 0 1px 3px rgba(26,26,22,.05);
    --bubble:#ECEAE2; --accent:#161613; --accent-fg:#FFFFFF; --accent-2:#5E5D54;
    --ok:#27673B; --bad:#B33A30; --warn:#9A6310;
  }
  /* 皮肤：碳黑。近黑底 + 半透明高光描边 + 克制荧光绿，恒为深色 */
  :root[data-skin="carbon"]{
    --bg:#0A0B0D; --card:#131518; --surface-2:#1C1F24; --surface-3:#24282E;
    --surface-glass:rgba(10,11,13,.80); --tab-glass:rgba(19,21,24,.88);
    --fg:#F2F0E8; --dim:#767972; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
    --shadow-card:inset 0 1px 0 rgba(255,255,255,.045), 0 2px 10px rgba(0,0,0,.35);
    --shadow-dock:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.55);
    --bubble:#1B1E23; --accent:#C6F04E; --accent-fg:#0A0B0D; --accent-2:#9FE07C;
    --ok:#8EE073; --bad:#F07C6C; --warn:#E6BC5C;
  }
  /* 皮肤：跟随系统。浅色=纸面，深色=碳黑 */
  @media (prefers-color-scheme: dark){
    :root[data-skin="auto"]{
      --bg:#0A0B0D; --card:#131518; --surface-2:#1C1F24; --surface-3:#24282E;
      --surface-glass:rgba(10,11,13,.80); --tab-glass:rgba(19,21,24,.88);
      --fg:#F2F0E8; --dim:#767972; --line:rgba(255,255,255,.075); --line-2:rgba(255,255,255,.13);
      --shadow-card:inset 0 1px 0 rgba(255,255,255,.045), 0 2px 10px rgba(0,0,0,.35);
      --shadow-dock:inset 0 1px 0 rgba(255,255,255,.06), 0 10px 30px rgba(0,0,0,.55);
      --bubble:#1B1E23; --accent:#C6F04E; --accent-fg:#0A0B0D; --accent-2:#9FE07C;
      --ok:#8EE073; --bad:#F07C6C; --warn:#E6BC5C;
    }
  }
  /* 尊重系统「减弱动态效果」设置 */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
  /* 大屏手机（16 Pro Max 这类 430pt+）：正文字号与内边距略微放大，行宽不至于太松 */
  @media (min-width: 430px){
    main{padding-left:16px;padding-right:16px}
    .md{font-size:15.5px;line-height:1.65}
    .msg.user .bubble{font-size:15.5px}
    .dock{padding-left:14px;padding-right:14px}
    header{padding-left:12px;padding-right:12px}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overflow:hidden}
  html,body{height:100%;-webkit-text-size-adjust:100%}
  /* iOS 键盘弹起会把整页往上顶；把 body 钉死在视口里，就没有可平移的余地 */
  body{position:fixed;inset:0;overflow:hidden}
  /* iOS 在输入框字号 <16px 时会把整页放大，所以表单控件一律 ≥16px */
  input,textarea,select{font-size:16px}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
    font-variant-numeric:tabular-nums;
    overscroll-behavior-y:none;overscroll-behavior-x:none;overflow-x:hidden;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit;background:transparent;border:none;outline:none;width:100%}
  .app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;height:var(--vvh, 100dvh);background:var(--bg);position:relative;
    animation:viewIn 180ms var(--ease-spring)}
  @keyframes viewIn{from{opacity:.86;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* 只做手机形态：桌面浏览器也走这一版单栏，不再维护宽屏两栏 */

  /* ---------- 顶栏（毛玻璃吸顶） ---------- */
  header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;
    padding:calc(6px + var(--safe-t)) 10px 7px;min-height:48px;
    background:var(--surface-glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);position:relative;z-index:10}
  header h1{font-size:16px;font-weight:650;margin:0;text-align:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.01em;color:var(--fg)}
  .ico{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:var(--fg);font-size:17px;line-height:1;
    transition:transform 120ms var(--ease-press), background-color 140ms ease}
  .ico:active{transform:scale(.90);background:var(--bubble)}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(8px + var(--safe-b))}

  /* ---------- 首页（新会话） ---------- */
  .home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding-bottom:60px}
  .logo{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700;letter-spacing:-.5px}
  .logo .mark{width:44px;height:44px;border-radius:12px;background:var(--fg);color:var(--bg);
    display:grid;place-items:center;font-size:22px}
  .beta{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:2px 6px;border-radius:6px;font-weight:600;transform:translateY(-10px)}

  /* ---------- 会话列表 ---------- */
  .tbar{display:flex;align-items:center;gap:8px;padding:12px 2px 6px}
  .tbar b{font-size:14px;font-weight:600}
  .tbar span{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;color:var(--dim)}
  .tbar button{margin-left:auto;font-size:12px;padding:5px 10px;border:1px solid var(--line);
    border-radius:8px;color:var(--dim);background:var(--card)}  .tabs{display:flex;gap:18px;padding:6px 2px 0;color:var(--dim);font-size:14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .tabs b{color:var(--dim);font-weight:550;position:relative;padding:0 0 8px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs b.on{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
  .group{margin:6px 0 14px}
  .ghead{display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:13px;color:var(--dim)}
  .ghead .gname{font-weight:600;color:var(--fg);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .chev{font-size:10px;transition:transform .18s;color:var(--dim)}
  .ghead .fico{display:grid;place-items:center;color:var(--dim)}
  .ghead .fico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .ghead.closed .chev{transform:rotate(-90deg)}
  .ubadge{flex:none;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);
    color:var(--accent-fg);font-size:9.5px;font-weight:700;display:grid;place-items:center;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .ubdot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
  .wsmark{flex:none;max-width:72px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;color:var(--dim);
    border:1px solid var(--line);border-radius:5px;padding:1px 4px;margin-right:2px}  .branch{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
  .count{font-size:11px;color:var(--dim);flex:none}

  /* ---------- 底部 Tab 栏 ---------- */
  .tabbar{flex:none;display:flex;gap:2px;padding:7px 12px calc(7px + var(--safe-b));
    border-top:1px solid var(--line);background:var(--tab-glass);
    backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
  .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 0 4px;border-radius:12px;color:var(--dim);font-size:10.5px;letter-spacing:.01em;
    transition:transform 120ms var(--ease-press), color 150ms ease}
  .tabbar button:active{transform:scale(.92)}
  .tabbar button.on{color:var(--fg);font-weight:650}
  .tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.65;
    stroke-linecap:round;stroke-linejoin:round;transition:stroke-width 150ms ease}
  .tabbar button.on svg{stroke-width:2}

  /* ---------- 大标题头（会话 / 文件 / 设置） ---------- */
  .hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
    padding:calc(12px + var(--safe-t)) 18px 4px}
  .hero h1{margin:0;font-size:30px;line-height:1.1;font-weight:700;letter-spacing:-.03em;color:var(--fg)}
  .hero .sub{margin-top:5px;font-size:11px;letter-spacing:.02em;text-transform:none;
    color:var(--dim);font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
  .hero .acts{display:flex;gap:5px;padding-top:0;align-items:center;margin-top:0}
  .hero .acts .ico{place-items:center;padding:0}
  .hero > div:first-child{flex:1;min-width:0}
  .hero .hero-stack{flex:1;min-width:0}
  .hero .hrow{display:flex;align-items:center;justify-content:space-between;gap:12px;height:36px}
  .hero .hrow h1{margin:0;position:static}
  .hero .subrow{display:flex;align-items:center;gap:8px;margin-top:4px;min-height:22px}
  .hero .subrow .sub{margin-top:0}
  .connpill{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 10px;border:1px solid var(--line);
    border-radius:999px;background:var(--card);box-shadow:var(--shadow-card);
    font:11px/1 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--dim);white-space:nowrap;flex:none;
    transition:transform 120ms var(--ease-press), opacity 140ms ease}
  .connpill:active{transform:scale(.96);opacity:.8}
  .connpill b{font-weight:650;color:var(--fg);display:inline-block;line-height:1;align-self:center}
  .connpill .dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none;display:block;align-self:center;margin-top:0;opacity:1}
  .connpill.direct .dot{background:var(--ok)}
  .connpill.direct b{color:var(--ok)}
  .connpill.relay .dot{background:var(--warn)}
  .connpill.relay b{color:var(--warn)}
  .connpill .ms{color:var(--dim);display:inline-block;line-height:1;align-self:center}
  .connpill.static{cursor:default}
  .hero.hero-back{align-items:center;justify-content:flex-start;gap:8px}
  .hero.hero-back .hero-main{flex:1;min-width:0}
  .hero.hero-back .hero-main h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hero.hero-back .acts{margin-left:auto;margin-top:0;padding-top:0}
  .hero.hero-back .ico{flex:none;color:var(--dim);margin-left:-8px}
  .hero.hero-back .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* 会话行：标题下面补一行预览 */
  .row .p{font-size:12.5px;line-height:1.4;color:var(--dim);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- 设置页 ---------- */
  /* ---------- 文件页 ---------- */
  .rootrow{display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;white-space:nowrap}
  .rootchip{flex:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;
    padding:5px 9px;border-radius:8px;border:1px solid var(--line);color:var(--dim);background:var(--card)}
  .rootchip.on{color:var(--fg);border-color:var(--accent);background:var(--bubble)}  .crumbrow{display:flex;align-items:center;gap:2px;padding:8px 16px 2px;overflow-x:auto;white-space:nowrap}
  .crumbchip{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--dim);
    padding:4px 7px;border-radius:7px;flex:none}
  .crumbchip.on{color:var(--fg);background:var(--bubble)}
  .crumbsep{color:var(--line);font-size:10px;flex:none}
  .fbody2{flex:1;overflow-y:auto;padding:2px 16px calc(80px + var(--safe-b))}
  .fsect{display:flex;align-items:baseline;gap:8px;padding:16px 4px 6px}
  .fsect b{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);font-weight:600}
  .fsect span{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9.5px;color:var(--dim)}
  .flrow{display:flex;align-items:center;gap:12px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .flrow:active{background:var(--bubble)}
  .ftile{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:8.5px;letter-spacing:.02em;color:var(--dim);flex:none}
  .ftile.dir{background:var(--bubble);border-color:transparent}
  .fname2{flex:1;min-width:0}
  .fname2 b{display:block;font-size:14.5px;font-weight:550;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fname2 span{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:9.5px;color:var(--dim);margin-top:3px}
  .flrow .chev{color:var(--dim);font-size:16px;flex:none}
  /* 文件行右侧的「存到手机」：只读下载，和三点菜单同一个观感 */
  .flrow .fdl{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    border:0;background:none;color:var(--dim);opacity:.75;cursor:pointer;-webkit-appearance:none;appearance:none}
  .flrow .fdl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .flrow .fdl:active{background:var(--bubble);opacity:1}
  .fselbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--dim);flex:none;
    display:grid;place-items:center;color:transparent;font-size:11px;background:var(--card);opacity:.7}
  .flrow.sel .fselbox{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);opacity:1}
  .fselbar{flex:none;display:flex;align-items:center;gap:10px;margin:8px 14px 0;padding:10px 12px;
    border-radius:14px;background:var(--accent);color:var(--accent-fg)}
  .fselbar .t{flex:1;font-size:12.5px;font-weight:600}
  .fselbar button{font-size:12px;font-weight:600;padding:6px 10px;border-radius:9px;
    background:color-mix(in srgb,var(--accent-fg) 16%,transparent);color:var(--accent-fg)}  .showhidden{display:block;width:100%;margin:18px 0 6px;padding:11px;border-radius:12px;
    border:1px solid var(--line);background:var(--card);font-size:12.5px;color:var(--dim)}  .settings{flex:1;overflow-y:auto;padding:2px 16px calc(84px + var(--safe-b))}
  .slabel{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--dim);font-weight:650;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;padding:16px 6px 6px}
  .groupcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow-card)}
  .tgl{width:44px;height:26px;border-radius:13px;background:var(--surface-2,var(--line));position:relative;flex:none;
    transition:background 200ms var(--ease-spring);cursor:pointer}
  .tgl::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
    background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transition:transform 220ms var(--ease-spring)}
  .tgl.on{background:var(--ok)}
  .tgl.on::after{transform:translateX(18px)}
  .srow{display:flex;align-items:center;gap:12px;padding:12.5px 14px;border-bottom:1px solid var(--line);
    width:100%;text-align:left;transition:background-color 140ms ease, transform 120ms var(--ease-press)}
  .srow:last-child{border-bottom:0}
  .srow:active{background:var(--bubble)}
  .srow .st{flex:1;min-width:0}
  .srow b{display:block;font-size:14.5px;font-weight:580;letter-spacing:-.01em;color:var(--fg)}
  .srow span{display:block;font-size:12px;color:var(--dim);margin-top:2px}
  .srow .sv{flex:none;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;
    font-size:12px;color:var(--dim);display:inline-flex;align-items:center;gap:4px}
  .srow .schev{flex:none;color:var(--dim);opacity:.55;display:grid;place-items:center;margin-left:-4px}
  .srow .schev svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .row{display:flex;gap:10px;align-items:center;padding:11px 12px;margin-bottom:7px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow-card);
    transition:transform 120ms var(--ease-press), background-color 140ms ease}
  .row:active{transform:scale(.988);background:var(--bubble)}
  .row .body{flex:1;min-width:0}
  .row .t{display:flex;align-items:center;gap:7px}
  .row .tmain{flex:1;min-width:0;display:flex;align-items:center;gap:7px}
  .row .title{font-size:14.5px;font-weight:600;letter-spacing:-.01em;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .row .tmain .title{flex:0 1 auto;min-width:0}
  .row .time{font-size:11px;color:var(--dim);flex:none;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.01em}
  .row .dot{margin-top:0}
  /* 文件夹里没有可显示的会话时（都被置顶/归档）给一句说明，别让分组像丢了 */
  .ghint{font-size:12px;color:var(--dim);padding:2px 10px 10px}
  .dot{width:7.5px;height:7.5px;border-radius:50%;background:var(--dim);opacity:.45;flex:none;margin-top:7px}
  /* 状态灯：绿=处理中，黄=待你审批/回答，红=失败未读，蓝=完成未读，灰=空闲 */
  .dot.run{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent);
    animation:dotpulse 2.2s ease-in-out infinite}
  @keyframes dotpulse{0%,100%{box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
  .dot.pending{background:var(--warn);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
  .dot.failed{background:var(--bad);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--bad) 18%,transparent)}
  .dot.done{background:var(--accent);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}

  /* ---------- F3 子代理：派发轮入口条 ---------- */
  /* 只在该轮助手消息下方一条，同一轮派 4 个也只出一条；全完成时收成一句灰字。 */
  .subbar{display:flex;align-items:center;gap:7px;min-width:0;margin-top:8px;padding:8px 10px;
    border:1px solid var(--line);border-radius:12px;background:var(--card);width:100%;
    font-size:12px;color:var(--dim);text-align:left}
  .subbar:active{background:var(--bubble)}
  .subbar .ar{flex:none;font-size:13px;color:var(--dim);letter-spacing:-1px}
  .subbar b{flex:none;font-size:12.5px;font-weight:600;color:var(--fg);letter-spacing:-.1px}
  .subbar .cnt{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:11.5px;white-space:nowrap}
  .subbar .cnt i{width:6px;height:6px;border-radius:50%;display:block}
  .subbar .cnt.run{color:var(--ok)}   .subbar .cnt.run i{background:var(--ok)}
  .subbar .cnt.wait{color:var(--warn)} .subbar .cnt.wait i{background:var(--warn)}
  .subbar .cnt.fail{color:var(--bad)}  .subbar .cnt.fail i{background:var(--bad)}
  .subbar .all{flex:none;font-size:11.5px;color:var(--dim)}
  .subbar.done b{color:var(--dim);font-weight:600}
  .subbar .cv{margin-left:auto;flex:none;font-size:15px;color:var(--dim);letter-spacing:-.5px}

  /* ---------- F3 子代理列表（沿用 .mask/.sheet，行铺满） ---------- */
  .sheet.subsheet{padding-left:0;padding-right:0}
  .subsheet .shead2{display:flex;align-items:baseline;gap:8px;padding:0 18px 10px}
  .subsheet .shead2 h2{font-size:15px;font-weight:650;margin:0;letter-spacing:-.2px}
  .subsheet .shead2 .sm{font-size:11.5px;color:var(--dim)}
  .subsheet .shead2 .x{margin-left:auto;font-size:14px;color:var(--dim);flex:none}
  .subsheet .sheetlist{max-height:min(52vh,420px);overflow-y:auto;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch}
  .sli{display:flex;align-items:center;gap:10px;padding:11px 18px;border-bottom:1px solid var(--line);
    min-width:0;width:100%;text-align:left;background:none;color:inherit}
  .sli:last-of-type{border-bottom:0}
  .sli:active{background:var(--bubble)}
  .sli .txt{flex:1;min-width:0}
  .sli .txt b{display:block;font-size:13.5px;font-weight:600;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sli .txt span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sli .right{flex:none;display:flex;align-items:center;gap:8px}
  .sli .dot{margin-top:0}
  .stt{font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em;flex:none}
  .stt.run{color:var(--ok)} .stt.wait{color:var(--warn)}
  .stt.done{color:var(--dim)} .stt.fail{color:var(--bad)}
  .tm{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--dim);flex:none;
    min-width:28px;text-align:right}
  .ib{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;flex:none;color:var(--bad);font-size:9px;line-height:1}
  .ib:disabled{opacity:.35;color:var(--dim)}
  .sfoot{padding:10px 18px 0;font-size:11px;color:var(--dim);line-height:1.55}

  /* ---------- F3 子代理只读视图（二级页） ---------- */
  .metabar2{display:flex;align-items:center;gap:7px;padding:8px 16px 10px;flex:none;flex-wrap:wrap;
    font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--dim);letter-spacing:.02em}
  .metabar2 .dot{margin-top:0}
  .metabar2 .w{color:var(--ok)} .metabar2 .sep{opacity:.5}
  .roview{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:0 14px calc(12px + var(--safe-b))}
  .roview .msg{margin:12px 0}
  .dispatch{border:1px dashed var(--line);border-radius:14px;padding:10px 12px;background:var(--card);
    margin:4px 0 12px}
  .dispatch .dl{font:9.5px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.1em;
    text-transform:uppercase;color:var(--dim);margin-bottom:5px}
  .dispatch .dt{font-size:13px;line-height:1.6;color:var(--accent-2);white-space:pre-wrap;word-break:break-word}
  .robar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px calc(14px + var(--safe-b));
    border-top:1px solid var(--line);background:var(--bg)}
  .robar .rt{flex:1;min-width:0;font-size:11.5px;color:var(--dim);line-height:1.5}
  .ibtn{flex:none;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:600;
    background:var(--card);color:var(--bad);
    border:1px solid color-mix(in srgb,var(--bad) 45%,var(--line))}
  .ibtn:disabled{opacity:.4;color:var(--dim);border-color:var(--line)}
  .skel{height:12px;border-radius:6px;background:var(--bubble);margin:10px 2px;
    animation:skel 1.2s ease-in-out infinite}
  @keyframes skel{0%,100%{opacity:.45}50%{opacity:1}}
  .childnote{margin:10px 0;padding:11px 13px;border:1px solid var(--line);border-radius:12px;
    background:var(--card);font-size:12.5px;line-height:1.6;color:var(--dim)}
  .childnote.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
  .childtools{display:flex;flex-direction:column;gap:6px;margin:8px 0}
  .childtool{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--dim);min-width:0}
  .childtool .d{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
  .childtool .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .childtool .tm2{font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--dim);flex:none}

  /* ---------- F4 停止交代：折叠一行 / 展开四段 ---------- */
  .stopline{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:16px;
    background:var(--card);padding:11px 13px;font-size:12.5px;color:var(--dim);width:100%;text-align:left}
  .stopline:active{background:var(--bubble)}
  .stopline .sq{width:8px;height:8px;border-radius:2px;background:var(--dim);flex:none;display:block}
  .stopline b{font-size:12.5px;font-weight:650;color:var(--fg);flex:none}
  .stopline .x{margin-left:auto;flex:none;font-size:12px;font-weight:600;color:var(--fg)}
  .stopc .ch{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;
    color:var(--fg);letter-spacing:-.1px}
  .stopc .ch .sq{width:9px;height:9px;border-radius:2px;background:var(--dim);flex:none;display:block}
  .stopc .ch .dur{margin-left:auto;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;
    font-weight:400;color:var(--dim);letter-spacing:.02em}
  .fsec{margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
  .fsec .fh{display:flex;align-items:baseline;gap:6px;font-size:11.5px;font-weight:650;color:var(--fg)}
  .fsec .fh em{font-style:normal;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--dim);letter-spacing:.02em}
  .fsec .fi{display:flex;gap:6px;margin-top:3px;font-size:12.5px;line-height:1.5;color:var(--accent-2)}
  .fsec .fi i{font-style:normal;color:var(--dim);flex:none;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;
    padding-top:2px}
  .fsec .fi.more{color:var(--dim);font-size:11.5px}
  .facts{display:flex;gap:8px;margin-top:11px}

  /* ---------- F5 定时任务：列表 / 详情 / 新建 ---------- */
  .trow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);
    width:100%;text-align:left;background:none;color:inherit}
  .trow:last-child{border-bottom:0}
  .trow:active{background:var(--bubble)}
  .trow.new{background:color-mix(in srgb,var(--accent) 10%,var(--card));
    box-shadow:inset 3px 0 0 var(--accent)}
  .trow .tw{flex:none;width:54px;min-width:0}
  .trow .tw b{display:block;font:600 13px/1.1 ui-monospace,SFMono-Regular,Consolas,monospace;
    letter-spacing:-.3px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .tw span{display:block;font:10px/1.2 ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .ts{flex:1;min-width:0}
  .trow .ts b{display:block;font-size:14px;font-weight:550;letter-spacing:-.1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .ts span{display:block;font-size:11.5px;color:var(--dim);margin-top:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .ta{flex:none;display:flex;align-items:center;gap:6px}
  .tbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    display:grid;place-items:center;flex:none;font-size:10px;color:var(--fg);line-height:1}
  .tbtn:active{background:var(--bubble)}
  .tbtn.dis{opacity:.32}
  .runpill{display:inline-flex;align-items:center;gap:4px;flex:none;font:10px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--ok)}
  .runpill .dot{width:6px;height:6px;margin-top:0}
  .trow.paused{opacity:.6}
  .trow.paused .tw b,.trow.paused .ts b{color:var(--dim)}
  .hrow{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--line);
    font-size:12px;color:var(--dim)}
  .hrow:last-child{border-bottom:0}
  .hrow .hw{flex:none;width:70px;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--dim)}
  .hrow .hn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:12.5px;color:var(--fg)}
  .hrow .hr{flex:none;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace}
  .hrow .hr.ok{color:var(--ok)} .hrow .hr.bad{color:var(--bad)}
  .pbox{width:100%;border:1px solid var(--line);border-radius:14px;background:var(--card);
    padding:12px 13px;font-size:16px;line-height:1.55;color:var(--fg);min-height:72px;
    resize:vertical;font-family:inherit;outline:none;display:block}
  .pbox:focus{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .phint{font-size:11.5px;color:var(--dim);line-height:1.55;padding:8px 6px 0}
  .advrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding:11px 14px;
    border:1px solid var(--line);border-radius:14px;background:var(--card);
    font-size:12.5px;color:var(--dim);width:100%;text-align:left}
  .advrow:active{background:var(--bubble)}
  .advrow .ac{margin-left:auto;color:var(--dim);font-size:14px;flex:none}
  .advbox{margin-top:8px}
  .advbox input{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);
    padding:11px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--fg);
    outline:none}
  .advbox input:focus{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .cta{margin:14px 0 calc(20px + var(--safe-b));background:var(--accent);color:var(--accent-fg);
    border-radius:14px;text-align:center;padding:13px;font-size:14.5px;font-weight:600;width:100%}
  .cta:disabled{opacity:.5}
  .srow .sv input{width:96px;text-align:right;font:11px ui-monospace,SFMono-Regular,Consolas,monospace;
    color:var(--dim);background:transparent;border:0;outline:none;padding:0}
  .srow .sv input:focus{color:var(--fg)}
  .schedsec{margin:0 0 10px}
  .schedsec .groupcard{margin:0}
  .schedhint{font-size:11.5px;color:var(--dim);line-height:1.6;padding:10px 6px 0}
  .schedwarn{font-size:11.5px;color:var(--warn);line-height:1.6;padding:8px 6px 0}
  .schedtitle{font-size:13px;font-weight:650;margin:0 0 6px;letter-spacing:-.1px}
  .schedprompt{font-size:13.5px;line-height:1.6;color:var(--accent-2);white-space:pre-wrap;word-break:break-word}

  /* ---------- 会话详情 ---------- */
  .msg{margin:14px 0}
  /* 消息行不再用 content-visibility：它按 140px 估高，进入会话/键盘弹起时
     真实高度逐步替换估高，会让对话流高度来回抖。长会话仍靠 120 条分窗控制 DOM。 */
  .mholder{display:flex;flex-direction:column}
  /* 排队中的消息：挂在输入框上方（dock 内），默认折叠成一行 */
  .qdock{display:none;flex-direction:column;gap:6px;padding:2px 0 4px;max-height:220px;overflow-y:auto}
  /* 编辑排队消息：提示条 + 保存/取消（点保存走宿主 edit 动作，附件不动） */
  .qeditbar{display:none;align-items:center;gap:8px;padding:6px 10px;margin:0 0 6px;border-radius:12px;
    border:1px solid var(--accent);background:var(--card);font-size:12px;color:var(--fg)}
  .qeditbar .qmini{flex:none}
  .qlist{display:flex;flex-direction:column;gap:6px}
  .qitem{border:1px dashed var(--line);border-radius:14px;padding:7px 10px;background:var(--card);opacity:.92}
  .qitem.open{padding:9px 12px}
  .qhead{display:flex;align-items:center;gap:6px;cursor:pointer;min-width:0}
  .qitem.open .qhead{margin-bottom:5px}
  .qtag{font-size:10.5px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 7px;flex:none}
  .qprev{flex:1;min-width:0;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .qchev{flex:none;font-size:11px;color:var(--dim)}
  .qmini{font-size:11.5px;color:var(--dim);padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
  .qmini.primary{color:var(--accent-fg);background:var(--accent);border-color:var(--accent)}
  .qacts{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
  .qtext{font-size:14.5px;color:var(--fg);white-space:pre-wrap;word-break:break-word;opacity:.9}

  /* 每条消息下方的操作行（复制 / 分支） */
  .mact{display:flex;gap:4px;margin-top:5px;font-size:12px;color:var(--dim);opacity:.88}
  .msg.user ~ .mact, .mact.right{justify-content:flex-end}
  .mact button{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:8px;
    color:var(--dim);font-size:12px;background:transparent;border:0;line-height:1.1;
    transition:transform 120ms var(--ease-press), background-color 140ms ease, color 140ms ease}
  .mact button:active{transform:scale(.94);background:var(--bubble);color:var(--fg)}
  .mact button.copied{color:var(--ok);font-weight:600}
  .mact button svg{width:13.5px;height:13.5px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--bubble);border-radius:18px 18px 5px 18px;padding:9px 14px;
    max-width:82%;white-space:pre-wrap;word-break:break-word;font-size:15px}
  .md{font-size:15px;line-height:1.62;word-break:break-word}
  .md > :first-child{margin-top:0}
  .md > :last-child{margin-bottom:0}
  .md h1,.md h2,.md h3{margin:16px 0 8px;line-height:1.35;font-weight:650}
  .md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}
  .md p{margin:9px 0}
  .md ul,.md ol{margin:8px 0;padding-left:22px}
  .md li{margin:3px 0}
  .md code{font:.9em/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
    background:color-mix(in srgb,var(--fg) 7%,transparent);padding:1.5px 5px;border-radius:5px}
  .md pre.code{position:relative;background:#171a21;color:#e6e9ef;padding:12px 14px;border-radius:14px;
    border:1px solid rgba(255,255,255,.08);overflow-x:auto;margin:10px 0}
  .md pre.code code{background:none;padding:0;color:inherit;font-size:12.5px;line-height:1.55}
  /* 代码块：外层包一层，右上角复制按钮不随横向滚动跑掉 */
  .codewrap{position:relative;margin:10px 0}
  .codewrap pre.code{margin:0}
  .codewrap .codecopy{position:absolute;top:7px;right:7px;z-index:2;font-size:11px;line-height:1.2;
    padding:4px 9px;border-radius:8px;background:rgba(255,255,255,.11);color:#e6e9ef;
    border:1px solid rgba(255,255,255,.14);opacity:.9;user-select:none;-webkit-user-select:none;
    transition:transform 120ms var(--ease-press), background-color 150ms ease, color 150ms ease}
  .codewrap .codecopy:active{transform:scale(.94);opacity:1;background:rgba(255,255,255,.22)}
  .codewrap .codecopy.copied{background:rgba(142,224,115,.22);border-color:rgba(142,224,115,.35);color:#9FE07C;opacity:1}
  /* 「分段复制」模式：每个顶层块点一下复制这一段 */
  .md.pickcopy > *{outline:1px dashed var(--accent);outline-offset:3px;border-radius:6px;cursor:copy}
  /* 代码高亮 */
  .md pre.code .k{color:#c792ea}
  .md pre.code .s{color:#c3e88d}
  .md pre.code .c{color:#6b7394;font-style:italic}
  .md pre.code .n{color:#f78c6c}
  /* 文件浏览 */
  .crumbs{display:flex;gap:4px;flex-wrap:wrap;padding:6px 2px 10px;font-size:12.5px;color:var(--dim)}
  .crumb{padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
  .crumb:active{background:var(--bubble)}
  .frow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px}
  .frow:active{background:var(--bubble)}
  .fico{width:22px;text-align:center;flex:none}
  .fname{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filepv{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);white-space:pre-wrap;
    word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:10px;margin:0;max-height:60vh;overflow:auto}

  /* 斜杠指令面板 */
  .slash{display:none;max-height:210px;overflow:auto;background:var(--card);border:1px solid var(--line);
    border-radius:14px;margin:0 0 8px;padding:4px}

  /* 键值面板 */

  .offbar{position:fixed;left:0;right:0;top:0;z-index:998;background:var(--warn);color:#1a1a1a;
    font-size:12px;text-align:center;padding:4px 8px;transform:translateY(-100%);transition:transform .2s}
  .offbar.on{transform:none}

  /* 右侧文件面板 */
  .rpanel-mask{position:fixed;inset:0;z-index:1000;background:rgba(10,11,13,.36);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:flex;
    justify-content:flex-end;opacity:0;transition:opacity 220ms ease}
  .rpanel-mask.on{opacity:1}
  /* 和左侧会话抽屉保持同一套尺寸/阴影/行样式 */
  .rpanel{width:86%;max-width:360px;height:100%;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform 280ms var(--ease-spring);box-shadow:-4px 0 28px rgba(0,0,0,.22);overflow:hidden}
  .rpanel-mask.on .rpanel{transform:none}
  .rphead{display:flex;align-items:center;gap:4px;padding:calc(10px + var(--safe-t)) 10px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .rphead b{font-size:17px;font-weight:600;margin-left:2px;letter-spacing:-.01em}
  .rpbody{flex:1;overflow-y:auto;padding:8px 12px calc(12px + var(--safe-b));display:flex;flex-direction:column}
  .rpfilter{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;
    font-size:15px;width:100%;margin-bottom:10px;color:var(--fg)}
  .rpfilter::placeholder{color:var(--dim)}
  .rpcount{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);padding:4px 2px 6px}
  .rplist .frow{padding:12px 4px;border-radius:10px;font-size:14.5px}
  .rplist .frow.sel{background:var(--bubble)}
  .rplist .frow .fico{width:22px;text-align:center;flex:none}
  /* 右侧文件面板：文件行右侧的「存到手机」，和主文件页同一个图标 */
  .frow .fdl{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
    border:0;background:none;color:var(--dim);opacity:.7;cursor:pointer;-webkit-appearance:none;appearance:none}
  .frow .fdl svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round}
  .frow .fdl:active{background:var(--bubble);opacity:1}
  .rplist .chev{color:var(--dim);font-size:14px;flex:none}
  .rpsect{font-size:11.5px;color:var(--dim);padding:8px 2px 2px}
  /* 新建工作区：目录选择器 */
  .rpickbar{flex:none;padding:8px 12px 0;border-bottom:1px solid var(--line);background:var(--bg)}
  .rppath{font-size:12px;line-height:1.4;color:var(--dim);background:var(--card);
    border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:0 0 6px;word-break:break-all}
  .rproots{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 8px}
  .rproot{font-size:12px;padding:2px 10px;border:1px solid var(--line);border-radius:999px;
    background:var(--card);color:var(--dim)}

  /* 全屏文件查看器：跟随当前皮肤（纸面 / 碳黑），不再恒深色 */
  .viewer{position:fixed;inset:0;z-index:1100;background:var(--bg);color:var(--fg);
    display:flex;flex-direction:column}
  .viewer .vtitle{color:var(--fg)}
  .viewer .vmeta{color:var(--dim)}
  .viewer .vbody{color:var(--fg)}
  .vfoot{flex:none;display:flex;gap:8px;padding:8px 12px calc(10px + var(--safe-b));
    border-top:1px solid var(--line);background:var(--bg)}
  .vbtn{height:42px;padding:0 14px;border-radius:11px;border:1px solid var(--line);
    color:var(--fg);font-size:12.5px}
  .vgo{flex:1;height:42px;border-radius:11px;background:var(--accent);color:var(--accent-fg);
    font-size:13px;font-weight:600}  .vhead{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 6px}
  /* 查看器右上角的图标按钮：SVG 必须 fill:none，否则路径会被填成实心黑块 */
  .vhead .ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round}
  .vtitle{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .vmeta{font-size:11px;color:var(--dim);padding:0 14px 6px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .vtools{display:flex;gap:8px;padding:0 12px 8px;border-bottom:1px solid var(--line);flex:none}
  .vtool{font-size:12px;color:var(--dim);padding:5px 10px;border:1px solid var(--line);
    border-radius:999px;background:var(--card)}
  .vtool.on{color:var(--fg);border-color:var(--accent)}
  .vfind{display:none;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);flex:none}
  .vfind.on{display:flex}
  .vfind input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;font-size:14px}
  .vcount{font-size:11px;color:var(--dim);min-width:48px;text-align:center}
  .vbody{flex:1;overflow:auto;margin:0;padding:6px 8px calc(16px + var(--safe-b));
    font:12px/1.55 ui-monospace,Consolas,monospace;counter-reset:vline}
  /* 媒体（PDF/图片/视频）铺满整块剩余区域：底部不再留一条空白 */
  .viewer .vbody.media{display:flex;align-items:center;justify-content:center;
    padding:0;overflow:hidden;background:var(--card)}
  .viewer .vbody.media > embed{flex:1;width:100%;height:100%;border:0;background:var(--card)}
  .viewer .vbody.media > img,.viewer .vbody.media > video{width:100%;height:100%;
    object-fit:contain;background:var(--card)}
  .viewer .vmd{display:none;flex:1;overflow:auto;padding:12px 14px calc(18px + var(--safe-b));
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color:var(--fg)}
  .viewer .vmd .md{font-size:15px;line-height:1.65;color:var(--fg)}
  .viewer .vmd .md code{background:var(--bubble);color:var(--fg)}
  .viewer .vmd .md pre.code{margin:10px 0}
  .vbody .vline{counter-increment:vline;white-space:pre-wrap;word-break:break-word;
    padding-left:3.4em;text-indent:-3.4em}
  .vbody.nowrap .vline{white-space:pre;text-indent:0;padding-left:0}
  .vbody .vline::before{content:counter(vline);display:inline-block;width:2.6em;margin-right:8px;
    text-align:right;color:var(--dim);opacity:.6;user-select:none}
  .vbody.nowrap .vline::before{display:none}
  .vbody .vline.hit{background:rgba(255,214,0,.22)}

  /* 左侧抽屉（独立于 .mask，避免被 .mask 的 flex-end/center 拉歪） */
  .drawer-mask{position:fixed;inset:0;z-index:999;background:rgba(10,11,13,.36);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
    display:flex;align-items:stretch;justify-content:flex-start;opacity:0;transition:opacity 220ms ease}
  .drawer-mask.on{opacity:1}
  .drawer{width:86%;max-width:360px;height:100%;max-height:100%;background:var(--bg);
    display:flex;flex-direction:column;transform:translateX(-100%);transition:transform 280ms var(--ease-spring);
    box-shadow:4px 0 28px rgba(0,0,0,.22);overflow:hidden}
  .drawer-mask.on .drawer{transform:none}
  .drhead{display:flex;align-items:center;gap:4px;padding:calc(10px + var(--safe-t)) 10px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .drhead b{font-size:16px;font-weight:600;margin-left:6px}
  .drawer .drlist .row{background:transparent;border:0;border-bottom:1px solid var(--line);
    border-radius:0;margin:0;padding:11px 2px}
  .drawer .drlist .row:last-child{border-bottom:0}
  .drawer .drlist .group{margin-bottom:2px}  .drlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .drfoot{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(10px + var(--safe-b));
    border-top:1px solid var(--line);flex:none}
  .drbtn{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 10px}
  /* 抽屉底部：图标按钮一行放下（通知入口收进「设置」里，不再占一格） */
  .drfoot.icons{flex-wrap:nowrap;justify-content:space-around;align-items:center;gap:4px;
    padding:8px 10px calc(8px + var(--safe-b))}
  .drfoot .drbtn{display:inline-flex;align-items:center;gap:6px;line-height:1}
  .drfoot .drbtn .bi{height:18px}
  .drfoot.icons .drbtn{justify-content:center}  .drfoot .drbtn > svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round;flex:none}
  .drfoot.icons .drbtn > svg{width:21px;height:21px}  .drfoot .drbtn .bi{display:inline-flex;align-items:center}
  .drfoot .drbtn .bi svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .drfoot.icons .drbtn .bi svg{width:21px;height:21px}
  .rplist .fico svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .rplist .fico.dir{color:var(--dim)}  .drfoot.icons .drbtn{width:46px;height:42px;padding:0;border-radius:12px;font-size:19px;
    display:grid;place-items:center;color:var(--fg);background:var(--card)}
  .drfoot.icons .drbtn:active{background:var(--bubble)}

  /* 标题行：连接点 + 标题 */
  header h1{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;max-width:100%;
    font-size:17px;font-weight:600;line-height:1.2;margin:0}
  .httltext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .httl{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%}
  .httl .dot{margin:0}
  /* 标题下方的会话用量条 */
  .dock .metabar{margin-top:6px;opacity:.92;padding-bottom:2px}
  .metabar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--dim);
    padding:0 16px 7px;background:var(--bg)}
  .metabar b{font-weight:600;color:var(--fg)}
  .metabar .run{color:var(--ok);font-weight:600}

  /* 轻提示 */
  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%, 12px);
    background:rgba(30,32,38,.94);color:#fff;font-size:13px;line-height:1.45;padding:9px 14px;
    border-radius:12px;max-width:80vw;z-index:999;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
    box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .toast.on{opacity:1;transform:translate(-50%, 0)}

  .bars{display:flex;align-items:flex-end;gap:6px;padding:12px 4px 4px;border-bottom:1px solid var(--line)}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .bar{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
  .barv{font-size:9.5px;color:var(--dim);white-space:nowrap}
  .barlbl{font-size:9.5px;color:var(--dim);white-space:nowrap}

  /* 消息时间分隔 */
  .sep{text-align:center;font-size:11.5px;color:var(--dim);margin:12px 0 6px;letter-spacing:.02em}

  .row .unread{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-left:2px}
  .row.hot .title{font-weight:650}
  /* 顶部 ☰ 的提醒角标：颜色 = 最该处理的一类（黄待处理 / 红失败 / 蓝完成 / 绿进行中），数字是该类会话数 */
  .has-attn{position:relative}
  .has-attn::after{content:attr(data-attn-n);position:absolute;top:0;right:-2px;min-width:15px;height:15px;
    padding:0 3px;border-radius:8px;display:grid;place-items:center;font-size:9px;font-weight:700;line-height:1;
    color:var(--accent-fg);background:var(--accent);box-shadow:0 0 0 2px var(--bg);letter-spacing:0}
  .has-attn.attn-pending::after{background:var(--warn);color:#1a1a1a}
  .has-attn.attn-failed::after{background:var(--bad)}
  .has-attn.attn-done::after{background:var(--accent)}
  .has-attn.attn-running::after{background:var(--ok)}
  /* 会话行右侧的三点菜单 */
  .row .rowmore{flex:none;width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:16px;opacity:.55;
    display:grid;place-items:center;margin-right:-4px;background:none;border:0;cursor:pointer}
  .row .rowmore svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}
  /* 归档页的「取消归档」是唯一动作，别再淡到看不见 */
  .row .rowmore.act{opacity:.9;color:var(--fg)}
  .row .rowmore:active{background:var(--bubble)}
  .pinmark{font-size:10px;margin-right:2px;opacity:.85}
  /* 「显示更多」：每个工作区默认只露 5 条会话 */
  .showmore{display:block;width:100%;background:none;border:0;border-top:1px dashed var(--line);
    color:var(--accent);font-size:12.5px;padding:10px 0 4px;margin-top:2px;text-align:center;
    font-family:inherit;cursor:pointer}

  /* 搜索栏 */
  .searchrow{padding:4px 0 10px;position:relative;display:flex;align-items:center}

  .searchrow .sico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}

    padding:9px 12px 9px 36px;font-size:15px;width:100%;transition:border-color 160ms ease, box-shadow 160ms ease}
  .searchrow input:focus{border-color:var(--line-2,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 8%,transparent)}
  .sres{padding:10px 10px;border-radius:12px}

    -webkit-box-orient:vertical;overflow:hidden}
  .sres .smeta{font-size:10.5px;color:var(--dim);margin-top:3px;opacity:.8}
  /* 搜索命中：只标命中的那几个字，别把整行染色（主色在纸面皮肤里接近黑，压字反而看不清） */
  .sres mark.hl{background:color-mix(in srgb, var(--accent) 16%, transparent);color:inherit;
    border-radius:3px;padding:0 1px}
  /* 统计页的活跃热力图：7 列（一周）一格一天，颜色深浅按输出 tokens */
  .heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;padding:12px 14px}

  .heatlegend{display:flex;align-items:center;gap:4px;justify-content:flex-end;

  .md blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--dim)}
  .md hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .md a{color:var(--accent);text-decoration:none}
  /* 消息里的图片：和待发缩略图同尺寸（64），横向排 */
  img{max-width:100%}
  .imgrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .imgrow .mdimg{margin:0}

  /* 点图看大图（支持双指缩放 / 双击 / 滚轮） */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;

  .steps:active{background:var(--bubble)}
  .steps .chev2{font-size:10px;flex:none}
  .steps .dim{color:var(--dim);font-size:11.5px;min-width:0}
  .stepsbody{margin:2px 0 10px 10px;padding-left:10px;border-left:1px solid var(--line)}
  .stepsbody .step{font-size:12px;color:var(--dim);padding:3px 0}

  .streamline{font-size:11.5px;color:var(--dim);padding:0 2px 4px}
  /* F1：过程进度（替代原来的 .streamline 单行；保留 .streamline class 让键盘规则继续生效） */
  .prog{padding:8px 13px 7px;margin-bottom:6px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;box-shadow:var(--shadow-card);transition:opacity .35s ease, transform .22s var(--ease-spring)}
  .prog:empty{display:none}
  .prog .row{display:flex;align-items:center;gap:7px;font-size:11.5px;line-height:1.4;color:var(--dim)}
  .prog .row b{font-size:12px;font-weight:650;color:var(--fg);letter-spacing:-.1px;flex:none}
  .prog .row .ltext{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
  .prog .row .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .prog .row .t{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--dim);flex:none}
  .prog .row .cv{flex:none;font-size:10px;color:var(--dim);opacity:.9}
  .prog .pdot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none;
    box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 15%,transparent);animation:dotpulse 2.2s ease-in-out infinite}
  .prog .pbar{height:2.5px;border-radius:2px;background:var(--line);margin-top:6px;overflow:hidden}
  .prog .pbar i{display:block;height:100%;background:var(--ok);border-radius:2px;position:relative;overflow:hidden;
    transition:width 280ms var(--ease-spring)}
  .prog .pbar:not(.indet) i::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    animation:pshimmer 1.8s linear infinite}
  @keyframes pshimmer{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
  .prog .pbar.indet i{width:32%;animation:pscan 1.3s cubic-bezier(.4,0,.2,1) infinite}
  .prog.donefade{opacity:0;transform:translateY(4px);transition:opacity .5s ease, transform .5s ease}
  @keyframes pscan{0%{transform:translateX(-110%)}55%{transform:translateX(170%)}100%{transform:translateX(360%)}}
  /* F2：朗读条（与进度条同位置，二选一；运行中优先进度条） */
  .prog .speak{display:flex;align-items:center;gap:8px;padding:0;font-size:11.5px;color:var(--dim)}
  .prog .speak .wave{display:flex;align-items:center;gap:2px;height:12px}
  .prog .speak .wave i{width:2px;border-radius:1px;background:var(--accent);opacity:.55}
  .prog .speak .x{margin-left:auto;font-size:11px;color:var(--fg);font-weight:600;flex:none}
  /* F2：按住说话的浮层（composer 上方，录音时替代进度条） */
  .voice{display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);
    border-radius:20px;padding:14px 16px;margin-bottom:8px}
  .voice .wv{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:38px;margin-bottom:8px}
  .voice .wv i{display:block;width:3px;border-radius:2px;background:var(--accent);opacity:.8}
  .voice .hint{text-align:center;font-size:12px;color:var(--dim)}
  .voice .hint b{color:var(--fg)}
  /* F1：过程面板（底部 sheet） */
  .stpsheet h2{font-size:15px;margin:0 0 2px}
  .stpsheet .sm{font-size:11.5px;color:var(--dim);margin-bottom:12px}
  .stpsheet .step{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start}
  .stpsheet .step:last-of-type{border-bottom:0}
  .stpsheet .sdot{width:16px;height:16px;border-radius:50%;flex:none;display:grid;place-items:center;
    font-size:9px;margin-top:2px}
  .stpsheet .sdot.done{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);font-weight:700}
  .stpsheet .sdot.now{background:var(--ok);color:#fff}
  .stpsheet .sdot.todo{border:1.5px solid var(--line);color:transparent}
  .stpsheet .sdot.err{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-weight:700}
  .stpsheet .sdot.stop{background:var(--bubble);color:var(--dim)}
  .stpsheet .step .tx{flex:1;font-size:13.5px;line-height:1.45}
  .stpsheet .step .tx span{display:block;font-size:11px;color:var(--dim);margin-top:1px}
  .stpsheet .step.now .tx{font-weight:600}
  .stpsheet .step.todo .tx,.stpsheet .step.stop .tx{color:var(--dim)}
  .stpsheet .sacts{display:flex;gap:10px;margin-top:14px}
  .stpsheet .sacts .btn{border-radius:14px;padding:11px}
  /* 运行状态：跟在对话流末尾，不再挂在输入框下面 */
  .typing{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);padding:8px 2px 10px;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- 审批 / 提问 ---------- */
  .card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px;margin:14px 0}
  /* 审批/提问卡提交后先收起再移除，避免对话流高度瞬间掉一截导致跳动 */
  .card.closing{box-sizing:border-box;overflow:hidden;will-change:height;
    transition:height .18s ease, opacity .18s ease, margin .18s ease, padding .18s ease, border-width .18s ease}
  .card .ct{font-size:13px;font-weight:650;color:var(--warn);margin-bottom:6px}
  .card .cfact{font-size:14px;margin:4px 0}
  .card .cmeta{font-size:12px;color:var(--dim);margin-top:4px}
  .card pre{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap;
    max-height:160px;overflow:auto;margin:8px 0 0}
  .acts{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:14px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
  .btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
  .qblock{padding:8px 0 4px;border-top:1px dashed var(--line)}
  .qblock:first-of-type{border-top:none;padding-top:0}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);
    border-radius:12px;margin-top:7px;background:var(--card);font-size:14px}
  .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
  .opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .rec{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;height:96px;resize:none;
    word-break:break-all}

  /* ---------- composer ---------- */
  .dock{padding:6px 12px calc(4px + var(--safe-b));background:var(--bg)}
  html.kb-open .dock{padding-bottom:0}
  html.kb-open .streamline, html.kb-open .prog{display:none}
  /* 待发送附件 */
  .attach{display:none;gap:8px;padding:2px 2px 8px;overflow-x:auto;scrollbar-width:none}
  .attach::-webkit-scrollbar{display:none}
  .att{position:relative;flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;
    background:var(--bubble);border:1px solid var(--line);display:grid;place-items:center}
  .att img{width:100%;height:100%;object-fit:cover}
  .att .attdoc{font-size:22px}
  /* 上传进度：底部进度条 + 居中百分比 */
  .att .attprog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .18s}
  .att .attpct{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;
    color:#fff;background:rgba(0,0,0,.38);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .att .attx{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
  .chips{display:flex;gap:8px;padding:2px 2px 8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--card)}
  .composer{background:var(--card);border:1px solid var(--line-2,var(--line));border-radius:24px;
    padding:11px 13px 10px;box-shadow:var(--shadow-dock);transition:border-color 160ms ease, box-shadow 160ms ease}
  .composer:focus-within{border-color:color-mix(in srgb,var(--accent) 28%,var(--line-2,var(--line)))}
  .composer textarea{resize:none;max-height:132px;min-height:24px;line-height:1.5;font-size:16px;display:block}
  /* 用 contenteditable 代替 textarea：iOS 不会挂那条 ^∨✓ 的输入辅助栏 */
  .composer .ta{min-height:24px;max-height:132px;overflow-y:auto;line-height:1.5;font-size:16px;
    outline:none;white-space:pre-wrap;word-break:break-word}
  .composer .ta:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
  .composer textarea::placeholder{color:var(--dim)}
  .crow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .chips{display:flex;align-items:center;gap:6px;flex:1;min-width:0;overflow:hidden;flex-wrap:wrap;row-gap:6px;align-content:center;padding:0}
  .chip2{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;flex:0 0 auto;min-width:0;
    background:var(--surface-2,var(--bubble));color:var(--dim);font-size:11.5px;letter-spacing:-.01em;white-space:nowrap;
    flex:none;max-width:60%;transition:transform 120ms var(--ease-press), background-color 140ms ease}
  .chip2:active{transform:scale(.95);opacity:.85}
  /* 新会话页：大输入框 + 工作区/模式 chips；和 composer 用同一套 chip 观感 */
  .newpage{display:flex;flex-direction:column;flex:1;min-height:0}
  .newbox{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;
    padding:12px 14px calc(14px + var(--safe-b))}
  .newta{width:100%;min-height:132px;max-height:46vh;resize:none;box-sizing:border-box;
    border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);
    padding:14px 15px;font-family:inherit;font-size:15.5px;line-height:1.55;outline:none;
    caret-color:var(--accent)}
  .newta::placeholder{color:var(--dim)}
  .newta:focus{border-color:color-mix(in srgb,var(--accent) 38%,var(--line))}
  .newchips{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chip2.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
  .chip2.on b{color:var(--accent)}
  .newchips .send{width:38px;height:38px;min-width:38px;border-radius:50%;flex:none}
  .newhint{font-size:11.5px;color:var(--dim);line-height:1.6;padding:0 2px}
  .chip2 b{font-weight:600;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .chip2.danger{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);
    border:1px solid color-mix(in srgb,var(--bad) 35%,var(--line))}
  .chip2.danger .ci{color:var(--bad)}
  .chip2.danger b{color:var(--bad)}  .chip2 .ci{display:grid;place-items:center;color:var(--dim)}
  .chip2 .ci svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .plus{width:34px;height:34px;border-radius:50%;background:var(--bubble);display:grid;place-items:center;font-size:17px;color:var(--dim);flex:none}
  .perm{height:30px;padding:0 9px;border-radius:999px;background:var(--bubble);border:1px solid var(--line);
    color:var(--dim);font-size:11.5px;display:inline-flex;align-items:center;gap:3px;flex:none;white-space:nowrap}
  .perm.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line));
    background:color-mix(in srgb,var(--bad) 9%,var(--card))}
  .perm:active{background:var(--card)}
  .model{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;min-width:0;flex:1;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .sendgroup{display:flex;align-items:center;gap:8px;flex:none;margin-left:auto}
  .model b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
    border-radius:6px;padding:1px 6px;flex:none}
  .send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;
    place-items:center;font-size:16px;flex:none;margin-left:auto;box-shadow:0 2px 10px color-mix(in srgb,var(--accent) 32%,transparent);
    transition:transform 140ms var(--ease-spring), opacity 160ms ease, box-shadow 160ms ease}
  .send:active{transform:scale(.90)}
  .send:disabled{opacity:.4;box-shadow:none}
  /* 空输入时发送占位但不响应（麦克风常驻在它左边） */
  .send.off{opacity:.35;pointer-events:none;box-shadow:none}
  .mic{width:34px;height:34px;border-radius:50%;background:var(--surface-2,var(--bubble));color:var(--fg);
    display:grid;place-items:center;font-size:16px;flex:none;border:1px solid var(--line);
    transition:transform 120ms var(--ease-press), background-color 140ms ease;
    user-select:none;-webkit-user-select:none;touch-action:none;-webkit-touch-callout:none;
    -webkit-user-drag:none}
  .mic:active{transform:scale(.92)}
  .mic.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);transform:scale(1.06)}
  /* 线性图标（与 app 其它 icon 同一套 stroke 语言），不用 emoji */
  .mic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;
    stroke-linecap:round;stroke-linejoin:round;display:block}
  .mic.on svg{stroke-width:2}
  .mact button .ic svg{width:13.5px;height:13.5px;stroke:currentColor;fill:none;stroke-width:1.75;
    stroke-linecap:round;stroke-linejoin:round;display:block}
  .stop{width:34px;height:34px;border-radius:50%;background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);
    display:none;place-items:center;font-size:13px;flex:none;border:1px solid color-mix(in srgb,var(--bad) 26%,transparent);
    transition:transform 120ms var(--ease-press), background-color 140ms ease}
  .stop:active{transform:scale(.90)}
  /* 回到底部：悬浮在输入框外部的右上角 */
  .jump{position:absolute;right:14px;bottom:calc(var(--dock-h, 92px) + 10px);z-index:20;
    display:none;align-items:center;gap:4px;font-size:12px;color:var(--fg);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    box-shadow:0 3px 12px rgba(0,0,0,.14)}
  .jump.on{display:inline-flex}
  .meta{font-size:11.5px;color:var(--dim);text-align:center;padding-top:7px}

  /* ---------- 空态/错误 ---------- */
  .empty{color:var(--dim);text-align:center;padding:56px 20px;font-size:14px;line-height:1.8}
  .err{color:var(--bad);font-size:13px;margin-top:10px;word-break:break-word}
  /* 下拉刷新 */
  .ptr{height:0;overflow:hidden;opacity:0;text-align:center;font-size:12px;color:var(--dim);
    transition:height .16s ease,opacity .16s ease;will-change:height}
  .ptr.on{opacity:1}

  /* ---------- sheet ---------- */
  .mask{position:fixed;inset:0;background:rgba(10,11,13,.38);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:flex;align-items:flex-end;justify-content:center;z-index:2000;animation:fade 180ms ease;
    transition:opacity 180ms ease}
  .mask.closing{opacity:0;pointer-events:none}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:28px 28px 0 0;
    padding:8px 18px calc(14px + var(--safe-b));border-top:1px solid var(--line-2,var(--line));
    box-shadow:0 -18px 46px -14px rgba(10,11,13,.42);
    max-height:calc(100vh - 20px);max-height:calc(100dvh - 20px);
    overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
    animation:up 280ms var(--ease-spring);transition:transform 200ms cubic-bezier(.4,0,1,1)}
  .mask.closing .sheet{transform:translateY(100%)}
  /* 矮屏（SE / 横屏 / 键盘弹起）压缩行高，尽量少滚 */
  @media (max-height:700px){
    .sheet .item{padding:9px 4px;font-size:14.5px}
    .sheet .sic{width:26px;height:26px;border-radius:8px}
    .sheet .grab{margin:0 auto 8px}
    .sheet .shead{font-size:16.5px;padding:0 4px 6px}
    .sheet .cancel{margin-top:6px;padding:10px}
  }
  @keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line-2,var(--line));
    margin:2px auto 14px;position:sticky;top:0;z-index:2;flex:none}
  .sheet .shead{font-size:18px;font-weight:650;letter-spacing:-.02em;padding:0 4px 10px;
    position:sticky;top:0;z-index:1;background:var(--card)}
  .sheet .item .chk{margin-left:auto;color:var(--accent);display:grid;place-items:center;flex:none}
  .sheet .item .chk svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;
    stroke-linecap:round;stroke-linejoin:round}
  .sheet .item{display:flex;align-items:center;gap:12px;padding:13px 4px;font-size:15px;
    border:0;border-top:1px solid var(--line);width:100%;background:none;font-family:inherit;
    color:inherit;text-align:left;cursor:pointer;-webkit-appearance:none;appearance:none}
  .sheet .sl2{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .sheet .sl2 .ilabel{flex:none}
  .sheet .ssub{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;letter-spacing:.01em}
  .sheet:focus,.sheet:focus-visible{outline:none}
  .sheet .item:focus{outline:none}
  .sheet .item:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:10px}
  .sheet .item:active{background:var(--bubble)}
  .sheet .sic svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;
    stroke-linecap:round;stroke-linejoin:round}
  .sheet .sic{width:30px;height:30px;border-radius:9px;background:var(--bubble);flex:none;
    display:grid;place-items:center;font-size:14px;color:var(--dim);line-height:1}
  .sheet .ilabel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sheet .cancel{margin-top:10px;text-align:center;padding:12px;border-radius:12px;
    border:1px solid var(--line);color:var(--dim);font-size:14px;width:100%;background:none;
    font-family:inherit;cursor:pointer;-webkit-appearance:none;appearance:none}
  .sheet .ver{text-align:center;font-size:11px;color:var(--dim);opacity:.7;padding:6px 0 0;
    font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.04em}
  .pair{height:var(--vvh,100dvh);min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    display:flex;flex-direction:column;justify-content:flex-start;gap:12px;
    padding:calc(40px + var(--safe-t)) 28px calc(32px + var(--safe-b));max-width:420px;margin:0 auto}
  .pair .btn{flex:none;width:100%}
  .pair input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    font-size:20px;letter-spacing:6px;text-align:center;user-select:text;-webkit-user-select:text}
  /* 缁堢 overlay */
  .termoverlay{position:fixed;inset:0;z-index:1200;background:var(--bg);display:flex;flex-direction:column}
  .termbar{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;border-bottom:1px solid var(--line);background:var(--card);flex:0 0 auto}

// 版本自检：本地 APP_VERSION / SW 缓存 vs 线上 /VERSION（Caddy 静态目录里那份）

async function openVersionCheck() {
  const rows = [['本地 APP', APP_VERSION]];
  try {
    const sw = await fetch('./sw.js', { cache:'no-store' }).then(r => r.text());
    const m = /const CACHE = '([^']+)'/.exec(sw);
    rows.push(['本地 SW 缓存', m ? m[1] : '?']);
  } catch { rows.push(['本地 SW 缓存', '读不到']); }
  try {
    const r = await fetch('./VERSION', { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const txt = await r.text();
    // dev-proxy 没有 VERSION 时会 SPA 兜底回 index.html，不能把 HTML 当版本戳解析
    if (txt.trim().startsWith('<')) throw new Error('不是 VERSION 文件（本地开发正常）');
    const appM = /^app=(v\d+)/m.exec(txt);
    if (!appM) throw new Error('VERSION 内容不合法');
    const app = appM[1];
    const swv = (/^sw=([^\n]+)/m.exec(txt) || [])[1] || '?';
    const commit = (/^commit=([^\n]+)/m.exec(txt) || [])[1] || '?';
    rows.push(['线上 VERSION', `${app} / ${swv} / ${commit}`]);
    rows.push(['是否一致', app === APP_VERSION ? '✅ 一致' : `⚠️ 本地 ${APP_VERSION}，线上 ${app}`]);
  } catch (e) {
    rows.push(['线上 VERSION', '读不到：' + (e.message || e)]);
  }
  openInfoBox('版本自检', rows);
}

// 旧版宿主会返回全量，这时用「全量 − 默认列表」做差集兜底。
// 判据：返回里出现了默认列表中的会话 → 说明它给的是全量。
// 两边都带 fresh=1，避免 30 秒缓存让差集把「刚取消归档的」又算回归档里。

async function loadArchived() {
  const tok = state.token;
  try {
    const [all, act] = await Promise.all([
      api('/api/mobile/v1/sessions?archived=1&fresh=1'),
      api('/api/mobile/v1/sessions?fresh=1'),
    ]);
    if (state.token !== tok) return;   // 退登/换账号后回来的旧响应：别写进新账号的列表和缓存
    const allItems = Array.isArray(all.items) ? all.items : [];

    const activeItems = gotActive ? act.items : [];
    const activeIds = new Set(activeItems.map(x => x.sessionId));
    const looksFullList = allItems.some(x => activeIds.has(x.sessionId));
    state.archived = looksFullList ? allItems.filter(x => !activeIds.has(x.sessionId)) : allItems;

}

    ui.atBottom = true;
    const pin = () => {
      if (!ui || !ui.body || !ui.atBottom) return;
      try { ui.body.scrollTop = ui.body.scrollHeight; } catch {}
    };
    [0, 120, 320, 700, 1000].forEach(ms => setTimeout(pin, ms));
  });
  // 输入 `/` 弹指令面板，输入 `@` 弹文件引用
  const slashBox = el('div', { class:'slash' });
  async function updateHints() {
    const t = getText();
    const show = (nodes) => {
      slashBox.replaceChildren();
      slashBox.style.display = nodes.length ? 'block' : 'none';
      for (const n of nodes) slashBox.append(n);
    };

    // /指令
    if (/^\/[^\s]*$/.test(t)) {
      const q = t.slice(1).toLowerCase();
      const list = await ensureCommands();
      const hits = list.filter(c => String(c.name || '').toLowerCase().includes(q)).slice(0, 8);
      if (!hits.length) {
        // 有前缀但没匹配：也要给一行反馈，否则面板"消失"像是坏了
        return show([el('div', { class:'sitem' },
          el('b', { text:'没有匹配的指令' }),
          el('span', { class:'sdesc', text:`试试 /help 或直接发送` }))]);
      }
      return show(hits.map(c => el('div', { class:'sitem', onclick: () => {
        ta.textContent = `/${c.name} `;
        slashBox.replaceChildren(); slashBox.style.display = 'none';
        syncInputButtons();
        ta.focus(); caretToEnd();
      }}, el('b', { text: `/${c.name}` }), c.description ? el('span', { class:'sdesc', text: c.description }) : null)));
    }

    // @文件引用：支持 `@子目录/` 逐层往下
    const at = /(^|\s)@([^\s]*)$/.exec(t);
    if (at) {
      const typed = at[2];
      const slash = typed.lastIndexOf('/');
      const dirPart = slash >= 0 ? typed.slice(0, slash) : '';
      const q = (slash >= 0 ? typed.slice(slash + 1) : typed).toLowerCase();
      const base = state.sessionCwd || '';
      if (!base) return show([]);
      const dir = dirPart ? base.replace(/[\\/]+$/, '') + '\\' + dirPart.replace(/\//g, '\\') : base;
      let entries = [];
      try {
        const r = await api('/api/mobile/v1/directory/listing?path=' + encodeURIComponent(dir));
        entries = (r.listing && r.listing.entries) || [];
      } catch { entries = []; }
      const hits = entries
        .filter(e => !e.hidden && String(e.name || '').toLowerCase().includes(q))
        .sort((a, b) => (a.kind === 'folder' ? 0 : 1) - (b.kind === 'folder' ? 0 : 1))
        .slice(0, 10);
      if (!hits.length) {
        return show([el('div', { class:'sitem' },
          el('b', { text:'没有匹配的文件' }),
          el('span', { class:'sdesc', text: dir }))]);
      }
      return show(hits.map(e => el('div', { class:'sitem', onclick: () => {
        const token = /(^|\s)@([^\s]*)$/.exec(getText());
        const before = token ? getText().slice(0, token.index) : '';
        const prefix = before && !before.endsWith(' ') ? ' ' : '';
        if (e.kind === 'folder') {
          // 文件夹只补到 `@dir/`，继续往下选
          const nextDir = dirPart ? `${dirPart}/${e.name}` : e.name;
          ta.textContent = `${before}${prefix}@${nextDir}/`;
          ta.focus(); caretToEnd();
          syncInputButtons();
          updateHints();
          return;
        }
        const ref = /\s/.test(e.path) ? `"${e.path}"` : e.path;
        ta.textContent = `${before}${prefix}${ref} `;
        slashBox.replaceChildren(); slashBox.style.display = 'none';
        syncInputButtons();
        ta.focus(); caretToEnd();
      }},
        el('b', { text: (e.kind === 'folder' ? '📁 ' : '📄 ') + e.name }),
        el('span', { class:'sdesc', text: e.kind === 'folder' ? '继续往下' : e.path }))));
    }

    show([]);
  }
  ta.addEventListener('input', () => {
    updateHints();
    syncInputButtons();
    clearTimeout(ta._ht);
    ta._ht = setTimeout(updateHints, 260);   // 兜底：等异步列表回来后再刷一次
    clearTimeout(ta._dt);
    ta._dt = setTimeout(() => saveDraft(state.sessionId, getText()), 400);
  });
  ta.addEventListener('keyup', () => updateHints());
  // 恢复未发送的草稿
  const draft = getDrafts()[state.sessionId];

  const sendBtn = el('button', { class:'send', text:'↑', onclick: () => send() });

  // ---- F2 按住说话 ----
  // 能力存在就常驻麦克风（不再按设置隐藏）；dsh.speech.hold 只决定「按住是否启动识别」。
  const speechCtor = speechRecogCtor();
  const voiceBar = el('div', { class:'voice' },
    el('div', { class:'wv' }, ...[10, 22, 34, 18, 30, 38, 24, 14, 28, 36, 20, 12].map(h => el('i', { style:`height:${h}px` }))),
    el('div', { class:'hint' }));

    ? el('button', { class:'mic', type:'button', html: sheetIconSVG('mic'), title:'按住说话', 'aria-label':'按住说话' })
    : null;

  function setVoiceHint(cancel) {
    const hint = voiceBar.querySelector('.hint');
    if (!hint) return;
    hint.replaceChildren();
    if (cancel) hint.append(document.createTextNode('松开取消'));

  setVoiceHint(false);

  // 🎙 和 ↑ 常驻：空输入时 ↑ 半透明不响应，有文字/附件时 ↑ 正常；麦克风一直可见，
  // 但输入非空或设置关掉「按住说话」时按住不启动识别（静默）。
  let composerHasText = false;
  function syncSendDisabled() {
    const blocked = !!state.sending || (state.pending || []).some(a => a.uploading) || !!queueState.editing;
    sendBtn.disabled = blocked || !composerHasText;
    sendBtn.classList.toggle('off', !composerHasText);
  }
  function syncInputButtons() {
    composerHasText = !!getText().trim() || !!(state.pending || []).length;
    if (micBtn) {
      const rec = !!(state.rec && state.rec.sid === state.sessionId);
      const holdOn = speechHoldOn();
      micBtn.title = !holdOn ? '按住说话已在设置里关闭'
        : rec ? '松开结束，上滑取消'
        : composerHasText ? '请先清空输入' : '按住说话';

    }
    syncSendDisabled();
    if (ui && ui.sessionId === state.sessionId) ui.hasText = composerHasText;
  }

  function applyVoiceText(rec) {
    if (!rec || !rec.transcript) return;
    const base = rec.base || '';
    const sep = base && !/\s$/.test(base) ? ' ' : '';
    ta.textContent = base + sep + rec.transcript;
    try { caretToEnd(); } catch {}
    syncInputButtons();
  }

  function finishVoice(doSend) {
    const rec = state.rec;
    if (!rec) return;
    state.rec = null;
    try { rec.recog.abort(); } catch {}
    if (micBtn) micBtn.classList.remove('on');
    setVoiceHint(false);
    if (rec.cancelled || !String(rec.transcript || '').trim()) {
      // 取消 / 没识别出字：把输入框还给用户原来的内容
      ta.textContent = rec.base || '';
      saveDraft(state.sessionId, getText());
    } else {
      applyVoiceText(rec);
      saveDraft(state.sessionId, getText());
      // 2026-11-25 用户决策：松手**不自动发送**——识别结果只落进输入框，留给用户改完再按 ↑。
      try { ta.focus(); caretToEnd(); } catch {}
