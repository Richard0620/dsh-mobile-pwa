<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI-HUB">
<title>AI-HUB</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#ffffff; --fg:#111318; --dim:#8a8f98; --line:#e9e9ee;
    --bubble:#ededf0; --accent:#2f6bff; --accent-2:#5b8cff; --ok:#2ea043; --bad:#e5484d; --warn:#b58100;
    --r-card:24px; --r-bubble:20px;
    --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0e1014; --card:#171a20; --fg:#e8eaee; --dim:#8d94a0; --line:#242933;
      --bubble:#22262e; --accent:#4f8cff; --accent-2:#6ea4ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
    }
  }
  /* 大屏手机（16 Pro Max 这类 430pt+）：正文字号与内边距略微放大，行宽不至于太松 */
  @media (min-width: 430px){
    main{padding-left:16px;padding-right:16px}
    .md{font-size:15.5px;line-height:1.65}
    .msg.user .bubble{font-size:15.5px}
    .dock{padding-left:14px;padding-right:14px}
    header{padding-left:12px;padding-right:12px}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{height:100%;overflow:hidden}
  html,body{height:100%;-webkit-text-size-adjust:100%}
  /* iOS 键盘弹起会把整页往上顶；把 body 钉死在视口里，就没有可平移的余地 */
  body{position:fixed;inset:0;overflow:hidden}
  /* iOS 在输入框字号 <16px 时会把整页放大，所以表单控件一律 ≥16px */
  input,textarea,select{font-size:16px}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",sans-serif;
    overscroll-behavior-y:none;overscroll-behavior-x:none;overflow-x:hidden;
    -webkit-font-smoothing:antialiased}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:inherit;background:transparent;border:none;outline:none;width:100%}
  .app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;height:var(--vvh, 100dvh);background:var(--bg);position:relative}
  /* 宽屏两栏 */
  .app.wide{max-width:none;flex-direction:row;align-items:stretch}
  .app.wide .side{width:330px;flex:none;min-width:0;display:flex;flex-direction:column;
    border-right:1px solid var(--line);height:100%;overflow:hidden;background:var(--bg)}
  .app.wide .pane{flex:1;min-width:0;display:flex;flex-direction:column;height:100%;position:relative}
  .app.wide .side .list{padding-bottom:12px}
  .paneempty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--dim);text-align:center;padding:24px}

  /* ---------- 顶栏 ---------- */
  header{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:4px;
    padding:calc(6px + var(--safe-t)) 10px 6px;min-height:48px}
  header h1{font-size:16px;font-weight:600;margin:0;text-align:center;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;letter-spacing:.2px}
  .ico{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--fg);font-size:17px;line-height:1}
  .ico:active{background:var(--bubble)}

  main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(8px + var(--safe-b))}

  /* ---------- 首页（新会话） ---------- */
  .home{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding-bottom:60px}
  .logo{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700;letter-spacing:-.5px}
  .logo .mark{width:44px;height:44px;border-radius:12px;background:var(--fg);color:var(--bg);
    display:grid;place-items:center;font-size:22px}
  .beta{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);
    padding:2px 6px;border-radius:6px;font-weight:600;transform:translateY(-10px)}

  /* ---------- 会话列表 ---------- */
  .tabs{display:flex;gap:18px;padding:6px 2px 0;color:var(--dim);font-size:14px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .tabs b{color:var(--dim);font-weight:550;position:relative;padding:0 0 8px;cursor:pointer;
    border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs b.on{color:var(--fg);font-weight:600;border-bottom-color:var(--accent)}
  .group{margin:6px 0 14px}
  .ghead{display:flex;align-items:center;gap:8px;padding:8px 2px;font-size:13px;color:var(--dim)}
  .ghead .gname{font-weight:600;color:var(--fg);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ghead .chev{font-size:10px;transition:transform .18s;color:var(--dim)}
  .ghead.closed .chev{transform:rotate(-90deg)}
  .branch{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1px 7px;flex:none}
  .count{font-size:11px;color:var(--dim);flex:none}
  .row{display:flex;gap:10px;align-items:flex-start;padding:11px 10px;border-radius:14px}
  .row:active{background:var(--bubble)}
  .row .body{flex:1;min-width:0}
  .row .t{display:flex;align-items:center;gap:7px}
  .row .title{font-size:15px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .row .time{font-size:12px;color:var(--dim);flex:none}
  .row .prev{font-size:13px;color:var(--dim);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--dim);opacity:.45;flex:none;margin-top:7px}
  .dot.run{background:var(--ok);opacity:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 18%,transparent)}

  /* ---------- 会话详情 ---------- */
  .msg{margin:14px 0}
  .mholder{display:flex;flex-direction:column}
  /* 排队中的消息 */
  .qlist{display:flex;flex-direction:column;gap:8px;margin:12px 0 4px}
  .qitem{border:1px dashed var(--line);border-radius:14px;padding:9px 12px;background:var(--card);opacity:.92}
  .qhead{display:flex;align-items:center;gap:6px;margin-bottom:5px}
  .qtag{font-size:10.5px;color:var(--warn);border:1px solid var(--warn);border-radius:999px;padding:1px 7px}
  .qmini{font-size:11.5px;color:var(--dim);padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg)}
  .qmini.primary{color:#fff;background:var(--accent);border-color:var(--accent)}
  .qtext{font-size:14.5px;color:var(--fg);white-space:pre-wrap;word-break:break-word;opacity:.9}

  /* 每条消息下方的操作行（复制 / 分支） */
  .mact{display:flex;gap:8px;margin-top:6px;font-size:12px;color:var(--dim)}
  .msg.user ~ .mact, .mact.right{justify-content:flex-end}
  .mact button{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;
    color:var(--dim);font-size:12px;background:var(--card);border:1px solid var(--line);line-height:1.1}
  .mact button:active{background:var(--bubble);color:var(--fg)}
  .msg.user{display:flex;justify-content:flex-end}
  .msg.user .bubble{background:var(--bubble);border-radius:var(--r-bubble);padding:9px 13px;
    max-width:82%;white-space:pre-wrap;word-break:break-word;font-size:15px}
  .md{font-size:15px;line-height:1.62;word-break:break-word}
  .md > :first-child{margin-top:0}
  .md > :last-child{margin-bottom:0}
  .md h1,.md h2,.md h3{margin:16px 0 8px;line-height:1.35;font-weight:650}
  .md h1{font-size:20px}.md h2{font-size:18px}.md h3{font-size:16px}
  .md p{margin:9px 0}
  .md ul,.md ol{margin:8px 0;padding-left:22px}
  .md li{margin:3px 0}
  .md code{font:.9em/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
    background:color-mix(in srgb,var(--fg) 7%,transparent);padding:1.5px 5px;border-radius:5px}
  .md pre.code{background:#1b1f27;color:#e6e9ef;padding:12px 14px;border-radius:12px;overflow-x:auto;margin:10px 0}
  .md pre.code code{background:none;padding:0;color:inherit;font-size:12.5px;line-height:1.55}
  /* 代码高亮 */
  .md pre.code .k{color:#c792ea}
  .md pre.code .s{color:#c3e88d}
  .md pre.code .c{color:#6b7394;font-style:italic}
  .md pre.code .n{color:#f78c6c}
  /* 文件浏览 */
  .crumbs{display:flex;gap:4px;flex-wrap:wrap;padding:6px 2px 10px;font-size:12.5px;color:var(--dim)}
  .crumb{padding:3px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card)}
  .crumb:active{background:var(--bubble)}
  .frow{display:flex;align-items:center;gap:10px;padding:11px 8px;border-radius:12px}
  .frow:active{background:var(--bubble)}
  .fico{width:22px;text-align:center;flex:none}
  .fname{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filepv{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--fg);white-space:pre-wrap;
    word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:10px;margin:0;max-height:60vh;overflow:auto}

  /* 斜杠指令面板 */
  .slash{display:none;max-height:210px;overflow:auto;background:var(--card);border:1px solid var(--line);
    border-radius:14px;margin:0 0 8px;padding:4px}
  .sitem{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:10px}
  .sitem:active{background:var(--bubble)}
  .sitem b{font-size:13.5px}
  .sitem .sdesc{font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 键值面板 */
  .kvrow{display:flex;gap:12px;padding:9px 8px;border-bottom:1px solid var(--line);font-size:13.5px}
  .kvrow:last-child{border-bottom:none}
  .kvrow .kk{color:var(--dim);flex:none;min-width:84px}
  .kvrow .vv{flex:1;text-align:right;word-break:break-all}
  .offbar{position:fixed;left:0;right:0;top:0;z-index:998;background:var(--warn);color:#1a1a1a;
    font-size:12px;text-align:center;padding:4px 8px;transform:translateY(-100%);transition:transform .2s}
  .offbar.on{transform:none}

  /* 右侧文件面板 */
  .rpanel-mask{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.32);display:flex;
    justify-content:flex-end;opacity:0;transition:opacity .2s}
  .rpanel-mask.on{opacity:1}
  /* 和左侧会话抽屉保持同一套尺寸/阴影/行样式 */
  .rpanel{width:86%;max-width:360px;height:100%;background:var(--bg);display:flex;flex-direction:column;
    transform:translateX(100%);transition:transform .22s ease;box-shadow:-2px 0 20px rgba(0,0,0,.18);overflow:hidden}
  .rpanel-mask.on .rpanel{transform:none}
  .rphead{display:flex;align-items:center;gap:4px;padding:calc(10px + var(--safe-t)) 10px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .rphead b{font-size:16px;font-weight:600;margin-left:4px}
  .rpbody{flex:1;overflow-y:auto;padding:8px 12px calc(12px + var(--safe-b));display:flex;flex-direction:column}
  .rpfilter{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;
    font-size:15px;width:100%;margin-bottom:8px}
  .rpcount{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--dim);padding:4px 2px 6px}
  .rplist .frow{padding:12px 4px;border-radius:10px;font-size:14.5px}
  .rplist .frow.sel{background:var(--bubble)}
  .rplist .frow .fico{width:22px;text-align:center;flex:none}
  .rplist .chev{color:var(--dim);font-size:14px;flex:none}
  .rpsect{font-size:11.5px;color:var(--dim);padding:8px 2px 2px}

  /* 全屏文件查看器 */
  .viewer{position:fixed;inset:0;z-index:1100;background:var(--bg);display:flex;flex-direction:column}
  .vhead{display:flex;align-items:center;gap:6px;padding:calc(8px + var(--safe-t)) 10px 6px}
  .vtitle{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
  .vmeta{font-size:11px;color:var(--dim);padding:0 14px 6px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .vtools{display:flex;gap:8px;padding:0 12px 8px;border-bottom:1px solid var(--line);flex:none}
  .vtool{font-size:12px;color:var(--dim);padding:5px 10px;border:1px solid var(--line);
    border-radius:999px;background:var(--card)}
  .vtool.on{color:var(--fg);border-color:var(--accent)}
  .vfind{display:none;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--line);flex:none}
  .vfind.on{display:flex}
  .vfind input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;
    padding:6px 10px;font-size:14px}
  .vcount{font-size:11px;color:var(--dim);min-width:48px;text-align:center}
  .vbody{flex:1;overflow:auto;margin:0;padding:6px 8px calc(16px + var(--safe-b));
    font:12px/1.55 ui-monospace,Consolas,monospace;counter-reset:vline}
  .vbody .vline{counter-increment:vline;white-space:pre-wrap;word-break:break-word;
    padding-left:3.4em;text-indent:-3.4em}
  .vbody.nowrap .vline{white-space:pre;text-indent:0;padding-left:0}
  .vbody .vline::before{content:counter(vline);display:inline-block;width:2.6em;margin-right:8px;
    text-align:right;color:var(--dim);opacity:.6;user-select:none}
  .vbody.nowrap .vline::before{display:none}
  .vbody .vline.hit{background:rgba(255,214,0,.22)}

  /* 左侧抽屉（独立于 .mask，避免被 .mask 的 flex-end/center 拉歪） */
  .drawer-mask{position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.32);
    display:flex;align-items:stretch;justify-content:flex-start;opacity:0;transition:opacity .2s}
  .drawer-mask.on{opacity:1}
  .drawer{width:86%;max-width:360px;height:100%;max-height:100%;background:var(--bg);
    display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s ease;
    box-shadow:2px 0 20px rgba(0,0,0,.18);overflow:hidden}
  .drawer-mask.on .drawer{transform:none}
  .drhead{display:flex;align-items:center;gap:4px;padding:calc(10px + var(--safe-t)) 10px 8px;
    border-bottom:1px solid var(--line);flex:none}
  .drhead b{font-size:16px;font-weight:600;margin-left:6px}
  .drlist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .drfoot{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px calc(10px + var(--safe-b));
    border-top:1px solid var(--line);flex:none}
  .drbtn{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
    border-radius:999px;padding:6px 10px}

  /* 标题行：连接点 + 标题 */
  header h1{display:flex;align-items:center;justify-content:center;gap:6px;min-width:0;max-width:100%;
    font-size:17px;font-weight:600;line-height:1.2;margin:0}
  .httltext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .httl{display:flex;align-items:center;gap:7px;min-width:0;max-width:100%}
  .httl .dot{margin:0}
  /* 标题下方的会话用量条 */
  .metabar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:11px;color:var(--dim);
    padding:0 16px 7px;background:var(--bg)}
  .metabar b{font-weight:600;color:var(--fg)}
  .metabar .run{color:var(--ok);font-weight:600}

  /* 轻提示 */
  .toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%, 12px);
    background:rgba(30,32,38,.94);color:#fff;font-size:13px;line-height:1.45;padding:9px 14px;
    border-radius:12px;max-width:80vw;z-index:999;opacity:0;pointer-events:none;transition:opacity .18s, transform .18s;
    box-shadow:0 6px 20px rgba(0,0,0,.28)}
  .toast.on{opacity:1;transform:translate(-50%, 0)}

  .bars{display:flex;align-items:flex-end;gap:6px;padding:12px 4px 4px;border-bottom:1px solid var(--line)}
  .barcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
  .bar{width:100%;max-width:26px;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
  .barv{font-size:9.5px;color:var(--dim);white-space:nowrap}
  .barlbl{font-size:9.5px;color:var(--dim);white-space:nowrap}

  /* 消息时间分隔 */
  .sep{text-align:center;font-size:11.5px;color:var(--dim);margin:12px 0 6px;letter-spacing:.02em}

  .row .unread{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none;margin-left:2px}
  .row.hot .title{font-weight:650}
  /* 顶部图标上的"有待查看"小红点 */
  .has-attn{position:relative}
  .has-attn::after{content:'';position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
    background:#ff3b30;box-shadow:0 0 0 2px var(--bg)}
  /* 会话行右侧的三点菜单 */
  .row .rowmore{flex:none;width:30px;height:30px;border-radius:50%;color:var(--dim);font-size:16px;
    display:grid;place-items:center;margin-right:-4px}
  .row .rowmore:active{background:var(--bubble)}
  .pinmark{font-size:10px;margin-right:2px;opacity:.85}

  /* 搜索栏 */
  .searchrow{padding:2px 2px 8px}
  .searchrow input{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:9px 12px;font-size:15px;width:100%}
  .sres{padding:10px 10px;border-radius:12px}
  .sres:active{background:var(--bubble)}
  .sres .st{font-size:14.5px;font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sres .ss{font-size:12.5px;color:var(--dim);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;
    -webkit-box-orient:vertical;overflow:hidden}
  .md blockquote{margin:10px 0;padding:2px 12px;border-left:3px solid var(--line);color:var(--dim)}
  .md hr{border:none;border-top:1px solid var(--line);margin:14px 0}
  .md a{color:var(--accent);text-decoration:none}
  /* 消息里的图片：和待发缩略图同尺寸（64），横向排 */
  img{max-width:100%}
  .imgrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .imgrow .mdimg{margin:0}
  .md img,.mdimg,.msg .mdimg{width:64px;height:64px;object-fit:cover;border-radius:10px;
    margin:4px 6px 4px 0;display:inline-block;vertical-align:top;background:var(--bubble)}
  .md img{cursor:zoom-in}
  /* 点图看大图 */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:flex;align-items:center;
    justify-content:center;z-index:90;padding:14px;animation:fade .14s ease}
  .lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px}
  .lightbox .lbclose{position:absolute;top:calc(12px + var(--safe-t));right:14px;width:34px;height:34px;
    border-radius:50%;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;font-size:15px}
  .lightbox .lbhint{position:absolute;bottom:calc(20px + var(--safe-b));left:0;right:0;text-align:center;
    color:rgba(255,255,255,.62);font-size:12px}
  .md .imgph{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);
    border:1px dashed var(--line);border-radius:8px;padding:2px 8px;margin:2px 0}
  .md .tbl{margin:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .md table{border-collapse:collapse;font-size:13px;width:100%;table-layout:auto}
  .md th,.md td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;
    white-space:normal;word-break:break-word;overflow-wrap:anywhere;vertical-align:top;line-height:1.45}
  .md th{color:var(--dim);font-weight:600;font-size:12.5px}
  .tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .tool{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  /* 回合折叠 */
  .steps{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);
    border:1px solid var(--line);border-radius:10px;padding:6px 10px;margin:8px 0;cursor:pointer;max-width:100%}
  .steps:active{background:var(--bubble)}
  .steps .chev2{font-size:10px;flex:none}
  .steps .dim{color:var(--dim);font-size:11.5px;min-width:0}
  .stepsbody{margin:2px 0 10px 10px;padding-left:10px;border-left:1px solid var(--line)}
  .stepsbody .step{font-size:12px;color:var(--dim);padding:3px 0}

  .streamline{font-size:11.5px;color:var(--dim);padding:0 2px 4px}
  /* 运行状态：跟在对话流末尾，不再挂在输入框下面 */
  .typing{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--dim);padding:8px 2px 10px}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}

  /* ---------- 审批 / 提问 ---------- */
  .card{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:13px;margin:14px 0}
  .card .ct{font-size:13px;font-weight:650;color:var(--warn);margin-bottom:6px}
  .card .cfact{font-size:14px;margin:4px 0}
  .card .cmeta{font-size:12px;color:var(--dim);margin-top:4px}
  .card pre{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);white-space:pre-wrap;
    max-height:160px;overflow:auto;margin:8px 0 0}
  .acts{display:flex;gap:8px;margin-top:11px}
  .btn{flex:1;text-align:center;padding:10px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);font-size:14px;font-weight:600}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
  .btn.no{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
  .qblock{padding:8px 0 4px;border-top:1px dashed var(--line)}
  .qblock:first-of-type{border-top:none;padding-top:0}
  .opt{display:block;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);
    border-radius:12px;margin-top:7px;background:var(--card);font-size:14px}
  .opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--card))}
  .opt small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .rec{font:12px/1.5 ui-monospace,Consolas,monospace;color:var(--dim);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;height:96px;resize:none;
    word-break:break-all}

  /* ---------- composer ---------- */
  .dock{padding:6px 12px calc(8px + var(--safe-b));background:var(--bg)}
  html.kb-open .dock{padding-bottom:0}
  html.kb-open .streamline{display:none}
  /* 待发送附件 */
  .attach{display:none;gap:8px;padding:2px 2px 8px;overflow-x:auto;scrollbar-width:none}
  .attach::-webkit-scrollbar{display:none}
  .att{position:relative;flex:none;width:64px;height:64px;border-radius:12px;overflow:hidden;
    background:var(--bubble);border:1px solid var(--line);display:grid;place-items:center}
  .att img{width:100%;height:100%;object-fit:cover}
  .att .attdoc{font-size:22px}
  /* 上传进度：底部进度条 + 居中百分比 */
  .att .attprog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);transition:width .18s}
  .att .attpct{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600;
    color:#fff;background:rgba(0,0,0,.38);text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .att .attx{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;
    background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center}
  .chips{display:flex;gap:8px;padding:2px 2px 8px;overflow-x:auto;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;background:var(--card)}
  .composer{background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);
    padding:11px 12px 9px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .composer textarea{resize:none;max-height:132px;min-height:24px;line-height:1.5;font-size:16px;display:block}
  /* 用 contenteditable 代替 textarea：iOS 不会挂那条 ^∨✓ 的输入辅助栏 */
  .composer .ta{min-height:24px;max-height:132px;overflow-y:auto;line-height:1.5;font-size:16px;
    outline:none;white-space:pre-wrap;word-break:break-word}
  .composer .ta:empty::before{content:attr(data-ph);color:var(--dim);pointer-events:none}
  .composer textarea::placeholder{color:var(--dim)}
  .crow{display:flex;align-items:center;gap:8px;margin-top:8px}
  .plus{width:30px;height:30px;border-radius:50%;background:var(--bubble);display:grid;place-items:center;font-size:17px;color:var(--dim);flex:none}
  .model{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:6px;min-width:0;flex:1;
    overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .sendgroup{display:flex;align-items:center;gap:8px;flex:none}
  .model b{color:var(--fg);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pill{font-size:11px;color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);
    border-radius:6px;padding:1px 6px;flex:none}
  .send{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:grid;
    place-items:center;font-size:16px;flex:none;margin-left:auto;box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
  .send:disabled{opacity:.4;box-shadow:none}
  .stop{width:34px;height:34px;border-radius:50%;background:var(--bubble);color:var(--bad);
    display:none;place-items:center;font-size:13px;flex:none;border:1px solid var(--line)}
  /* 回到底部：悬浮在输入框外部的右上角 */
  .jump{position:absolute;right:14px;bottom:calc(var(--dock-h, 92px) + 10px);z-index:20;
    display:none;align-items:center;gap:4px;font-size:12px;color:var(--fg);
    background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 11px;
    box-shadow:0 3px 12px rgba(0,0,0,.14)}
  .jump.on{display:inline-flex}
  .meta{font-size:11.5px;color:var(--dim);text-align:center;padding-top:7px}

  /* ---------- 空态/错误 ---------- */
  .empty{color:var(--dim);text-align:center;padding:56px 20px;font-size:14px;line-height:1.8}
  .err{color:var(--bad);font-size:13px;margin-top:10px;word-break:break-word}
  /* 下拉刷新 */
  .ptr{height:0;overflow:hidden;opacity:0;text-align:center;font-size:12px;color:var(--dim);
    transition:height .16s ease,opacity .16s ease;will-change:height}
  .ptr.on{opacity:1}

  /* ---------- sheet ---------- */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;
    justify-content:center;z-index:2000;animation:fade .16s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .sheet{width:100%;max-width:560px;background:var(--card);border-radius:22px 22px 0 0;
    padding:14px 12px calc(20px + var(--safe-b));animation:up .2s cubic-bezier(.22,1,.36,1)}
  @keyframes up{from{transform:translateY(24px)}to{transform:translateY(0)}}
  .sheet .item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;font-size:15px}
  .sheet .item:active{background:var(--bubble)}
  .sheet .cancel{margin-top:8px;text-align:center;padding:13px;color:var(--dim);font-size:15px;
    border-top:1px solid var(--line)}
  .sheet .ver{text-align:center;font-size:11.5px;color:var(--dim);opacity:.75;padding:7px 0 0}
  .pair{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;gap:12px;
    padding:28px;max-width:420px;margin:0 auto}
  .pair .btn{flex:none;width:100%}
  .pair input{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;
    font-size:20px;letter-spacing:6px;text-align:center}
</style>
</head>
<body>
<div id="root">
  <!-- 首屏占位：JS 还没跑起来时先显示这个，避免白屏错觉（render() 会一次性替换掉 #root） -->
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#8a8f98;background:#0f1115">
    <div style="width:56px;height:56px;border-radius:16px;background:#1b1e24;display:grid;place-items:center;font-size:22px;font-weight:700;color:#cfd3da">DSH</div>
    <div>正在连接…</div>
  </div>
</div>
<script type="module">
// ---------------------------------------------------------------- 基础
const APP_VERSION = 'v69';   // 每次发版改这里，菜单底部会显示
const LS = { token:'dsh.token', inst:'dsh.inst', collapsed:'dsh.collapsed', draft:'dsh.draft' };

// 本地缓存：先出内容再拉新（弱网/离线时至少能看到上次的样子）
const CACHE_KEYS = { list:'dsh.cache.list', msgs:'dsh.cache.msgs' };

function saveListCache(sessions) {
  try {
    const slim = sessions.slice(0, 80).map(s => ({
      sessionId: s.sessionId, title: s.title, running: s.running, updatedAt: s.updatedAt,
      workspaceId: s.workspaceId, cwd: s.cwd, lastMessage: s.lastMessage || null,
    }));
    localStorage.setItem(CACHE_KEYS.list, JSON.stringify({ at: Date.now(), sessions: slim }));
  } catch {}
}
function readListCache() {
  try {
    const j = JSON.parse(localStorage.getItem(CACHE_KEYS.list) || 'null');
    return j && Array.isArray(j.sessions) ? j.sessions : null;
  } catch { return null; }
}

const fmtMsgTime = (ts) => {
  const d = new Date(ts);
  const now = new Date();
  const hm = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  const sameDay = d.toDateString() === now.toDateString();
  if (sameDay) return hm;
  const md = `${d.getMonth() + 1}月${d.getDate()}日`;
  return d.getFullYear() === now.getFullYear() ? `${md} ${hm}` : `${d.getFullYear()}/${md} ${hm}`;
};

let msgCacheSig = '';
function saveMsgCache(sid, messages, lastSeq) {
  if (!sid || !messages || !messages.length) return;
  // 只在内容真变了才写，避免每 4 秒轮询都写一次 localStorage
  const sig = `${sid}:${messages.length}:${lastSeq}:${messages[messages.length - 1] && messages[messages.length - 1].id}`;
  if (sig === msgCacheSig) return;
  msgCacheSig = sig;
  try {
    const all = JSON.parse(localStorage.getItem(CACHE_KEYS.msgs) || '{}');
    let keep = messages.slice(-120);
    // 体积兜底：太大就只留最后 40 条
    while (keep.length > 40 && JSON.stringify(keep).length > 300000) keep = keep.slice(-Math.floor(keep.length * 0.6));
    all[sid] = { at: Date.now(), lastSeq, messages: keep };
    const keys = Object.keys(all).sort((a, b) => (all[b].at || 0) - (all[a].at || 0));
    for (const k of keys.slice(10)) delete all[k];
    localStorage.setItem(CACHE_KEYS.msgs, JSON.stringify(all));
  } catch {}
}
function readMsgCache(sid) {
  try {
    const all = JSON.parse(localStorage.getItem(CACHE_KEYS.msgs) || '{}');
    return all[sid] || null;
  } catch { return null; }
}
// ---------------- 待查看提醒（图标角标） ----------------
// iOS 16.4+ 的主屏 Web App、以及 Chrome 安装的 PWA 都支持 Badging API：
//   navigator.setAppBadge(n) / clearAppBadge()
// 限制：只有 App 进程活着时才更新得掉；冷启动前无法主动点亮（那需要 Web Push）。
function unreadCount() {
  let n = 0;
  for (const s of state.sessions) {
    const lt = (s && s.lastTurn) || {};
    if (lt.endedAt && lt.endedAt > (lt.readAt || 0)) n++;
  }
  if (state.foreign && state.foreign.size) n += state.foreign.size;
  if (state.view !== 'session') n += state.cards.length;
  return n;
}

const isUnread = (s) => {
  const lt = (s && s.lastTurn) || {};
  return !!(lt.endedAt && lt.endedAt > (lt.readAt || 0));
};

let badgeTimer = null;
function syncBadge() {
  clearTimeout(badgeTimer);
  badgeTimer = setTimeout(async () => {
    const n = unreadCount();
    state.attn = n;
    try {
      if (n > 0 && navigator.setAppBadge) await navigator.setAppBadge(n);
      else if (n === 0 && navigator.clearAppBadge) await navigator.clearAppBadge();
    } catch {}
    const title = n > 0 ? `(${n}) DSH` : 'DSH';
    if (document.title !== title) document.title = title;
    for (const node of document.querySelectorAll('[data-bell]')) node.classList.toggle('has-attn', n > 0);
  }, 120);
}

async function markRead(sessionId) {
  try { await api('/api/mobile/v1/session/read', { method:'POST', body: { sessionId } }); } catch {}
}

function toast(msg) {
  let t = document.querySelector('.toast');
  if (!t) { t = el('div', { class:'toast' }); document.body.append(t); }
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('on'), 2200);
}
const getDrafts = () => { try { return JSON.parse(localStorage.getItem(LS.draft) || '{}'); } catch { return {}; } };
const saveDraft = (sid, text) => {
  if (!sid) return;
  const d = getDrafts();
  if (text && text.trim()) d[sid] = text.slice(0, 4000); else delete d[sid];
  const keys = Object.keys(d);
  if (keys.length > 40) for (const k of keys.slice(0, keys.length - 40)) delete d[k];
  try { localStorage.setItem(LS.draft, JSON.stringify(d)); } catch {}
};
const $ = (s, el=document) => el.querySelector(s);
const el = (tag, props={}, ...kids) => {
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(props)) {
    if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2).toLowerCase(), v);
    else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : document.createTextNode(String(k)));
  return n;
};
const fmtTime = ms => {  if (!ms) return '';
  const d = new Date(ms), diff = (Date.now() - d.getTime())/1000;
  if (diff < 60) return '刚刚';
  if (diff < 3600) return `${Math.floor(diff/60)} 分钟前`;
  if (diff < 86400) return d.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString('zh-CN',{month:'2-digit',day:'2-digit'});
};

// 列表预览：把 markdown 压成纯文本（app 的列表预览也是纯文本）
const plain = s => String(s || '')
  .replace(/```[\s\S]*?```/g, ' [代码] ')
  .replace(/`([^`]+)`/g, '$1')
  .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
  .replace(/^\s{0,3}#{1,6}\s*/gm, '')
  .replace(/[*_~]/g, '')
  .replace(/\|/g, ' ')
  .replace(/\s+/g, ' ')
  .trim();

// ---------------------------------------------------------------- markdown（内联极简渲染器：离线可用，只支持常见语法）
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function inlineMd(s){
  return esc(s)
    // 图片：http(s) 直接显示；dsh-local-image 走 /session/local-image 取字节（见 hydrateImages）
    .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, (_, alt, url) => {
      if (/^https?:/i.test(url)) return `<img src="${url}" alt="${alt}" loading="lazy">`;
      const m = /^dsh-local-image:([^?)\s]+)/.exec(url);
      if (m) return `<img class="mdimg" data-lid="${m[1]}" alt="${alt}">`;
      return `<span class="imgph">🖼 ${alt || '图片'}</span>`;
    })
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~\n]+)~~/g, '<del>$1</del>')
    .replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}
// 极简代码高亮：单趟扫描字符串/注释/数字/关键字，不会互相串味
const KW = new Set(('const let var function return if else for while class import export from new await async try catch '
  + 'throw switch case break continue default typeof instanceof in of this null undefined true false def elif lambda '
  + 'pass with as None True False echo then fi do done esac local cd sudo rm cp mv grep cat curl git npm pnpm node').split(' '));
function hl(code) {
  const re = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\/\/[^\n]*|#[^\n]*|\/\*[\s\S]*?\*\/)|(\b\d+(?:\.\d+)?\b)|([A-Za-z_$][\w$-]*)/g;
  const out = [];
  let last = 0, m;
  while ((m = re.exec(code))) {
    if (m.index > last) out.push(esc(code.slice(last, m.index)));
    if (m[1]) out.push(`<span class="s">${esc(m[1])}</span>`);
    else if (m[2]) out.push(`<span class="c">${esc(m[2])}</span>`);
    else if (m[3]) out.push(`<span class="n">${esc(m[3])}</span>`);
    else out.push(KW.has(m[4]) ? `<span class="k">${esc(m[4])}</span>` : esc(m[4]));
    last = re.lastIndex;
  }
  out.push(esc(code.slice(last)));
  return out.join('');
}

function mdToHtml(src){
  const lines = String(src || '').replace(/\r/g,'').split('\n');
  const out = [];
  let i = 0;
  const isList = l => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  while (i < lines.length) {
    const line = lines[i];
    if (/^\s*```/.test(line)) {
      const lang = line.trim().slice(3).trim();
      const buf = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="code"${lang ? ` data-lang="${esc(lang)}"` : ''}><code>${hl(buf.join('\n'))}</code></pre>`);
      continue;
    }
    if (/\|/.test(line) && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i+1])) {
      const cells = r => r.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c => c.trim());
      const head = cells(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].includes('|') && lines[i].trim() !== '') { rows.push(cells(lines[i])); i++; }
      out.push('<div class="tbl"><table><thead><tr>' + head.map(h => `<th>${inlineMd(h)}</th>`).join('') +
        '</tr></thead><tbody>' + rows.map(r => '<tr>' + r.map(c => `<td>${inlineMd(c)}</td>`).join('') + '</tr>').join('') +
        '</tbody></table></div>');
      continue;
    }
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) { const n = Math.min(4, h[1].length); out.push(`<h${n}>${inlineMd(h[2])}</h${n}>`); i++; continue; }
    if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { out.push('<hr>'); i++; continue; }
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/,''));
      out.push('<blockquote>' + inlineMd(buf.join('\n')).replace(/\n/g,'<br>') + '</blockquote>');
      continue;
    }
    if (isList(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && isList(lines[i])) items.push(lines[i++].replace(/^\s*([-*+]|\d+[.)])\s+/,''));
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>` + items.map(t => `<li>${inlineMd(t)}</li>`).join('') + `</${tag}>`);
      continue;
    }
    if (line.trim() === '') { i++; continue; }
    const buf = [line]; i++;
    while (i < lines.length && lines[i].trim() !== '' && !/^\s*```/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
      && !isList(lines[i]) && !/^\s*>\s?/.test(lines[i]) && !lines[i].includes('|')) buf.push(lines[i++]);
    out.push('<p>' + inlineMd(buf.join('\n')).replace(/\n/g,'<br>') + '</p>');
  }
  return out.join('');
}

// ---------------------------------------------------------------- 状态
(() => {
  const h = location.hash || '';
  const t = /[#&]token=([^&]+)/.exec(h);
  const i = /[#&]inst=([^&]+)/.exec(h);
  if (t) {
    localStorage.setItem(LS.token, decodeURIComponent(t[1]));

// ---------------------------------------------------------------- API
async function api(path, { method='GET', body, auth=true } = {}) {
  const res = await fetch(path, {
    method,
    headers: {
      ...(body ? { 'content-type':'application/json' } : {}),
      ...(auth && state.token ? { authorization: `Bearer ${state.token}` } : {}),
      ...(state.instanceId ? { 'x-dsh-instance': state.instanceId } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch {}
  if (!data || typeof data !== 'object') {
    const e = new Error(`不是 JSON 响应（HTTP ${res.status}）：${text.slice(0, 80)}`);
    e.code = 'not-json'; throw e;
  }
  if (!res.ok || data.ok === false) {
    const code = (data && data.error && data.error.code) || res.status;
    // 设备被吊销/凭据失效：直接回配对页，别让界面停在"还没有会话"这种误导性的空状态
    if (auth && (res.status === 401 || code === 'device-revoked')) {
      state.authError = (data && data.error && data.error.message) || '凭据已失效，请重新配对';
      state.token = ''; state.instanceId = '';
      try { localStorage.removeItem(LS.token); localStorage.removeItem(LS.inst); } catch {}
      state.view = 'list'; render();
    }
    const e = new Error(`${code}: ${(data && data.error && data.error.message) || res.statusText}`);
    e.code = code; throw e;
  }
  return data;
}

// ---------------------------------------------------------------- SSE
function openStream(path, { onFrame, onState }) {
  const ac = new AbortController();
  let stopped = false, retry = 3000;
  (async () => {
    while (!stopped) {
      try {
        const res = await fetch(path, {
          headers: {
            authorization: `Bearer ${state.token}`,
            accept: 'text/event-stream',
            ...(state.instanceId ? { 'x-dsh-instance': state.instanceId } : {}),
          },
          signal: ac.signal,
        });
        if (!res.ok || !res.body) throw new Error(`stream ${res.status}`);
        onState?.('open');
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buf = '';
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let idx;
          while ((idx = buf.indexOf('\n\n')) >= 0) {
            const raw = buf.slice(0, idx); buf = buf.slice(idx + 2);
            let data = '';
            for (const line of raw.split('\n')) {
              if (line.startsWith('data:')) data += line.slice(5).trim();
              else if (line.startsWith('retry:')) { const n = +line.slice(6).trim(); if (n > 0) retry = n; }
            }
            if (!data) continue;
            try { onFrame(JSON.parse(data)); } catch {}
          }
        }
        throw new Error('closed');
      } catch (e) {
        if (stopped) break;
        console.warn('[stream]', path, '→', e && (e.message || e.name || e));
        onState?.('closed', e);
        await new Promise(r => setTimeout(r, retry));
      }
    }
  })();
  return { close(){ stopped = true; ac.abort(); onState?.('closed'); } };
}

// 键盘适配：iOS 上键盘不改变 layout viewport，只改 visualViewport。
// 用它的高度设 --vvh，让 .app 正好等于可见区域，输入框就贴在键盘上方，不会留一条缝。
// 键盘诊断：把 iOS 实际给的几何值显示在输入框上方（菜单里开关）
function debugText() {
  const vv = window.visualViewport;
  const de = document.documentElement;
  const dock = document.querySelector('.dock');
  const pad = dock ? getComputedStyle(dock).paddingBottom : '-';
  return `ih=${window.innerHeight} vv=${vv ? Math.round(vv.height) : '-'} off=${vv ? Math.round(vv.offsetTop) : '-'} `
    + `sy=${Math.round(window.scrollY)} app=${Math.round((document.querySelector('.app') || {}).clientHeight || 0)} `
    + `dockPad=${pad} kb=${de.classList.contains('kb-open') ? 1 : 0} maxH=${window.__maxH || '-'} vvh=${de.style.getPropertyValue('--vvh') || '-'}`;
}

function installViewportSync() {
  const vv = window.visualViewport;
  const de = document.documentElement;
  // iOS 独立模式下键盘弹起会直接缩小 innerHeight（不缩小 layout viewport），
  // 所以只能拿"见过的最小/最大高度"当基准：maxH - ih > 120 就是键盘。
  let maxH = window.innerHeight;
  window.__maxH = maxH;

  const apply = () => {
    const ih = window.innerHeight;
    if (ih > maxH) { maxH = ih; window.__maxH = maxH; }
    const vvh = Math.round(vv ? vv.height : ih);
    de.style.setProperty('--vvh', vvh + 'px');

    const shrunk = maxH - ih;
    // 关键：iOS 有时不缩 innerHeight，只缩 visualViewport。两个信号取大的那个。
    const vvShrunk = vv ? maxH - Math.round(vv.height) : 0;
    const kb = Math.max(shrunk, vvShrunk) > 120;
    de.classList.toggle('kb-open', kb);

    // iOS 会把页面往上顶（offsetTop/scrollY 变成几百），把滚动位置强行拉回 0
    if (window.scrollY !== 0 || (vv && vv.offsetTop !== 0)) {
      try { window.scrollTo(0, 0); } catch {}
    }
    // 键盘弹起后可视区变矮：如果原本就在看最新消息，就把列表重新贴到底部，
    // 否则最新那条会被键盘挡住（用户看到的"内容没被顶起"）
    if (kb && ui && ui.body && ui.body.isConnected) {
      const b = ui.body;
      const near = b.scrollHeight - b.scrollTop - b.clientHeight < 220;
      if (near) {
        requestAnimationFrame(() => { try { b.scrollTop = b.scrollHeight; } catch {} });
        setTimeout(() => { try { b.scrollTop = b.scrollHeight; } catch {} }, 260);
      }
    }
    if (state.debug && ui.strip) ui.strip.textContent = debugText();
  };
  vv && vv.addEventListener('resize', apply);
  vv && vv.addEventListener('scroll', apply);
  window.addEventListener('resize', apply);
  document.addEventListener('focusin', () => { setTimeout(apply, 120); setTimeout(apply, 320); setTimeout(apply, 700); });
  document.addEventListener('focusout', () => { setTimeout(apply, 120); setTimeout(apply, 400); });
  apply();
}

// 左滑返回：单页应用没有浏览历史，iOS 自带的边缘手势不会触发，自己实现。
// 从左缘 40px 内起手、水平位移 > 70px、纵向位移 < 70px，才算返回，避免和竖向滚动打架。
function installSwipeBack() {
  let sx = 0, sy = 0, mode = '';
  document.addEventListener('touchstart', (e) => {
    if (state.view !== 'session' || e.touches.length !== 1) return;
    if (document.querySelector('.drawer-mask') || document.querySelector('.rpanel-mask')) { mode = ''; return; }
    const t = e.touches[0];
    const w = window.innerWidth;
    // 左缘右滑 → 会话抽屉；右缘左滑 → 文件面板
    mode = t.clientX <= 40 ? 'left' : (t.clientX >= w - 44 ? 'right' : '');
    sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  document.addEventListener('touchcancel', () => { mode = ''; }, { passive: true });
  document.addEventListener('touchend', (e) => {
    if (!mode) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    const m = mode; mode = '';
    if (Math.abs(dy) >= 70) return;
    if (m === 'left' && dx > 70) openDrawer();
    if (m === 'right' && dx < -70) openFileDrawer(state.sessionCwd || '');
  }, { passive: true });
}

function renderPair() {
  const input = el('input', { inputmode:'numeric', maxlength:'6', placeholder:'000000', autocomplete:'one-time-code' });
  const err = el('div', { class:'err', text: state.authError || '' });
  const btn = el('button', { class:'btn primary', style:'padding:14px', onclick: async () => {
    const code = input.value.trim();
    if (!/^\d{6}$/.test(code)) { err.textContent = '配对码是 6 位数字'; return; }
    btn.textContent = '连接中…'; btn.disabled = true; err.textContent = '';
    try {
      const payload = { code, device: { deviceId: crypto.randomUUID(), name: 'DSH PWA', platform: 'web',
        osVersion: navigator.userAgent.slice(0,32), appVersion: '0.2.0' } };
      let r;
      try { r = await api('/__lan_pair', { method:'POST', body: payload, auth:false }); }
      catch { r = await api('/api/mobile/v1/pair', { method:'POST', body: payload, auth:false }); }
      state.token = r.deviceCredential || r.token;
      state.instanceId = r.instanceId || '';
      localStorage.setItem(LS.token, state.token);
      localStorage.setItem(LS.inst, state.instanceId);
      state.view = 'list';
      state.authError = '';
      render();
      refreshAll();
    } catch (e) {
      err.textContent = String(e.message || e);
      btn.textContent = '连接'; btn.disabled = false;
    }
  }}, '连接');

  // 从浏览器登录过、但添加到主屏后是新容器（iOS 两套 localStorage）——直接粘恢复链接即可
  const rec = el('input', { placeholder:'或粘贴「恢复链接」（含 #token=…）', style:'margin-top:14px' });
  const recBtn = el('button', { class:'btn', style:'margin-top:8px', onclick: () => {
    const s = rec.value.trim();
    const t = /[#&]token=([^&\s]+)/.exec(s);
    if (!t) { err.textContent = '这条链接里没找到凭据（#token=）'; return; }
    const i = /[#&]inst=([^&\s]+)/.exec(s);
    state.token = decodeURIComponent(t[1]);
    if (i) state.instanceId = decodeURIComponent(i[1]);
    localStorage.setItem(LS.token, state.token);
    if (state.instanceId) localStorage.setItem(LS.inst, state.instanceId);
    state.authError = '';
    state.view = 'list';
    render();
    refreshAll();
  }}, '用链接登录');

  root.append(el('div', { class:'pair' },
    el('div', { class:'logo', style:'justify-content:center' },
      el('span', { class:'mark', text:'A' }), el('span', { text:'AI-HUB' })),
    el('div', { style:'text-align:center;color:var(--dim);font-size:13px;line-height:1.7',
      html:'输入电脑端「设置 → 移动端」里的 6 位配对码<br>直接连你自己的 DSH，不经任何第三方' }),
    input, btn, err, rec, recBtn,
    el('div', { style:'text-align:center;color:var(--dim);font-size:11.5px;opacity:.7;margin-top:10px',
      text:`版本 ${APP_VERSION}` }),
  ));
  setTimeout(() => input.focus(), 60);
}

// 文件读取：这个接口直接回原文，不是 JSON 信封，所以单独走 raw
async function rawText(path, { method='GET', body } = {}) {
  const res = await fetch(path, {
    method,
    headers: {
      ...(body ? { 'content-type':'application/json' } : {}),
      ...(state.token ? { authorization: `Bearer ${state.token}` } : {}),
      ...(state.instanceId ? { 'x-dsh-instance': state.instanceId } : {}),
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  const text = await res.text();
  if (!res.ok) {
    let msg = text.slice(0, 120);
    try { const j = JSON.parse(text); msg = j.error?.message || j.error?.code || msg; } catch {}
    throw new Error(msg);
  }
  return text;
}

async function openFileDrawer(path) {
  closeRPanel();
  const mask = el('div', { class:'rpanel-mask', onclick: (e) => { if (e.target === mask) closeRPanel(); } });
  const panel = el('div', { class:'rpanel' });
  const st = { path: path || state.sessionCwd || '', listing: null, filter: '', showHidden: false, err: '',
    sort: 'name', selecting: false, selected: new Set() };
  const body = el('div', { class:'rpbody' });

  const nav = async (p) => {
    st.err = '';
    try { st.listing = await fetchListing(p); st.path = (st.listing && st.listing.path) || p; }
    catch (e) { st.listing = null; st.err = '打不开这个目录：' + (e.message || e); }
    paint();
  };

  const head = el('div', { class:'drhead' },
    el('button', { class:'ico', text:'‹', onclick: closeRPanel }),
    el('b', { text:'目录' }),
    el('span', { style:'flex:1' }),
  );

  function paint() {
    body.replaceChildren();
    if (st.err) { body.append(el('div', { class:'empty', text: st.err })); return; }
    const L = st.listing;
    if (!L) { body.append(el('div', { class:'empty', text:'加载中…' })); return; }
    const filter = el('input', { class:'rpfilter', placeholder:'输入名称筛选这一层', value: st.filter });
    filter.addEventListener('input', () => { st.filter = filter.value; paintList(); });
    const crumbs = el('div', { class:'crumbs' });
    for (const c of (L.crumbs || [])) {
      crumbs.append(el('span', { class:'crumb', text: c.name, onclick: () => nav(c.path) }));
    }
    const counts = el('div', { class:'rpcount' });
    const listBox = el('div', { class:'rplist' });
    body.append(filter, crumbs, counts, listBox);

    function paintList() {
      const q = st.filter.trim().toLowerCase();
      const all = (L.entries || []).filter(e => st.showHidden || !e.hidden);
      const byName = (a, b) => a.name.localeCompare(b.name, 'zh-Hans-CN', { numeric: true });
      const byTime = (a, b) => (b.modified || 0) - (a.modified || 0);
      const dirs = all.filter(e => e.kind === 'folder' && e.name.toLowerCase().includes(q)).sort(byName);
      const files = all.filter(e => e.kind !== 'folder' && e.name.toLowerCase().includes(q))
        .sort(st.sort === 'time' ? byTime : byName);
      counts.replaceChildren(
        el('span', { text: `${dirs.length} 个文件夹 · ${files.length} 个文件` }),
        el('span', { style:'flex:1' }),
        el('button', { class:'ico', text: st.sort === 'time' ? '🕒' : '⇅',
          title: st.sort === 'time' ? '按修改时间排序' : '按名称排序',
          onclick: () => { st.sort = st.sort === 'time' ? 'name' : 'time'; paintList(); } }),
        el('button', { class:'ico', text: st.selecting ? '☑' : '☐', title:'多选引用',
          onclick: () => { st.selecting = !st.selecting; if (!st.selecting) st.selected.clear(); paintList(); paintFoot(); } }),
        el('button', { class:'ico', text:'⟳', title:'刷新', onclick: () => nav(st.path) }),
      );
      listBox.replaceChildren();
      const rowOf = (e, isDir) => {
        const sel = st.selected.has(e.path);
        return el('div', { class:'frow' + (sel ? ' sel' : ''), onclick: () => {
          if (st.selecting) {
            if (st.selected.has(e.path)) st.selected.delete(e.path); else st.selected.add(e.path);
            paintList(); paintFoot();
            return;
          }
          if (isDir) nav(e.path); else openViewer(e.path, e.name);
        }},
          el('span', { class:'fico',
            text: st.selecting ? (sel ? '☑' : '☐') : (isDir ? '📁' : fileIcon(e.kind, e.name)) }),
          el('span', { class:'fname', text: e.name }),
          st.selecting ? null : el('span', { class:'chev', text:'›' }));
      };
      for (const e of dirs) listBox.append(rowOf(e, true));
      if (files.length) listBox.append(el('div', { class:'rpsect', text:'文件' }));
      for (const e of files) listBox.append(rowOf(e, false));
      if (!dirs.length && !files.length) listBox.append(el('div', { class:'empty', text:'这一层是空的' }));
    }
    paintList();
  }

  // 底部操作栏：平时是上传/新建/隐藏；多选模式下变成「引用到对话」
  const foot = el('div', { class:'drfoot' });

  function applyRefs() {
    const paths = [...st.selected];
    if (!paths.length) { toast('先选几个文件'); return; }
    const ta = ui && ui.ta;
    if (!ta) { toast('不在会话里，没法引用'); return; }
    const base = (ta.innerText || '').replace(/\u00a0/g, '');
    const refs = paths.map(p => (/\s/.test(p) ? `"${p}"` : p)).join(' ');
    ta.textContent = (base.trim() ? base.replace(/\s*$/, '') + ' ' : '') + refs;
    try { saveDraft(state.sessionId, ta.textContent); } catch {}
    ta.focus();
    closeRPanel();
    toast(`已引用 ${paths.length} 个文件`);
  }

  function paintFoot() {
    foot.replaceChildren();
    if (st.selecting) {
      foot.append(
        el('button', { class:'drbtn', onclick: () => { st.selecting = false; st.selected.clear(); paint(); } }, '取消'),
        el('span', { class:'drbtn', style:'opacity:.75;pointer-events:none', text:`已选 ${st.selected.size}` }),
        el('button', { class:'drbtn', style: st.selected.size
            ? 'color:#fff;background:var(--accent);border-color:var(--accent)'
            : 'opacity:.5',
          onclick: () => { if (st.selected.size) applyRefs(); } }, '引用到对话'),
      );
      return;
    }
    foot.append(
      el('button', { class:'drbtn', onclick: () => pickUploadToDir(st.path, () => nav(st.path)) }, '⬆ 上传'),
      el('button', { class:'drbtn', onclick: async () => {
        const name = prompt('新文件夹名字');
        if (!name || !name.trim()) return;
        try {
          await api('/api/mobile/v1/directory/create', { method:'POST', body: { path: st.path, name: name.trim() } });
          nav(st.path);
        } catch (e) { toast('新建失败：' + (e.message || e)); }
      } }, '📁 新建文件夹'),
      el('button', { class:'drbtn', onclick: () => { st.showHidden = !st.showHidden; nav(st.path); } }, '👁 隐藏文件'),
    );
  }
  paintFoot();

  panel.append(head, body, foot);
  // 面板内右滑关闭
  let rx = 0, ry = 0, drag = false;
  panel.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) return;
    rx = e.touches[0].clientX; ry = e.touches[0].clientY; drag = true;
  }, { passive: true });
  panel.addEventListener('touchend', (e) => {
    if (!drag) return;
    drag = false;
    const t = e.changedTouches[0];
    if (t.clientX - rx > 60 && Math.abs(t.clientY - ry) < 60) closeRPanel();
  }, { passive: true });
  mask.append(panel);
  document.body.append(mask);
  requestAnimationFrame(() => mask.classList.add('on'));
  await nav(st.path);
}


// 上传（该接口只能写 UTF-8 文本，二进制会被拒绝）
function pickUploadToDir(dir, done) {
  const inp = el('input', { type:'file', style:'display:none' });
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const textExt = /\.(md|txt|json|js|mjs|ts|tsx|jsx|css|html|yml|yaml|sh|ps1|py|ini|conf|csv|log|xml|env)$/i;
    if (!textExt.test(f.name) && !(f.type || '').startsWith('text/')) {
      toast('这个接口只能往目录里写文本文件（md/txt/json/代码等），二进制不支持');
      return;
    }
    try {
      const content = await f.text();
      const target = dir.replace(/[\\/]+$/, '') + '\\' + f.name;
      await api('/api/mobile/v1/file/create', { method:'POST', body: { path: target, content, overwrite: false } });
      toast('已上传：' + f.name);
      done && done();
    } catch (e) {
      const msg = String(e.message || e);
      toast(msg.includes('file-exists') ? '同名文件已存在' : ('上传失败：' + msg));
    }
  });
  document.body.append(inp);
  inp.click();
}

    el('span', { style:'flex:1' }),

      try { await navigator.clipboard.writeText(raw); toast('已复制全文'); }
      catch { toast('复制失败'); }
    } }));

  const tools = el('div', { class:'vtools' },
    el('button', { class:'vtool on', text:'折行', onclick: (e) => {
      wrapOn = !wrapOn;
      e.target.classList.toggle('on', wrapOn);
      pre.classList.toggle('nowrap', !wrapOn);
    } }),
    el('button', { class:'vtool', text:'查找', onclick: () => {
      findbar.classList.toggle('on');
      const inp = findbar.querySelector('input');
      if (findbar.classList.contains('on') && inp) inp.focus();
    } }),
    el('button', { class:'vtool', text:'复制全文', onclick: async () => {
      try { await navigator.clipboard.writeText(raw); toast('已复制全文'); }
      catch { toast('复制失败'); }
    } }));

  mask.append(head, meta, tools, findbar, pre);
  document.body.append(mask);

  try {
    raw = await rawText('/api/mobile/v1/file/read', { method:'POST', body: { path } });
  } catch (e) {
    pre.textContent = '读不出来：' + (e.message || e);
    return;
  }
  const ext = String(name || path).split('.').pop().toLowerCase();
  meta.textContent = `${path} · ${ext}${raw.length > 40000 ? ' · 已截断到 4 万字符' : ''}`;
  const content = raw.length > 40000 ? raw.slice(0, 40000) : raw;

  // 逐行渲染（带行号），行内做轻量高亮
  const lines = content.split('\n');
  const nodes = [];
  pre.replaceChildren();
  for (let i = 0; i < lines.length; i++) {
    const row = el('div', { class:'vline' });
    row.innerHTML = hl(lines[i]) || '&nbsp;';
    nodes.push(row);
    pre.append(row);
  }

  // 查找：匹配行高亮 + 上一个/下一个
  const inp = el('input', { placeholder:'查找内容' });
  const cnt = el('span', { class:'vcount' });
  const prev = el('button', { class:'vtool', text:'▲', onclick: () => jump(-1) });
  const next = el('button', { class:'vtool', text:'▼', onclick: () => jump(1) });
  findbar.append(inp, cnt, prev, next);
  let hits = [], at = -1;
  const jump = (dir) => {
    if (!hits.length) return;
    at = (at + dir + hits.length) % hits.length;
    hits.forEach(n => n.classList.remove('hit'));
    const n = hits[at];
    n.classList.add('hit');
    n.scrollIntoView({ block:'center', behavior:'smooth' });
    cnt.textContent = `${at + 1}/${hits.length}`;
  };
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase();
    hits.forEach(n => n.classList.remove('hit'));
    hits = []; at = -1;
    if (!q) { cnt.textContent = ''; return; }
    lines.forEach((ln, i) => { if (ln.toLowerCase().includes(q)) hits.push(nodes[i]); });
    cnt.textContent = hits.length ? `0/${hits.length}` : '无匹配';
    if (hits.length) jump(1);
  });
}

// ---------------- 关于 / 设置 ----------------
// ---------------- Web Push（通知提醒） ----------------
const PUSH_DEVICE_KEY = 'dsh.push.device';

function pushDeviceId() {
  let id = localStorage.getItem(PUSH_DEVICE_KEY);
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2));
    localStorage.setItem(PUSH_DEVICE_KEY, id);
  }
  return id;
}

// VAPID 公钥是 base64url，订阅时要 Uint8Array
function b64urlToU8(b64) {
  const pad = '='.repeat((4 - (b64.length % 4)) % 4);
  const s = (b64 + pad).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(s);
  const out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

const withTimeout = (p, ms, fallback) =>
  Promise.race([p, new Promise(r => setTimeout(() => r(fallback), ms))]);

async function pushStatus() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return 'unsupported';
  try {
    // 注意：serviceWorker.ready 在没有活动 SW 时永不 resolve，必须限时
    const reg = await withTimeout(navigator.serviceWorker.ready, 1500, null);
    if (!reg) return 'nosw';
    const sub = await withTimeout(reg.pushManager.getSubscription(), 1500, null);
    if (sub) return 'on';
    return (typeof Notification !== 'undefined' && Notification.permission === 'denied') ? 'denied' : 'off';
  } catch { return 'off'; }
}

// 单独的「通知提醒」面板：不依赖任何可能挂起的 await
async function openPushSettings() {
  const st = await pushStatus();
  const label = {
    on: '已开启（这台设备会收到推送）',
    off: '未开启',
    denied: '系统里被拒绝，请去 设置 → 通知 里打开',
    unsupported: '这个浏览器不支持 Web Push（需要 iOS 16.4+ 且已添加到主屏）',
    nosw: 'Service Worker 还没就绪，杀进程重开一次再试',
  }[st] || st;

  const items = [];
  if (st === 'off') items.push({ label:'开启通知提醒', icon:'🔔', run: enablePush });
  if (st === 'on') items.push({ label:'关闭通知提醒', icon:'🔕', run: disablePush });
  items.push({ label:'重新加载', icon:'↻', run: reloadApp });

  openSheet(items, `通知提醒 · ${label}`);
}

async function enablePush() {
  if (!('Notification' in window)) { toast('这个浏览器不支持通知'); return; }
  toast('正在申请通知权限…');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('通知权限被拒绝，去 设置 → Safari → 通知 里打开'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const vapid = await api('/push/vapid', { auth: false });
    if (!vapid || !vapid.publicKey) throw new Error('取不到 VAPID 公钥');
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: b64urlToU8(vapid.publicKey),
    });
    await api('/push/subscribe', {
      method: 'POST', auth: false,
      body: { deviceId: pushDeviceId(), subscription: sub.toJSON(), ua: navigator.userAgent.slice(0, 120) },
    });
    toast('通知已开启');
  } catch (e) {
    toast('开启失败：' + (e.message || e));
  }
}

async function disablePush() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription();
    if (sub) {
      await api('/push/unsubscribe', { method:'POST', auth:false, body: { endpoint: sub.endpoint } }).catch(() => {});
      await sub.unsubscribe().catch(() => {});
    }
    toast('通知已关闭');
  } catch (e) { toast('关闭失败：' + (e.message || e)); }
}

// 告诉服务端"我正在看"，宿主据此决定要不要推
function pushHeartbeat() {
  try {
    api('/push/active', { method:'POST', auth:false, body: { deviceId: pushDeviceId() } }).catch(() => {});
  } catch {}
}

async function openAbout() {
  let devices = '';
  try {
    const r = await api('/api/mobile/v1/paired-devices');
    const n = (r.devices || r.items || []).length;
    if (n) devices = ` · ${n} 台设备`;
  } catch {}
  const host = location.host;
  const inst = (state.instanceId || '').slice(0, 8);
  openSheet([
    { label:'通知提醒', icon:'🔔', run: openPushSettings },
    { label:'重新加载', icon:'↻', run: reloadApp },
    { label:'恢复链接', icon:'🔗', run: openRecovery },
    { label:'清除缓存并重载', icon:'🧹', run: async () => {
      try {
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));
      } catch {}
      location.reload();
    } },
    { label:'退出登录', icon:'⏏', run: () => { localStorage.clear(); state.token=''; state.view='list'; render(); } },
  ], `${APP_VERSION} · 宿主 ${inst || '?'}${devices}\n${host}`);
}

// ---------------- 通用信息面板（label/value 两列） ----------------
function openInfoBox(title, rows, actions, extra) {
  const mask = el('div', { class:'mask', onclick: (e) => { if (e.target === mask) mask.remove(); } });
  const box = el('div', { class:'sheet' },
    el('div', { style:'font-size:13px;color:var(--dim);padding:0 6px 8px', text: title }));
  for (const [k, v] of rows) {
    box.append(el('div', { class:'kvrow' }, el('span', { class:'kk', text: k }), el('span', { class:'vv', text: String(v) })));
  }
  if (extra) box.append(extra);
  if (actions && actions.length) {
    const acts = el('div', { class:'acts', style:'margin-top:10px' });
    for (const a of actions) acts.append(el('button', { class:'btn', onclick: () => { mask.remove(); a.run(); } }, a.label));
    box.append(acts);
  }
  box.append(el('div', { class:'cancel', text:'关闭', onclick: () => mask.remove() }));
  mask.append(box);
  document.body.append(mask);
}

// 近 N 天输出 tokens 的柱状图（纯 div，不引图表库）
function miniBars(days, pick) {
  const wrap = el('div', { class:'bars' });
  const vals = days.map(d => pick(d) || 0);
  const max = Math.max(1, ...vals);
  days.forEach((d, i) => {
    const h = Math.max(2, Math.round((vals[i] / max) * 54));
    wrap.append(el('div', { class:'barcol', title: `${d.day} · ${fmtTok(vals[i])}` },
      el('div', { class:'barv', text: vals[i] ? fmtTok(vals[i]) : '' }),
      el('div', { class:'bar', style:`height:${h}px` }),
      el('div', { class:'barlbl', text: String(d.day || '').slice(5) })));
  });
  return wrap;
}

const fmtTok = n => n >= 1e9 ? (n / 1e9).toFixed(2) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'k' : String(n || 0);
const fmtDur = ms => {
  const m = Math.round((ms || 0) / 60000);
  if (m < 60) return m + ' 分';
  const h = Math.floor(m / 60);
  return h + ' 时 ' + (m % 60) + ' 分';
};

// ---------------- 统计 ----------------
async function openStats() {
  try {
    const r = await api('/api/mobile/v1/stats/overview');
    const k = (r.overview && r.overview.kpi) || {};
    const days = (r.overview && r.overview.days) || [];
    const chart = days.length ? miniBars(days, d => d.outputTokens) : null;
    const models = (r.overview && r.overview.models) || [];
    const billed = models.reduce((a, m) => a + (m.billedTokens || 0), 0);
    const billedNote = (r.overview && (r.overview.historyBilled || r.overview.untrackedBilled))
      ? '已启用' : '该部署未启用计费统计';
    openInfoBox(`统计 · 最近 ${(r.overview && r.overview.range) || '7d'}`, [
      ['会话', k.sessions ?? '-'],
      ['轮次 / 步数', `${k.turns ?? '-'} / ${k.steps ?? '-'}`],
      ['输出 tokens', fmtTok(k.outputTokens)],
      ['缓存读取', fmtTok(k.cacheReadTokens)],
      ['未缓存输入', fmtTok(k.uncachedInputTokens)],
      ['计费 tokens', billed ? fmtTok(billed) : '-'],
      ['费用 (RMB)', billedNote],
      ['活跃时长', fmtDur(k.activeMs)],
      ['模型耗时', fmtDur(k.llmMs)],
      ['工具耗时', fmtDur(k.toolMs)],
    ], null, chart);
  } catch (e) {
    toast('取统计失败：' + (e.message || e));
  }
}

// ---------------- Git 概览 ----------------
async function openGit(workspaceId, title) {
  state.view = 'git';
  state.gitWs = workspaceId;
  state.gitTitle = title || 'Git';
  state.gitData = null;
  render();
  try {
    const [ov, st, lg] = await Promise.all([
      api('/api/mobile/v1/git/overview?workspaceId=' + encodeURIComponent(workspaceId)).catch(() => null),
      api('/api/mobile/v1/git/status?workspaceId=' + encodeURIComponent(workspaceId)).catch(() => null),
      api('/api/mobile/v1/git/log?workspaceId=' + encodeURIComponent(workspaceId)).catch(() => null),
    ]);
    state.gitData = { ov, st, lg };
  } catch (e) {
    state.gitData = { err: String(e.message || e) };
  }
  if (state.view === 'git') render();
}

function renderGit(wrap) {
  const back = el('button', { class:'ico', text:'‹', onclick: () => {
    state.view = 'list'; render(); refreshAll();
  }});
  const d = state.gitData;
  wrap.append(headerEl(d && d.ov && d.ov.branch ? `Git · ${d.ov.branch}` : 'Git', back, el('span')));
  const main = el('main');
  if (!d) { main.append(el('div', { class:'empty', text:'加载中…' })); wrap.append(main); return; }
  if (d.err) { main.append(el('div', { class:'empty', text: d.err })); wrap.append(main); return; }

  const ov = d.ov || {};
  if (ov.remote || ov.githubRepo) {
    main.append(el('div', { class:'kvrow' }, el('span', { class:'kk', text:'远端' }),
      el('span', { class:'vv', text: ov.githubRepo || ov.remote || '' })));
  }
  const st = d.st || {};
  const groups = [
    ['已暂存', st.staged, 'var(--ok)'],
    ['未暂存', st.unstaged, 'var(--warn)'],
    ['未跟踪', st.untracked, 'var(--dim)'],
    ['冲突', st.conflicted, 'var(--bad)'],
  ];
  let total = 0;
  for (const [label, list, color] of groups) {
    if (!Array.isArray(list) || !list.length) continue;
    total += list.length;
    main.append(el('div', { class:'ghead' }, el('span', { class:'gname', text: label }),
      el('span', { class:'count', style:'margin-left:auto', text: String(list.length) })));
    for (const f of list.slice(0, 40)) {
      const name = typeof f === 'string' ? f : (f.path || f.name || JSON.stringify(f));
      main.append(el('div', { class:'frow' },
        el('span', { class:'fico', style:`color:${color}`, text:'●' }),
        el('span', { class:'fname', text: name })));
    }
  }
  if (!total) main.append(el('div', { class:'cmeta', style:'padding:10px 4px', text:'工作区干净，没有未提交的改动' }));

  const commits = (d.lg && d.lg.commits) || [];
  if (commits.length) {
    main.append(el('div', { class:'ghead', style:'margin-top:10px' }, el('span', { class:'gname', text:'最近提交' })));
    for (const c of commits.slice(0, 12)) {
      main.append(el('div', { class:'frow' },
        el('span', { class:'fico', style:'color:var(--dim);font-size:11px', text: c.shortHash || '' }),
        el('span', { class:'fname', text: c.subject || '' })));
    }
  }
  wrap.append(main);
}

// 离线横幅：断网/恢复时给个明确反馈，而不是让用户看着不动的界面猜
function installOfflineBar() {
  const bar = el('div', { class:'offbar', text:'网络已断开，正在等恢复…' });
  document.body.append(bar);
  const sync = () => {
    const off = navigator.onLine === false;
    bar.classList.toggle('on', off);
    state.offline = off;
  };
  window.addEventListener('online', () => { sync(); if (state.offline === false) { try { refreshAll(true); } catch {} } });
  window.addEventListener('offline', sync);
  sync();
}

async function unarchiveSession(s) {
  try {
    await api('/api/mobile/v1/workspace/unarchive-session', { method:'POST', body: { sessionId: s.sessionId } });
    state.archived = (state.archived || []).filter(x => x.sessionId !== s.sessionId);
    render();
    refreshAll(true);
    toast('已取消归档');
  } catch (e) { toast('取消归档失败：' + (e.message || e)); }
}

// 归档集合 = archived=1（该宿主返回全量）− 默认列表（只含未归档）
async function loadArchived() {
  try {
    const [all, act] = await Promise.all([
      api('/api/mobile/v1/sessions?archived=1&fresh=1'),
      api('/api/mobile/v1/sessions?fresh=1'),
    ]);
    const activeIds = new Set((act.items || []).map(x => x.sessionId));
    state.archived = (all.items || []).filter(x => !activeIds.has(x.sessionId));
    state.archivedError = '';
  } catch (e) {
    state.archived = [];
    state.archivedError = '取归档列表失败：' + (e.message || e);
  }
  if (state.view === 'list' && state.tab === 'archived') render();
}

function renderList(wrap, opts = {}) {
  const menu = el('button', { class:'ico', text:'☰', 'data-bell':'', onclick: () => openSheet([
    { label:'刷新', icon:'⟳', run: () => refreshAll(true) },
    { label:'新建工作区', icon:'📁', run: newWorkspace },
    { label:'文件', icon:'📂', run: () => openFileDrawer(state.sessionCwd || '') },
    { label:'连接信息', icon:'⏱', run: openConnInfo },
    { label:'统计', icon:'📊', run: openStats },
    { label:'关于', icon:'ⓘ', run: openAbout },
    { label:'通知提醒', icon:'🔔', run: openPushSettings },
    { label:'重新加载', icon:'↻', run: reloadApp },
    { label:'恢复链接', icon:'🔗', run: openRecovery },
    { label:'退出登录', icon:'⏏', run: () => { localStorage.clear(); state.token=''; state.view='list'; render(); } },
  ]) });
  const plus = el('button', { class:'ico', text:'＋', onclick: openNewSessionSheet });
  if (!opts.noHeader) wrap.append(headerEl('会话', menu, plus));

  const main = el('main');
  // 「已归档」= 全量列表(archived=1，该宿主返回全部) 减去 默认列表(只有未归档)，
  // 两边现成，差集就是归档集合（实测：归档一条后 默认 13→12，archived=1 仍 13）。
  const tabs = el('div', { class:'tabs' },
    el('b', { class: state.tab === 'archived' ? '' : 'on', text:'全部会话', onclick: () => { state.tab = 'all'; render(); } }),
    el('b', { class: state.tab === 'archived' ? 'on' : '', text:'已归档', onclick: () => {
      state.tab = 'archived'; state.archived = null; render(); loadArchived();
    } }),
  );
  main.append(tabs);

  // 搜索：服务端内容检索在这个部署里是关闭的（openAt "never"），所以退成本地按标题/预览过滤
  const searchInput = el('input', { type:'search', placeholder:'搜索会话（标题 / 最近一条）…' });
  searchInput.value = state.searchQ || '';
  searchInput.addEventListener('input', () => {
    const q = searchInput.value.trim().toLowerCase();
    state.searchQ = searchInput.value;
    state.searchItems = q ? state.sessions.filter(s => {
      const t = String(s.title || '').toLowerCase();
      const p = String((s.lastMessage && s.lastMessage.text) || '').toLowerCase();
      return t.includes(q) || p.includes(q);
    }) : null;
    render();
    const again = document.querySelector('.searchrow input');
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  });
  main.append(el('div', { class:'searchrow' }, searchInput));

  if (state.tab === 'archived') {
    const items = state.archived;
    if (items === null) {
      main.append(el('div', { class:'empty', text:'加载中…' }));
    } else if (!items.length) {
      main.append(el('div', { class:'empty', text: state.archivedError || '没有归档的会话' }));
    } else {
      for (const s of items) {
        const row = el('div', { class:'row', onclick: () => openSession(s) },
          el('div', { class:'body' },
            el('div', { class:'t' },
              el('span', { class:'title', text: s.title || '(无标题)' }),
              el('span', { class:'time', text: fmtTime(s.updatedAt) })),
            el('div', { class:'preview prev', text: s.cwd || '' })),
          el('button', { class:'rowmore', text:'↩', title:'取消归档', onclick: (e) => {
            e.stopPropagation(); unarchiveSession(s);
          }}));
        main.append(row);
      }
    }
    wrap.append(main);
    return;
  }

  if (state.searchItems) {
    if (!state.searchItems.length) main.append(el('div', { class:'empty', text:'没有匹配的会话' }));
    for (const s of state.searchItems) {
      main.append(el('div', { class:'sres', onclick: () => openSession(s) },
        el('div', { class:'st', text: s.title || '(无标题)' }),
        el('div', { class:'ss', text: plain((s.lastMessage && s.lastMessage.text) || '') })));
    }
    wrap.append(main);
    return;
  }

  if (!state.sessions.length) {
    main.append(el('div', { class:'empty', html:'还没有会话<br>下拉或点右上角刷新' }));
  }

  // 按工作区分组；不属于任何工作区的按 cwd 兜底
  const groups = new Map();
  for (const s of state.sessions) {
    const w = workspaceOf(s.sessionId);
    const key = w ? `w:${w.workspaceId}` : `c:${s.cwd || '(未登记)'}`;
    const name = w ? (w.title || w.path) : (s.cwd ? s.cwd.split(/[\\/]/).pop() : '(未登记目录)');
    if (!groups.has(key)) groups.set(key, { key, name, path: w ? w.path : s.cwd, git: w && w.git, items: [] });
    groups.get(key).items.push(s);
  }
  const order = [...state.workspaces.map(w => `w:${w.workspaceId}`), ...groups.keys()];
  const keys = [...new Set(order)].filter(k => groups.has(k));

  for (const k of keys) {
    const g = groups.get(k);
    const closed = state.collapsed.has(k);
    const head = el('div', { class: `ghead${closed ? ' closed' : ''}`, onclick: () => {
      if (state.collapsed.has(k)) state.collapsed.delete(k); else state.collapsed.add(k);
      localStorage.setItem(LS.collapsed, JSON.stringify([...state.collapsed]));
      render();
    }},
      el('span', { class:'chev', text:'▼' }),
      el('span', { text:'📁' }),
      el('span', { class:'gname', text: g.name || '(未命名)' }),
      g.git && g.git.branch ? el('span', { class:'branch', text: g.git.branch }) : null,
      el('span', { class:'count', style:'margin-left:auto', text: String(g.items.length) }),
    );
    // 长按分组头 → 工作区菜单（重命名 / 删除 / 在此新建）
    let glp = null;
    head.addEventListener('touchstart', () => { glp = setTimeout(() => { glp = null; openWorkspaceMenu(g); }, 480); }, { passive: true });
    head.addEventListener('touchend', () => { if (glp) { clearTimeout(glp); glp = null; } }, { passive: true });
    head.addEventListener('touchmove', () => { if (glp) { clearTimeout(glp); glp = null; } }, { passive: true });
    head.addEventListener('contextmenu', (e) => { e.preventDefault(); openWorkspaceMenu(g); });
    const box = el('div', { class:'group' }, head);
    if (!closed) {
      // 置顶优先，其次按更新时间
      const sorted = g.items.slice().sort((a, b) =>
        ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || ((b.updatedAt || 0) - (a.updatedAt || 0)));
      for (const s of sorted) {
        const more = el('button', { class:'rowmore', text:'⋯', onclick: (e) => {
          e.stopPropagation();
          openSessionMenu(s);
        }});
        const row = el('div', { class: isUnread(s) ? 'row hot' : 'row', onclick: () => { if (row.__lp) { row.__lp = false; return; } openSession(s); } },
          el('span', { class: s.running ? 'dot run' : 'dot' }),
          el('div', { class:'body' },
            el('div', { class:'t' },
              s.pinned ? el('span', { class:'pinmark', text:'📌' }) : null,
              el('span', { class:'title', text: s.title || '(无标题)' }),
              isUnread(s) ? el('span', { class:'unread', title:'有未查看的新回复' }) : null,
              el('span', { class:'time', text: fmtTime(s.updatedAt) })),
            s.lastMessage ? el('div', { class:'preview prev', text:
              `${s.lastMessage.role === 'user' ? '我' : '助手'}：${plain(s.lastMessage.text)}` }) : null,
          ),
          more);
        // 长按（或桌面右键）出菜单：重命名 / 置顶
        let lp = null;
        const arm = () => { lp = setTimeout(() => { row.__lp = true; openSessionMenu(s); }, 480); };
        const disarm = () => { if (lp) { clearTimeout(lp); lp = null; } };
        row.addEventListener('touchstart', arm, { passive: true });
        row.addEventListener('touchend', disarm, { passive: true });
        row.addEventListener('touchmove', disarm, { passive: true });
        row.addEventListener('contextmenu', (e) => { e.preventDefault(); openSessionMenu(s); });
        box.append(row);
      }
    }
    main.append(box);
  }
  if (!opts.noPull) installPullToRefresh(main);
  wrap.append(main);
}

function openImageFull(src) {
  const mask = el('div', { class:'lightbox', onclick: () => mask.remove() },
    el('img', { src }),
    el('div', { class:'lbclose', text:'✕', onclick: (e) => { e.stopPropagation(); mask.remove(); } }),
