// 正文图：dsh-local-image 的编号 → 字节。带鉴权头所以只能 fetch 成 data URL，<img src> 直接引会 401。
const imgCache = new Map();
async function hydrateImages(rootEl) {
  for (const node of [...rootEl.querySelectorAll('img[data-lid]')]) {
    if (node.dataset.loaded) continue;
    node.dataset.loaded = '1';
    const id = node.dataset.lid;
    try {
      let url = imgCache.get(id);
      if (!url) {
        const r = await api('/api/mobile/v1/session/local-image', { method:'POST', body: { id } });
        url = `data:${r.mediaType || 'image/png'};base64,${r.data}`;
        imgCache.set(id, url);
      }
      node.src = url;
      node.addEventListener('click', () => openImageFull(node.src));
    } catch (e) {
      node.replaceWith(el('span', { class:'imgph', text:'🖼 图片取不回来' }));
    }
  }
}

// 分片上传：begin → chunk(base64) → finish → 拿 uploadId / 落盘路径
function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

async function uploadFile(file, onProgress) {
  const begin = await api('/api/mobile/v1/upload/begin', { method:'POST', body: { name: file.name, size: file.size } });
  const uploadId = begin.uploadId;
  const chunkSize = begin.chunkSize || 262144;
  const total = Math.max(1, Math.ceil(file.size / chunkSize));
  for (let i = 0; i < total; i++) {
    const blob = file.slice(i * chunkSize, Math.min(file.size, (i + 1) * chunkSize));
    const data = await blobToBase64(blob);
    await api('/api/mobile/v1/upload/chunk', { method:'POST', body: { uploadId, index: i, data } });
    onProgress?.(i + 1, total, file);
  }
  const fin = await api('/api/mobile/v1/upload/finish', { method:'POST', body: { uploadId } });
  return { uploadId, path: fin.path, name: fin.name || file.name };
}

// 附件图（消息里 type:'image' 的块）：POST /session/attachment 取 base64
const attCache = new Map();
async function hydrateAttachments(rootEl) {
  for (const node of [...rootEl.querySelectorAll('img[data-att]')]) {
    const id = node.dataset.att;
    if (!id || node.dataset.loaded) continue;
    node.dataset.loaded = '1';
    try {
      let url = attCache.get(id);
      if (!url) {
        const r = await api('/api/mobile/v1/session/attachment', { method:'POST', body: { sessionId: state.sessionId, attachmentId: id } });
        // mediaType 在顶层（实测），兼容两种形状
        const mt = r.mediaType || (r.attachment && r.attachment.mediaType) || 'image/jpeg';
        url = `data:${mt};base64,${r.data}`;
        attCache.set(id, url);
      }
      node.src = url;
      node.addEventListener('click', () => openImageFull(node.src));
    } catch {
      node.replaceWith(el('span', { class:'imgph', text:'🖼 图片已不可读' }));
    }
  }
}

function paintSession({ scroll = 'auto' } = {}) {
  if (!ui.body || !ui.body.isConnected) return;
  state.lastPaint = Date.now();
  const atBottom = ui.body.scrollHeight - ui.body.scrollTop - ui.body.clientHeight < 90;
  // 长会话只渲染最近 N 条，避免几百条 DOM 一起卡（点"显示更早"再加）
  const limit = state.msgLimit || 120;
  const hidden = Math.max(0, state.messages.length - limit);
  const shown = hidden ? state.messages.slice(-limit) : state.messages;
  const feed = (() => {
    const keep = state.messages;
    state.messages = shown;
    const f = buildFeed();
    state.messages = keep;
    return f;
  })();
  // 不在底部时来了新消息 → 累计"未读数"，给悬浮按钮用
  if (ui.prevCount !== undefined && feed.length > ui.prevCount && !atBottom) {
    state.unseen = (state.unseen || 0) + (feed.length - ui.prevCount);
  }
  ui.prevCount = feed.length;
  if (ui.stopBtn) ui.stopBtn.style.display = state.busy ? 'grid' : 'none';
  if (ui.updateJump) ui.updateJump();
  // ---- 增量渲染：只改动变化的那几条，避免整列表重建导致抖动 / 图片重新取回 ----
  const items = [];
  let lastT = 0;
  for (const it of feed) {
    if (it.kind === 'tools') {
      const k = toolGroupKey(it.tools);
      items.push({ type:'tools', key:`T:${k}:${it.tools.length}:${openTools.has(k) ? 1 : 0}`, tools: it.tools });
      continue;
    }
    const ts = it.m && it.m.time;
    if (ts && (!lastT || ts - lastT > 10 * 60 * 1000)) {
      const label = fmtMsgTime(ts);
      items.push({ type:'sep', key:`S:${label}`, text: label });
    }
    if (ts) lastT = ts;
    const txt = (it.m && it.m.text) || '';
    const nb = (it.m && it.m.blocks && it.m.blocks.length) || 0;
    items.push({ type:'msg', key:`M:${it.m.id}:${txt.length}:${nb}`, m: it.m });
  }
  ui.keys = ui.keys || [];
  ui.nodes = ui.nodes || [];
  let keep = 0;
  while (keep < ui.keys.length && keep < items.length && ui.keys[keep] === items[keep].key) keep++;
  for (let i = ui.nodes.length - 1; i >= keep; i--) {
    const n = ui.nodes[i];
    if (n && n.remove) n.remove();
  }
  ui.keys.length = keep;
  ui.nodes.length = keep;
  for (let i = keep; i < items.length; i++) {
    const it = items[i];
    const node = it.type === 'sep' ? el('div', { class:'sep', text: it.text })
      : it.type === 'tools' ? renderTools(it.tools)
      : renderMessage(it.m);
    // 有"深度求索中"或排队条时插在它们前面，保证顺序是 消息 → 排队 → 运行中
    const anchor = (ui.qBox && ui.qBox.isConnected) ? ui.qBox
      : (ui.typingNode && ui.typingNode.isConnected) ? ui.typingNode : null;
    if (anchor) ui.listWrap.insertBefore(node, anchor);
    else ui.listWrap.append(node);
    ui.nodes.push(node);
    ui.keys.push(it.key);
  }
  // 「显示更早」按钮单独维护，不参与增量索引
  if (!ui.hiddenBtn) {
    ui.hiddenBtn = el('button', { class:'btn', style:'margin:6px 0 10px;font-size:13px',
      onclick: () => { state.msgLimit = (state.msgLimit || 120) + 120; paintSession(); } });
  }
  if (hidden) {
    ui.hiddenBtn.textContent = `↑ 显示更早（还有 ${hidden} 条）`;
    ui.hiddenBtn.style.display = '';
    if (ui.listWrap.firstChild !== ui.hiddenBtn) ui.listWrap.prepend(ui.hiddenBtn);
  } else {
    ui.hiddenBtn.style.display = 'none';
  }
  if (!items.length) {
    if (!ui.emptyNode) {
      ui.emptyNode = el('div', { class:'empty', text:'还没有消息' });
      ui.listWrap.append(ui.emptyNode);
    }
  } else if (ui.emptyNode) { ui.emptyNode.remove(); ui.emptyNode = null; }
  if (keep < items.length) {
    hydrateImages(ui.listWrap);
    hydrateAttachments(ui.listWrap);
  }
  pruneCards();
  // 卡片必须增量渲染：以前每次 paint 都 replaceChildren + 重建，
  // 流式期间每秒有几十次 paint，用户正在点的选项会被换掉 ——
  // 表现就是"多问题时选项失效、而且失效得很快"。这里按卡片缓存节点。
  const cardKey = state.cards.map(c => c.id).join('|');
  if (cardKey !== ui.cardsKey) {
    ui.cardsKey = cardKey;
    ui.cardsWrap.replaceChildren();
    for (const c of state.cards) {
      // 节点还在就复用（已选中的选项、展开状态都保留），否则重建一次
      if (!c._node || !c._node.isConnected) c._node = renderCard(c);
      ui.cardsWrap.append(c._node);
    }
  }
  // 排队中的消息：主机把「正在跑的时候发的消息」放在 inbox 里排队
  if (!ui.qBox) ui.qBox = el('div', { class:'qlist' });
  if (state.queue && state.queue.length) {
    ui.qBox.replaceChildren();
    for (const it of state.queue) ui.qBox.append(renderQueueItem(it));
    const anchor = (ui.typingNode && ui.typingNode.isConnected) ? ui.typingNode : null;
    if (!ui.qBox.isConnected) {
      if (anchor) ui.listWrap.insertBefore(ui.qBox, anchor);
      else ui.listWrap.append(ui.qBox);
    } else if (anchor && ui.qBox.nextSibling !== anchor) {
      ui.listWrap.insertBefore(ui.qBox, anchor);
    }
  } else if (ui.qBox.isConnected) {
    ui.qBox.remove();
  }

  // 运行状态放在对话流末尾（像 AI-HUB 的"深度求索中"），不再挂在输入框下面
  if (state.busy) {
    if (!ui.typingNode || !ui.typingNode.isConnected) {
      ui.typingNode = el('div', { class:'typing' }, el('i'), el('i'), el('i'), el('span', { text:'深度求索中…' }));
      ui.listWrap.append(ui.typingNode);
    }
  } else if (ui.typingNode) {
    if (ui.typingNode.isConnected) ui.typingNode.remove();
    ui.typingNode = null;
  }
  if (scroll === 'bottom' || atBottom) {
    requestAnimationFrame(() => { ui.body.scrollTop = ui.body.scrollHeight; });
  }
}

function paint() {
  if (state.view === 'session' && ui.sessionId === state.sessionId && ui.body && ui.body.isConnected) paintSession();
  else render();
}

function renderSession(wrap) {
  const back = el('button', { class:'ico', text:'☰', 'data-bell':'', onclick: openDrawer, title:'会话列表' });
  const dot = el('span', {
    class: state.stream === 'open' ? 'dot run' : 'dot',
    title: state.stream === 'open' ? '实时已连接' : '连接中…',
  });
  const more = el('button', { class:'ico', text:'⋯', onclick: () => openSheet([
    { label:'刷新消息', icon:'⟳', run: () => loadMessages(true) },
    { label:'文件', icon:'📁', run: () => openFileDrawer(state.sessionCwd || '') },
    { label:'重新加载', icon:'↻', run: reloadApp },
    { label:'键盘诊断', icon:'⌨', run: () => {
      state.debug = !state.debug;
      if (ui.strip) ui.strip.textContent = state.debug ? debugText() : '';
      if (state.debug) setInterval(() => { if (state.debug && ui.strip) ui.strip.textContent = debugText(); }, 400);
    } },
    { label:'恢复链接', icon:'🔗', run: openRecovery },
    { label:'回到列表', icon:'‹', run: () => { state.live?.close(); clearInterval(state.poll); state.view='list'; ui.sessionId=null; render(); refreshAll(); } },
  ]) });
  wrap.append(headerEl(el('span', { class:'httl' }, dot, el('span', { class:'httltext', text: state.sessionTitle })), back, more));
  const metabar = el('div', { class:'metabar' });
  wrap.append(metabar);

  // 标题下的会话用量（数据来自 /session/stats 的 sessionStats）
  function paintMeta() {
    if (!metabar.isConnected) return;
    const s = state.sessStats;
    const c = state.ctxInfo || {};
    metabar.replaceChildren();
    if (!s) { metabar.append(el('span', { text:'用量加载中…' })); return; }
    const tps = s.decodeMs > 0 ? Math.round(s.decodeTokens / (s.decodeMs / 1000)) : 0;
    const ttft = (s.ttftSteps && s.ttftMs) ? (s.ttftMs / s.ttftSteps / 1000) : 0;
    const parts = [];
    if (c.used && c.window) {
      const pct = Math.round((c.used / c.window) * 100);
      const tone = pct >= 85 ? 'var(--bad)' : pct >= 65 ? 'var(--warn)' : 'var(--fg)';
      parts.push(el('span', { style:`font-weight:600;color:${tone}`,
        text:`上下文 ${pct}%` }));
      parts.push(el('span', { text:`${fmtTok(c.used)}/${fmtTok(c.window)}` }));
    }
    if (tps) parts.push(el('span', { text: `${tps} tok/s` }));
    if (ttft) parts.push(el('span', { text: `首字 ${ttft.toFixed(1)}s` }));
    parts.push(el('span', { text: `${s.turns || 0} 轮 · ${s.steps || 0} 步` }));
    for (const p of parts) metabar.append(p);
  }
  async function loadSessionStats() {
    try {
      const r = await api('/api/mobile/v1/session/stats?sessionId=' + encodeURIComponent(state.sessionId));
      const p = r.projections || {};
      state.sessStats = p.sessionStats || null;
      const cp = p.contextPressure || null;
      const ct = p.contextTimeline || null;
      // 首次进入/断线重连时，排队条也要从投影里补一次
      const inbox = p.inbox;
      if (inbox) {
        const rows = [].concat(inbox['next-turn'] || []);
        state.queue = rows.filter(r => r && r.id).map(r => ({ id: r.id, placement:'queued',
          message: { id: r.id, content: r.content } }));
        paintSession();
      }
      state.ctxInfo = {
        used: (cp && cp.pressureTokens) || null,
        window: (cp && cp.contextWindow) || (ct && ct.contextWindow) || null,
        maxOutput: (ct && ct.maxOutputTokens) || null,
        breakdown: (ct && ct.current) || null,
      };
    } catch { state.sessStats = null; state.ctxInfo = null; }
    paintMeta();
  }
  paintMeta();
  loadSessionStats();
  // 点用量条看上下文构成
  metabar.addEventListener('click', () => {
    const c = state.ctxInfo;
    if (!c || !c.breakdown) { toast('还没有上下文数据'); return; }
    const b = c.breakdown;
    const rows = [
      ['上下文占用', c.window ? `${Math.round((c.used / c.window) * 100)}%  (${fmtTok(c.used)} / ${fmtTok(c.window)})` : '-'],
      ['系统提示', fmtTok(b.system || 0)],
      ['工具定义', fmtTok(b.tools || 0)],
      ['用户消息', fmtTok(b.user || 0)],
      ['注入内容', fmtTok(b.inject || 0)],
      ['技能', fmtTok(b.skill || 0)],
      ['助手输出', fmtTok(b.assistant || 0)],
      ['其中思考', fmtTok(b.assistantReasoning || 0)],
      ['最大输出', c.maxOutput ? fmtTok(c.maxOutput) : '-'],
    ];
    openInfoBox('上下文构成', rows);
  });

  const body = el('main');
  const listWrap = el('div');
  const cardsWrap = el('div');
  body.append(listWrap, cardsWrap);
  installPullToRefresh(body);

  const strip = el('div', { class:'streamline' });
  const ta = el('div', { class:'ta', contenteditable:'true', role:'textbox', 'aria-multiline':'true',
    'data-ph':'发消息或创建任务，/ 调用指令，@ 文件或对话' });
  const getText = () => (ta.innerText || '').replace(/\u00a0/g, ' ').replace(/\n$/, '');
  const clearText = () => { ta.textContent = ''; ta.style.height = 'auto'; };
  const caretToEnd = () => {
    try {
      const r = document.createRange(); r.selectNodeContents(ta); r.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    } catch {}
  };

  // 聚焦输入框时把列表带到底部（键盘弹起后不用手动滑）
  ta.addEventListener('focus', () => {
    setTimeout(() => { if (ui.body) ui.body.scrollTop = ui.body.scrollHeight; }, 320);
  });
  // 输入 `/` 弹指令面板，输入 `@` 弹文件引用
  const slashBox = el('div', { class:'slash' });
  async function updateHints() {
    const t = getText();
    const show = (nodes) => {
      slashBox.replaceChildren();
      slashBox.style.display = nodes.length ? 'block' : 'none';
      for (const n of nodes) slashBox.append(n);
    };

    // /指令
    if (/^\/[^\s]*$/.test(t)) {
      const q = t.slice(1).toLowerCase();
      const list = await ensureCommands();
      const hits = list.filter(c => String(c.name || '').toLowerCase().includes(q)).slice(0, 8);
      if (!hits.length) {
        // 有前缀但没匹配：也要给一行反馈，否则面板"消失"像是坏了
        return show([el('div', { class:'sitem' },
          el('b', { text:'没有匹配的指令' }),
          el('span', { class:'sdesc', text:`试试 /help 或直接发送` }))]);
      }
      return show(hits.map(c => el('div', { class:'sitem', onclick: () => {
        ta.textContent = `/${c.name} `;
        slashBox.replaceChildren(); slashBox.style.display = 'none';
        ta.focus(); caretToEnd();
      }}, el('b', { text: `/${c.name}` }), c.description ? el('span', { class:'sdesc', text: c.description }) : null)));
    }

    // @文件引用：支持 `@子目录/` 逐层往下
    const at = /(^|\s)@([^\s]*)$/.exec(t);
    if (at) {
      const typed = at[2];
      const slash = typed.lastIndexOf('/');
      const dirPart = slash >= 0 ? typed.slice(0, slash) : '';
      const q = (slash >= 0 ? typed.slice(slash + 1) : typed).toLowerCase();
      const base = state.sessionCwd || '';
      if (!base) return show([]);
      const dir = dirPart ? base.replace(/[\\/]+$/, '') + '\\' + dirPart.replace(/\//g, '\\') : base;
      let entries = [];
      try {
        const r = await api('/api/mobile/v1/directory/listing?path=' + encodeURIComponent(dir));
        entries = (r.listing && r.listing.entries) || [];
      } catch { entries = []; }
      const hits = entries
        .filter(e => !e.hidden && String(e.name || '').toLowerCase().includes(q))
        .sort((a, b) => (a.kind === 'folder' ? 0 : 1) - (b.kind === 'folder' ? 0 : 1))
        .slice(0, 10);
      if (!hits.length) {
        return show([el('div', { class:'sitem' },
          el('b', { text:'没有匹配的文件' }),
          el('span', { class:'sdesc', text: dir }))]);
      }
      return show(hits.map(e => el('div', { class:'sitem', onclick: () => {
        const token = /(^|\s)@([^\s]*)$/.exec(getText());
        const before = token ? getText().slice(0, token.index) : '';
        const prefix = before && !before.endsWith(' ') ? ' ' : '';
        if (e.kind === 'folder') {
          // 文件夹只补到 `@dir/`，继续往下选
          const nextDir = dirPart ? `${dirPart}/${e.name}` : e.name;
          ta.textContent = `${before}${prefix}@${nextDir}/`;
          ta.focus(); caretToEnd();
          updateHints();
          return;
        }
        const ref = /\s/.test(e.path) ? `"${e.path}"` : e.path;
        ta.textContent = `${before}${prefix}${ref} `;
        slashBox.replaceChildren(); slashBox.style.display = 'none';
        ta.focus(); caretToEnd();
      }},
        el('b', { text: (e.kind === 'folder' ? '📁 ' : '📄 ') + e.name }),
        el('span', { class:'sdesc', text: e.kind === 'folder' ? '继续往下' : e.path }))));
    }

    show([]);
  }
  ta.addEventListener('input', () => {
    updateHints();
    clearTimeout(ta._ht);
    ta._ht = setTimeout(updateHints, 260);   // 兜底：等异步列表回来后再刷一次
    clearTimeout(ta._dt);
    ta._dt = setTimeout(() => saveDraft(state.sessionId, getText()), 400);
  });
  ta.addEventListener('keyup', () => updateHints());
  // 恢复未发送的草稿
  const draft = getDrafts()[state.sessionId];
  if (draft) ta.textContent = draft;
  const sendBtn = el('button', { class:'send', text:'↑', onclick: () => send() });

  // 待发送附件（缩略图）——选完先挂着，能和文字一起发
  const attach = el('div', { class:'attach' });
  function updateAttachProgress(item) {
    const idx = state.pending.indexOf(item);
    const node = attach.children[idx];
    if (!node) return;
    const pct = Math.round((item.progress || 0) * 100);
    const bar = node.querySelector('.attprog');
    const label = node.querySelector('.attpct');
    if (bar) bar.style.width = pct + '%';
    if (label) label.textContent = pct + '%';
  }
  function renderAttach() {
    attach.replaceChildren();
    attach.style.display = state.pending.length ? 'flex' : 'none';
    for (const a of state.pending) {
      const chip = el('div', { class:'att', onclick: () => {
        if (a.previewUrl) openImageFull(a.previewUrl);
      }});
      if (a.previewUrl) chip.append(el('img', { src: a.previewUrl, alt: a.name || '' }));
      else chip.append(el('span', { class:'attdoc', text:'📎' }));
      if (a.uploading) {
        chip.append(el('div', { class:'attprog', style:`width:${Math.round((a.progress||0)*100)}%` }));
        chip.append(el('div', { class:'attpct', text:Math.round((a.progress||0)*100) + '%' }));
      } else {
        chip.append(el('button', { class:'attx', text:'×', onclick: (e) => {
          e.stopPropagation();
          state.pending = state.pending.filter(x => x !== a);
          if (a.previewUrl) URL.revokeObjectURL(a.previewUrl);
          renderAttach();
        }}));
      }
      attach.append(chip);
    }
    // 还有没传完（或正在发送）就不让重复点
    sendBtn.disabled = !!state.sending || state.pending.some(a => a.uploading);
  }


  async function send() {
    const text = getText().trim();
    const atts = state.pending.slice();
    if ((!text && !atts.length) || sendBtn.disabled) return;
    state.sending = true;
    sendBtn.disabled = true;

    // 先把还没上传的附件传掉（此时才产生 uploadId，不会过期）
    for (const a of atts) {
      if (a.uploadId || a.path || !a.file) continue;
      a.uploading = true; renderAttach();
      try {
        const up = await uploadFile(a.file, (i, n) => { a.progress = i / n; updateAttachProgress(a); });
        const isImg = (a.mediaType || '').startsWith('image/');
        a.uploadId = isImg ? up.uploadId : null;
        a.path = isImg ? null : up.path;
        a.file = null;
      } catch (e) {
        a.uploading = false; state.sending = false; renderAttach();
        toast('附件上传失败：' + (e.message || e));
        return;   // 中止发送，内容与附件都还留在原地
      }
      a.uploading = false; renderAttach();
    }

    const blocks = [];
    const notes = [];
    for (const a of atts) {
      if (a.uploadId) blocks.push({ type:'image', mediaType: a.mediaType, uploadId: a.uploadId });
      else if (a.path) notes.push(`📎 已上传文件：${a.path}`);
    }
    const fullText = [text, ...notes].filter(Boolean).join('\n');
    if (fullText) blocks.unshift({ type:'text', text: fullText });

    const tmp = { id:`tmp-${Date.now()}`, role:'user', text: fullText, blocks:[], pending:true };
    state.messages.push(tmp);
    paintSession({ scroll:'bottom' });
    clearText();
    saveDraft(state.sessionId, '');
    state.pending = []; renderAttach();

    try {
      await api('/api/mobile/v1/session/send', { method:'POST', body: {
        sessionId: state.sessionId, content: blocks, clientMessageId: crypto.randomUUID(),
      }});
      state.busy = true;
      await loadMessages();
    } catch (e) {
      state.messages = state.messages.filter(m => m.id !== tmp.id);
      // 发送失败要把内容和附件还回去：网络抖一下不该把用户打的东西吞掉
      if (text) { ta.textContent = text; saveDraft(state.sessionId, text); try { caretToEnd(); } catch {} }
      state.pending = atts;
      renderAttach();
      paintSession();
      toast('发送失败：' + String(e.message || e) + '（内容已保留）');
    } finally { state.sending = false; sendBtn.disabled = false; ta.focus(); }
  }

  // contenteditable 没有 input 事件里的 value，粘贴要自己净化成纯文本
  ta.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain');
    document.execCommand('insertText', false, t);
  });
  // 手机上没有 Shift 键，所以触屏设备让 Enter = 换行，发送只走按钮；桌面保持 Enter 发送
  const touchOnly = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  ta.addEventListener('keydown', e => {
    if (e.key !== 'Enter' || e.isComposing) return;
    if (touchOnly) return;
    if (e.shiftKey) return;
    e.preventDefault();
    send();
  });

  // ---- 附件：选完只上传并挂起，点发送才和文字一起发出去 ----
  const fileInput = el('input', { type:'file', accept:'image/*,video/*', multiple:'multiple', style:'display:none' });
  // 选图只做本地预览，真正的上传推迟到点发送那一刻（避免 uploadId 过期）
  fileInput.addEventListener('change', () => {
    const files = [...fileInput.files];
    fileInput.value = '';
    for (const f of files) {
      const mediaType = f.type || 'image/jpeg';
      state.pending.push({
        file: f, mediaType, name: f.name,
        previewUrl: URL.createObjectURL(f), progress: 0, uploading: false,
      });
    }
    renderAttach();
  });

  const modelRow = el('div', { class:'model', style:'cursor:pointer', onclick: () => openModelPicker() },
    state.model ? el('b', { text: state.model }) : el('span', { text:'DeepSeek' }), el('span', { text:'⌄' }));
  // 中断运行：正在跑的时候才出现
  const stopBtn = el('button', { class:'stop', text:'■', title:'中断运行', onclick: async () => {
    if (!confirm('中断这次运行？')) return;
    try {
      await api('/api/mobile/v1/session/stop', { method:'POST', body: { sessionId: state.sessionId } });
      state.busy = false; paintSession();
    } catch (e) { toast('取消失败：' + (e.message || e)); }
  }});
  const dock = el('div', { class:'dock' },
    strip,
    slashBox,
    attach,
    el('div', { class:'composer' }, ta,
      el('div', { class:'crow' },
        el('button', { class:'plus', text:'+', onclick: () => fileInput.click() }),
        modelRow,
        el('div', { class:'sendgroup' }, stopBtn, sendBtn))),
    fileInput,
  );

  // 回到底部 + 新消息提示
  const jump = el('button', { class:'jump', text:'↓ 回到底部', onclick: () => {
    body.scrollTop = body.scrollHeight; state.unseen = 0; updateJump();
  }});
  function updateJump() {
    const far = body.scrollHeight - body.scrollTop - body.clientHeight > 240;
    jump.classList.toggle('on', far);
    jump.textContent = state.unseen > 0 ? `↓ ${state.unseen} 条新消息` : '↓ 回到底部';
  }
  body.addEventListener('scroll', () => {
    const far = body.scrollHeight - body.scrollTop - body.clientHeight > 240;
    if (!far) state.unseen = 0;
    updateJump();
  }, { passive: true });

  wrap.append(body, dock, jump);
  // 让"回到底部"永远贴在输入框上方，而不是压进输入框里
  const syncDockH = () => {
    try { wrap.style.setProperty('--dock-h', dock.offsetHeight + 'px'); } catch {}
  };
  syncDockH();
  requestAnimationFrame(syncDockH);
  if (window.ResizeObserver) {
    try { new ResizeObserver(syncDockH).observe(dock); } catch {}
  }

  ui = { sessionId: state.sessionId, body, listWrap, cardsWrap, ta, sendBtn, stopBtn, strip, dot, modelEl: modelRow,
    jump, updateJump, loadStats: loadSessionStats, keys: [], nodes: [], cardsKey: '', prevCount: undefined };
  paintSession({ scroll:'bottom' });
  // 进会话直接定位到底部 + 聚焦输入框（iOS 上焦点可能被系统拦，忽略即可）
  requestAnimationFrame(() => { body.scrollTop = body.scrollHeight; });
  setTimeout(() => { try { ta.focus({ preventScroll: true }); } catch {} }, 120);
}

// 把「纯工具调用」的连续消息合并成一行步骤，避免一屏都是 ⚙ chip
function buildFeed() {
  const out = [];
  let pending = [];
  const flush = () => { if (pending.length) { out.push({ kind:'tools', tools: pending }); pending = []; } };
  for (const m of state.messages) {
    const blocks = m.blocks || [];
    const hasBody = (m.text && m.text.trim()) || blocks.some(b => b.type === 'text' && b.text);
    const tools = blocks.filter(b => b.type === 'tool-call' || b.type === 'tool-result');
    if (m.role !== 'user' && !hasBody && tools.length) { pending.push(...tools); continue; }
    flush();
    out.push({ kind:'msg', m });
  }
  flush();
  return out;
}

// 一个回合里的命令/改动折成一行，点开才展开（抄 Ovis 的做法）
const openTools = new Set();
const toolGroupKey = (tools) => (tools[0] && (tools[0].callId || tools[0].name)) || 'k';

function renderTools(tools) {
  const names = [...new Set(tools.filter(t => t.type === 'tool-call').map(t => t.name || 'tool'))];
  const key = toolGroupKey(tools);
  const open = openTools.has(key);
  const summary = el('div', { class:'steps', onclick: () => {
    if (openTools.has(key)) openTools.delete(key); else openTools.add(key);
    paintSession();
  }},
    el('span', { class:'chev2', text: open ? '▾' : '▸' }),
    el('span', { text:`${tools.length} 步` }),
    el('span', { class:'dim', style:'margin-left:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap',
      text: names.slice(0, 3).join(' · ') + (names.length > 3 ? ` +${names.length - 3}` : '') }),
  );
  if (!open) return summary;
  const box = el('div', { class:'stepsbody' });
  for (const t of tools) {
    box.append(el('div', { class:'step' },
      el('span', { text: t.type === 'tool-call' ? `⚙ ${t.name || 'tool'}` : '↩ 结果' })));
  }
  return el('div', {}, summary, box);
}

// 长按消息：复制 / 引用
function openMsgMenu(text, ts) {
  if (!text) return;
  openSheet([
    { label:'复制', icon:'⧉', run: async () => {
      try { await navigator.clipboard.writeText(text); }
      catch {
        const t = document.createElement('textarea');
        t.value = text; document.body.append(t); t.select();
        document.execCommand('copy'); t.remove();
      }
      toast('已复制');
    } },
    { label:'引用到输入框', icon:'↩', run: () => quoteToComposer(text) },
  ], ts ? fmtMsgTime(ts) : '消息');
}

function quoteToComposer(text) {
  if (!ui.ta) return;
  const quoted = String(text).split('\n').slice(0, 3).map(l => `> ${l}`).join('\n');
  ui.ta.textContent = quoted + '\n\n';
  ui.ta.focus();
  try {
    const r = document.createRange();
    r.selectNodeContents(ui.ta); r.collapse(false);
    const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r);
  } catch {}
}

function attachMsgActions(node, text, ts) {
  if (!text) return node;
  let lp = null;
  const arm = () => { lp = setTimeout(() => openMsgMenu(text, ts), 480); };
  const disarm = () => { if (lp) { clearTimeout(lp); lp = null; } };
  node.addEventListener('touchstart', arm, { passive: true });
  node.addEventListener('touchend', disarm, { passive: true });
  node.addEventListener('touchmove', disarm, { passive: true });
  node.addEventListener('contextmenu', (e) => { e.preventDefault(); openMsgMenu(text, ts); });
  return node;
}

// 每条消息下方的操作：复制 / 从这里分叉
// ---------------- 排队中的消息（宿主侧 inbox，靠 session/queue 帧同步） ----------------
function queueText(it) {
  const c = (it && it.message && it.message.content) || (it && it.content) || [];
  return c.filter(b => b && b.type === 'text').map(b => b.text).join('\n');
}

async function queueAct(it, action, okMsg) {
  try {
    await api('/api/mobile/v1/session/queue/update', { method:'POST', body: {
      sessionId: state.sessionId, itemId: it.id, action,
    }});
    if (okMsg) toast(okMsg);
    if (action.kind === 'steer' || action.kind === 'remove') {
      state.queue = (state.queue || []).filter(x => x.id !== it.id);
    }
    paintSession();
    try { ui.loadStats?.(); } catch {}
  } catch (e) { toast('操作失败：' + (e.message || e)); }
}

/**
 * 编辑排队消息：不再用 prompt 原地改。
 * 原因：prompt 只挡住界面，宿主那边照跑 —— 上一轮跑完的瞬间队列就被取走发出了，
 * 于是"还没改完就被发了"；而保存时条目已不在队列，编辑又静默落空。
 * 现在：先把这条从队列里删掉（原子），再把原文放回输入框让用户改，改完照常发送。
 */
async function queueEdit(it, old) {
  try {
    await api('/api/mobile/v1/session/queue/update', { method:'POST', body: {
      sessionId: state.sessionId, itemId: it.id, action: { kind:'remove' },
    }});
  } catch (e) {
    toast('这条可能已经被发出去了：' + (e.message || e));
    state.queue = (state.queue || []).filter(x => x.id !== it.id);
    paintSession();
    return;
  }
  state.queue = (state.queue || []).filter(x => x.id !== it.id);
  paintSession();
  const ta = ui && ui.ta;
  if (!ta) { toast('已撤回排队消息'); return; }
  const cur = (ta.innerText || '').replace(/\u00a0/g, ' ');
  ta.textContent = (cur.trim() ? cur.replace(/\s*$/, '') + '\n' : '') + old;
  ta.focus();
  try { saveDraft(state.sessionId, ta.textContent); } catch {}
  try {
    const r = document.createRange(); r.selectNodeContents(ta); r.collapse(false);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  } catch {}
  toast('已撤回，改完直接发送');
}

function renderQueueItem(it) {
  const text = queueText(it);
  return el('div', { class:'qitem' },
    el('div', { class:'qhead' },
      el('span', { class:'qtag', text:'排队中' }),
      el('span', { style:'flex:1' }),
      el('button', { class:'qmini', text:'删除', onclick: () => queueAct(it, { kind:'remove' }, '已删除') }),
      el('button', { class:'qmini', text:'编辑', onclick: () => queueEdit(it, text) }),
      el('button', { class:'qmini primary', text:'立刻发送', onclick: () => queueAct(it, { kind:'steer' }, '已插话，马上处理') }),
    ),
    el('div', { class:'qtext', text }),
  );
}

function msgActions(m, alignRight) {
  const text = (m && m.text) || '';
  const row = el('div', { class: 'mact' + (alignRight ? ' right' : '') });
  if (text) {
    row.append(el('button', { onclick: async (e) => {
      e.stopPropagation();
      try { await navigator.clipboard.writeText(text); }
      catch {
        const t = document.createElement('textarea');
        t.value = text; document.body.append(t); t.select();
        document.execCommand('copy'); t.remove();
      }
      toast('已复制这条消息');
    }}, '⧉ 复制'));
  }
  const seq = Number.isSafeInteger(m && m.seq) ? m.seq : null;
  if (seq !== null && seq > 0) {
    row.append(el('button', { onclick: (e) => { e.stopPropagation(); forkSessionAt(m, seq); } }, '⑂ 分支'));
  }
  return row;
}

async function forkSessionAt(m, atSeq) {
  const ok = confirm('从这条消息分叉出一个新会话？\n原会话不受影响，新会话保留到这条为止的上下文。');
  if (!ok) return;
  try {
    const r = await api('/api/mobile/v1/session/fork', { method:'POST', body: {
      sessionId: state.sessionId, atSeq, increaseTitle: true,
    }});
    await refreshAll(true);
    const newId = r.sessionId || (r.session && r.session.sessionId);
    toast('已创建分支会话');
    if (newId) {
      const s = state.sessions.find(x => x.sessionId === newId) || { sessionId: newId, title: r.title || '分支会话' };
      openSession(s);
    }
  } catch (e) { toast('分叉失败：' + (e.message || e)); }
}

function renderMessage(m) {
  const blocks = m.blocks || [];
  const textBlocks = blocks.filter(b => b.type === 'text' && b.text);
  const mediaBlocks = blocks.filter(b => b.type === 'image' && b.attachmentId);
  const toolBlocks = blocks.filter(b => b.type === 'tool-call' || b.type === 'tool-result');
  const body = (m.text && m.text.trim()) ? m.text : textBlocks.map(b => b.text).join('\n');

  const images = mediaBlocks.map(b => el('img', {
    class: 'mdimg', 'data-att': b.attachmentId, alt: b.name || '图片',
  }));
  const gallery = images.length ? el('div', { class:'imgrow' }, ...images) : null;

  if (m.role === 'user') {
    const bubble = el('div', { class:'bubble', style: m.pending ? 'opacity:.55' : '' });
    if (body) bubble.append(document.createTextNode(body));
    if (gallery) bubble.append(gallery);
    if (!body && !images.length) bubble.append(document.createTextNode('(空消息)'));
    return el('div', { class:'mholder' },
      attachMsgActions(el('div', { class:'msg user' }, bubble), body, m.time),
      msgActions(m, true));
  }
  const wrap = el('div', { class:'msg assistant' });
  if (body) wrap.append(el('div', { class:'md', html: mdToHtml(body) }));
  if (gallery) wrap.append(gallery);
  if (toolBlocks.length) {
    wrap.append(el('div', { class:'tools' }, toolBlocks.map(b =>
      el('span', { class:'tool', text: b.type === 'tool-call' ? `⚙ ${b.name || 'tool'}` : '↩ 结果' }))));
  }
  return el('div', { class:'mholder' },
    attachMsgActions(wrap, body, m.time),
    msgActions(m, false));
}

// ---------------------------------------------------------------- 审批 / 提问卡
function renderCard(c) {
  // 帧有两种形状：顶层字段（approval/requested）与全部包在 data 里（approval/asked），统一摊平
  const d = (c.data && c.data.data) ? { ...c.data, ...c.data.data } : (c.data || {});
  const card = el('div', { class:'card' });
  if (c.kind === 'approval') {
    card.append(el('div', { class:'ct', text:'工具请求确认' }));
    if (d.toolName) card.append(el('div', { class:'cmeta', text:`工具：${d.toolName}${d.classLabel ? ' · ' + d.classLabel : ''}` }));
    const line = d.reason || d.fact;
    if (line) card.append(el('div', { class:'cfact', text: line }));
    if (!d.toolName && !line && !d.command) {
      card.append(el('div', { class:'cmeta', text:'（这条审批没有附带说明，通常是历史记录的残留）' }));
    }
    if (d.command) card.append(el('pre', { text: d.command }));
    const acts = el('div', { class:'acts' },
      el('button', { class:'btn ok', onclick: () => respondApproval(d, 'allowed-once', c) }, '允许一次'));
    if (d.rememberable) {
      // 第三颗按钮上直接写清"对什么不再问"（Ovis 的做法），别让人猜"这一类"是哪一类
      acts.append(el('button', { class:'btn', style:'font-size:13px;line-height:1.25;padding:8px',
        onclick: () => respondApproval(d, 'allowed-class', c) },
        el('div', { text:'以后都允许' }),
        d.classLabel ? el('div', { style:'font-size:10.5px;color:var(--dim);font-weight:400;margin-top:2px;'
          + 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap', text: d.classLabel }) : null));
    }
    acts.append(el('button', { class:'btn no', onclick: () => respondApproval(d, 'rejected', c) }, '拒绝'));
    card.append(acts);
    return card;
  }
  card.append(el('div', { class:'ct', text:'需要你回答' }));
  const qs = d.questions || [];
  // 选中状态挂在卡片对象上，而不是渲染闭包里：即便节点被重建，勾选也不会丢
  const picks = c._picks || (c._picks = new Map(qs.map(q => [q.id, new Set()])));
  for (const q of qs) {
    const block = el('div', { class:'qblock' });
    if (q.header) block.append(el('div', { class:'cmeta', text: q.header }));
    block.append(el('div', { class:'cfact', style:'font-weight:600', text: q.question || q.id }));
    if (q.detail) block.append(el('div', { class:'cmeta', text: q.detail }));
    const labelOf = o => typeof o === 'string' ? o : (o.label ?? o.value ?? '');
    const set = picks.get(q.id) || new Set();
    picks.set(q.id, set);
    const btns = [];
    for (const o of (q.options || [])) {
      const l = labelOf(o);
      const btn = el('button', { class:'opt' + (set.has(l) ? ' sel' : '') },
        el('div', { text: l }),
        (o && o.description) ? el('small', { text: o.description }) : null);
      btn.addEventListener('click', () => {
        if (q.multiSelect) { set.has(l) ? set.delete(l) : set.add(l); }
        else { set.clear(); set.add(l); }
        for (const b of btns) b.classList.toggle('sel', set.has(b.__label));
      });
      btn.__label = l;
      btns.push(btn);
      block.append(btn);
    }
    card.append(block);
  }
  card.append(el('div', { class:'acts' }, el('button', { class:'btn primary', onclick: async () => {
    // 宿主侧「每题恰好一条答案」，空 selected 会被当成"没选"直接跳过；
    // 这里先挡一道，避免一次误提交把整组问题都 skip 掉
    const missing = qs.filter(q => !(picks.get(q.id) && picks.get(q.id).size));
    if (missing.length) { toast(`还有 ${missing.length} 个问题没选`); return; }
    try {
      await api('/api/mobile/v1/question/respond', { method:'POST', body: {
        rpcId: d.rpcId, sessionId: d.sessionId || state.sessionId,
        answer: { answers: [...picks].map(([id, set]) => ({ id, selected: [...set] })) },
      }});
      state.cards = state.cards.filter(x => x !== c); paint();
    } catch (e) { toast('提交失败：' + String(e.message || e)); }
  }}, '提交')));
  return card;
}

async function respondApproval(d, outcome, c) {
  try {
    await api('/api/mobile/v1/approval/respond', { method:'POST', body: {
      rpcId: d.rpcId || (c && c.data && c.data.rpcId),
      sessionId: d.sessionId || state.sessionId,
      approvalId: d.approvalId || d.id || (c && c.data && (c.data.approvalId || (c.data.data && c.data.data.id))),
      outcome,
    }});
    state.cards = state.cards.filter(x => x !== c); paint();
  } catch (e) { toast(String(e.message || e)); }
}

// 重新加载整页（顺带让 SW 检查一次更新）——独立 PWA 没有浏览器刷新按钮，只能靠这个
async function reloadApp() {
  try {
    const reg = await navigator.serviceWorker?.getRegistration();
    await reg?.update();
  } catch {}
  setTimeout(() => location.reload(), 60);
}

// 下拉刷新：PWA 独立模式下浏览器不给，只能自己实现
function installPullToRefresh(scroller) {
  const hint = el('div', { class:'ptr', text:'下拉刷新' });
  scroller.prepend(hint);
  let startY = 0, pulling = false, dist = 0;
  scroller.addEventListener('touchstart', e => {
    if (scroller.scrollTop <= 0) { startY = e.touches[0].clientY; pulling = true; dist = 0; }
  }, { passive: true });
  scroller.addEventListener('touchmove', e => {
    if (!pulling) return;
    dist = e.touches[0].clientY - startY;
    if (dist <= 0) { hint.style.height = '0'; hint.classList.remove('on'); return; }
    hint.classList.add('on');
    hint.style.height = Math.min(52, dist * 0.55) + 'px';
    hint.textContent = dist > 72 ? '松开刷新' : '下拉刷新';
  }, { passive: true });
  scroller.addEventListener('touchend', () => {
    if (!pulling) return;
    pulling = false;
    if (dist > 72) { hint.textContent = '刷新中…'; reloadApp(); }
    else { hint.classList.remove('on'); hint.style.height = '0'; }
  });
}

// ---------------------------------------------------------------- sheet
function openSheet(items, footerText) {
  const mask = el('div', { class:'mask', onclick: (e) => { if (e.target === mask) close(); } });
  const sheet = el('div', { class:'sheet' });
  for (const it of items) {
    sheet.append(el('div', { class:'item', onclick: () => { close(); it.run(); } },
      el('span', { style:'width:22px;text-align:center;color:var(--dim)', text: it.icon || '' }),
      el('span', { text: it.label })));
  }
  sheet.append(el('div', { class:'ver', text: footerText || `版本 ${APP_VERSION}` }));
  sheet.append(el('div', { class:'cancel', text:'取消', onclick: close }));
  function close() { mask.remove(); }
  mask.append(sheet);
  document.body.append(mask);
}

// ---------------------------------------------------------------- 流程
async function refreshAll(force=false) {
  try {
    const [s, w] = await Promise.all([
      api('/api/mobile/v1/sessions' + (force ? '?fresh=1' : '')),
      api('/api/mobile/v1/workspaces').catch(() => ({ items: [] })),
    ]);
    state.sessions = s.items || [];
    state.workspaces = w.items || [];
    saveListCache(state.sessions);
    syncBadge();
    if (state.view === 'list') render();
    else if (isWide()) {
      // 宽屏下会话开着时，只刷左侧栏，不动右侧聊天（否则会打断输入、跳滚动位置）
      const side = document.querySelector('.app.wide .side');
      if (side) { side.replaceChildren(); renderList(side); }
    }
  } catch (e) {
    if (['device-revoked','device-expired','unauthorized'].includes(e.code)) {
      state.token = ''; localStorage.clear(); render();
    }
  }
}

// 运行态以服务端 sessions[].running 为准。列表有 30 秒缓存，所以必须 fresh=1 才拿得到实时值。
async function syncRunning() {
  try {
    const r = await api('/api/mobile/v1/sessions?fresh=1');
    const s = (r.items || []).find(x => x.sessionId === state.sessionId);
    if (!s) return;
    const running = !!s.running;
    if (running !== state.busy) {
      state.busy = running;
      if (state.view === 'session') { paintSession(); try { ui.loadStats?.(); } catch {} }
    }
  } catch {}
}

// 卡片去重 + 过期：重连/回放会把历史审批帧再推一遍，不去重就会叠出好几张一样的卡
function pushCard(kind, frame) {
  const f = frame || {};
  const inner = f.data || {};
  // 同一条审批会有 approval/requested（两次文案）+ approval/asked（字段在 data 里）三种帧，
  // 必须认到同一个 id，否则会叠出好几张一样的卡
  const id = f.approvalId || f.questionId || inner.id || inner.approvalId
    || f.rpcId || JSON.stringify(f).slice(0, 80);
  if (state.cards.some(c => c.id === id)) return;
  state.cards.push({ kind, data: frame, id, at: Date.now() });
  if (state.cards.length > 8) state.cards = state.cards.slice(-8);
}
function pruneCards() {
  const now = Date.now();
  state.cards = state.cards.filter(c => !c.at || now - c.at < 5 * 60 * 1000);
}

function openSession(s) {
  closeDrawer();
  state.view = 'session';
  state.sessionId = s.sessionId;
  state.sessionTitle = s.title || '(无标题)';
  state.messages = []; state.cards = []; state.lastSeq = 0; state.busy = !!s.running;
  state.model = null; state.pending = []; state.unseen = 0; state.msgLimit = 120;
  state.queue = [];
  state.modelGroups = []; state.modelMeta = null;
  state.sessionCwd = s.cwd || '';
  render();
  // 先拿本地缓存把内容画出来（秒开 / 离线也能看），再用网络结果覆盖
  const cachedMsgs = readMsgCache(s.sessionId);
  if (cachedMsgs && Array.isArray(cachedMsgs.messages) && cachedMsgs.messages.length) {
    state.messages = cachedMsgs.messages;
    paintSession({ scroll:'bottom' });
  }
  // 先取完消息拿到正确的 lastSeq，再订阅流：否则 lastSeq=0 会把历史帧（含旧审批）整体回放一遍
  loadMessages().then(() => {
    loadModel(); subscribeSession();
    // 打开即视为已读（宿主侧有 readAt，图标角标也就跟着掉一个）
    markRead(state.sessionId).then(() => { refreshAll(); syncBadge(); });
  });
  // 兜底轮询：SSE 走不通时这条就是主通道，1.5 秒一次，保证"发完马上能看到"。
  // SSE 通的时候它会先到，轮询只是补漏（1.5s 内没有新内容就不会重绘，开销很小）。
  clearInterval(state.poll);
  state.poll = setInterval(() => {
    if (state.view !== 'session') return;
    // 页面在后台就不轮询（省电）；空闲时 4 秒一次，运行中 1.5 秒
    if (document.hidden) return;
    const gap = state.busy ? 1500 : 4000;
    if (Date.now() - (state.lastMsgLoad || 0) >= gap) loadMessages();
    if (state.busy && Date.now() - (state.lastRunCheck || 0) > 3000) {
      state.lastRunCheck = Date.now();
      syncRunning();
      try { ui.loadStats?.(); } catch {}
    }
  }, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.view === 'session') loadMessages(true);
  });
}

async function loadModel() {
  try {
    const r = await api(`/api/mobile/v1/session/models?sessionId=${encodeURIComponent(state.sessionId)}`);
    state.modelGroups = r.groups || [];
    state.modelMeta = r.current || null;
    let label = null;
    const cur = r.current;
    if (cur) {
      const grp = state.modelGroups.find(g => g.id === cur.provider);
      const mm = grp && (grp.models || []).find(x => x.id === cur.model);
      label = (mm && (mm.name || mm.id)) || cur.model;
      if (cur.reasoningEffort) label += ` · ${cur.reasoningEffort}`;
    }
    state.model = label;
    if (ui.modelEl) ui.modelEl.replaceChildren(el('b', { text: label || '模型' }), el('span', { text:'⌄' }));
  } catch {}
}

// 模型 + 推理等级选择器（两步：先选模型，再选推理强度）
function openModelPicker() {
  const groups = state.modelGroups || [];
  if (!groups.length) { toast('这个会话拿不到模型列表'); return; }
  const items = [];
  for (const g of groups) {
    for (const m of (g.models || [])) {
      items.push({ label: m.name || m.id, icon: '◈', run: () => pickEffort(g.id, m) });
    }
  }
  openSheet(items, `模型 · 当前 ${state.model || '?'}`);
}

function pickEffort(provider, m) {
  const efforts = (m.reasoning && m.reasoning.efforts) || [];
  if (!efforts.length) return applyModel(provider, m.id);
  openSheet(efforts.map(e => ({
    label: `${e.name || e.id}${e.description ? ' · ' + e.description.slice(0, 24) : ''}`,
    icon: '·',
    run: () => applyModel(provider, m.id, e.id),
  })), `推理等级 · ${m.name || m.id}`);
}

async function applyModel(provider, model, reasoningEffort) {
  try {
    await api('/api/mobile/v1/session/select-model', { method:'POST', body: {
      sessionId: state.sessionId, provider, model, ...(reasoningEffort ? { reasoningEffort } : {}),
    }});
    await loadModel();
    if (state.view === 'session') paintSession();
  } catch (e) { toast('切换模型失败：' + (e.message || e)); }
}

async function loadMessages(force=false) {
  state.lastMsgLoad = Date.now();
  try {
    const r = await api(`/api/mobile/v1/session/messages?sessionId=${encodeURIComponent(state.sessionId)}`);
    state.messages = r.items || [];
    state.lastSeq = r.lastSeq || 0;
    saveMsgCache(state.sessionId, state.messages, state.lastSeq);
    if (state.view === 'session') paintSession(force ? { scroll:'bottom' } : {});
  } catch (e) { console.warn('messages', e); }
}

function subscribeSession() {
  state.live?.close();
  const sid = state.sessionId;
  state.live = openStream(`/api/mobile/v1/session/stream?sessionId=${encodeURIComponent(sid)}&lastSeq=${state.lastSeq}`, {
    onState: (st, err) => {
      state.stream = st;
      if (!ui.dot) return;
      ui.dot.className = st === 'open' ? 'dot run' : 'dot';
      ui.dot.title = st === 'open' ? '实时已连接' : `重连中…${err ? ' ' + (err.message || err) : ''}`;
      if (ui.strip) ui.strip.textContent = st === 'open'
        ? (state.busy ? '深度求索中…' : '')
        : '实时连接断开，重连中…';
    },
    onFrame: f => { if (state.sessionId === sid) onFrame(f); },
  });
}

function onFrame(frame) {
  const t = frame.type || '';
  if (t === 'session/heartbeat') return;
  if (frame.seq && frame.seq > state.lastSeq) state.lastSeq = frame.seq;

  if (t === 'approval/requested' || t === 'approval/asked') pushCard('approval', frame);
  else if (t === 'question/requested') pushCard('question', frame);
  else if (t === 'session/queue') {
    // 排队条：placement=queued 的才是"待发"，steering 只是回执
    state.queue = ((frame.items || []).filter(it => it && it.placement === 'queued'));
    if (state.view === 'session') paintSession();
    return;
  }
  else if (t === 'approval/resolved' || t === 'approval/decided') {
    const rid = frame.approvalId || (frame.data && frame.data.id);
    state.cards = state.cards.filter(c => c.id !== rid);
  }
  else if (t === 'question/resolved') {
    const rid = frame.questionId || frame.rpcId || (frame.data && frame.data.id);
    state.cards = state.cards.filter(c => c.id !== rid);
  }
  else if (t === 'session/event') {
    const ev = frame.event || {};
    const inner = (ev.data && ev.data.type) || (frame.data && frame.data.type) || ev.type || '';
    if (inner === 'turn/start') state.busy = true;
    if (inner === 'turn/end' || inner === 'turn/ended') { state.busy = false; }
    clearTimeout(onFrame._t);
    onFrame._t = setTimeout(loadMessages, 350);
    return;
  }
  if (state.view === 'session') paint();
}

// 通知点击：SW 会 postMessage，带着要打开的会话
if ('serviceWorker' in navigator) {
  try {
    navigator.serviceWorker.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'open-session' && d.sessionId) {
        const s = state.sessions.find(x => x.sessionId === d.sessionId);
        openSession(s || { sessionId: d.sessionId, title: '(来自通知)' });
      }
    });
  } catch {}
}

function subscribeDevice() {
  state.device?.close();
  state.device = openStream('/api/mobile/v1/events/stream', {
    onFrame: f => {
      const p = f.payload || f;
      if (p.type === 'device/list-changed' || f.type === 'session/summary') {
        // 设备流事件可能很密，节流一下，避免角标把列表刷爆
        if (Date.now() - (subscribeDevice._last || 0) > 3000) {
          subscribeDevice._last = Date.now();
          refreshAll();
        }
      }
      // 别的会话里挂起的审批/提问：记一笔，让图标亮红点
      const t = p.type || '';
      if (t === 'approval/requested' || t === 'approval/asked' || t === 'question/requested') {
        const sid = p.sessionId || (p.data && p.data.sessionId);
        const id = p.approvalId || p.questionId || (p.data && p.data.id);
        if (sid && state.sessionId && sid !== state.sessionId && id) {
          state.foreign = state.foreign || new Set();
          state.foreign.add(id);
          syncBadge();
        }
      }
    },
  });
}

// ---------------------------------------------------------------- 启动
(async () => {
  // 本地开发：只有在没有凭据、且确实在本机时才尝试 dev-token.json
  // （放线上会白等一个 404 往返，首屏被拖慢）
  const isLocalDev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (!state.token && isLocalDev) {
    try {
      const r = await fetch('./dev-token.json', { cache:'no-store' });
      if (r.ok) {
        const j = await r.json();
        if (j && j.token) { state.token = j.token; state.instanceId = j.instanceId || state.instanceId; localStorage.setItem(LS.token, j.token); }
      }
    } catch {}
  }
  // 有缓存就先画列表，网络回来再覆盖（秒开）
  if (state.token && !state.sessions.length) {
    const c = readListCache();
    if (c) state.sessions = c;
  }
  render();
  installSwipeBack();
  installViewportSync();
  installOfflineBar();
  // 跨过宽屏断点时重排（手机转平板 / 桌面拖窗口）
  try {
    const mq = window.matchMedia('(min-width: 900px)');
    const onMq = () => { if (state.token) render(); };
    if (mq.addEventListener) mq.addEventListener('change', onMq);
    else if (mq.addListener) mq.addListener(onMq);
  } catch {}
  if (state.token) {
    refreshAll(); subscribeDevice();
    pushHeartbeat();
    // 从通知点进来会带 ?session=<id>，等列表加载完再跳
    const wantSid = new URLSearchParams(location.search).get('session');
    if (wantSid) {
      setTimeout(() => {
        const s = state.sessions.find(x => x.sessionId === wantSid);
        openSession(s || { sessionId: wantSid, title: '(来自通知)' });
        try { history.replaceState(null, '', location.pathname); } catch {}
      }, 900);
    }
  }
})();

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && state.token) {
    refreshAll();
    syncBadge();
    pushHeartbeat();
    if (state.view === 'session') { loadMessages(); subscribeSession(); }
  }
});
</script>
</body>
</html>
