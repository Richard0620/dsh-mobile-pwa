<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DSH 测试环境</title>
<style>
  :root{
    --bg:#f7f7f8; --card:#fff; --fg:#111318; --dim:#8a8f98; --line:#e9e9ee;
    --accent:#2f6bff; --ok:#2ea043; --warn:#b58100;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0e1014; --card:#171a20; --fg:#e8eaee; --dim:#8d94a0; --line:#242933;
      --accent:#4f8cff; --ok:#3fb950; --warn:#d29922; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  main{max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 16px}
  .prod{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;
    border:1px solid var(--line);border-radius:16px;background:var(--card);margin-bottom:16px}
  .prod b{font-size:14px}
  .prod small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
  .prod a{color:var(--accent);text-decoration:none;font-size:13px;white-space:nowrap}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:12px 14px}
  .row{display:flex;align-items:flex-start;gap:10px}
  .name{font-weight:650;font-size:14px;word-break:break-all;flex:1}
  .meta{color:var(--dim);font-size:11.5px;margin-top:4px;line-height:1.5}
  .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;justify-content:center;padding:7px 14px;border-radius:999px;
    border:1px solid var(--line);background:var(--bg);color:var(--fg);text-decoration:none;font-size:12.5px}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn:active{opacity:.75}
  .empty{color:var(--dim);font-size:13px;padding:18px 4px}
  .hint{color:var(--dim);font-size:11.5px;line-height:1.6;margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  code{font:11.5px/1.5 ui-monospace,Consolas,monospace;background:color-mix(in srgb,var(--fg) 7%,transparent);
    padding:1px 5px;border-radius:5px;word-break:break-all}
  .pill{font-size:10.5px;color:var(--ok);border:1px solid var(--ok);border-radius:999px;padding:1px 7px}
</style>
</head>
<body>
<main>
  <h1>DSH 测试环境</h1>
  <p class="sub">选择分支 → 在手机打开 → 添加到主屏幕，就是该分支的独立 PWA。</p>

  <div class="prod">
    <div>
      <b>当前线上</b>
      <small id="prodMeta">读取版本…</small>
    </div>
    <a href="/">打开 →</a>
  </div>

  <div class="list" id="list"><div class="empty">读取分支列表…</div></div>

  <p class="hint">
    <b>手机使用</b>：Safari 打开分支 → 分享 → 添加到主屏幕。各分支有自己的 manifest 和 Service Worker，互不覆盖。<br>
    如果预览里没有登录态：在 <b>主 PWA → ☰ → 设置 → 恢复链接</b> 复制链接，粘贴到预览的「用链接登录」。<br>
    预览默认不启用推送，避免和主 PWA 抢通知；只测界面、会话、权限。<br>
    新增分支：在仓库跑 <code>preview\deploy-preview.ps1 -Branch &lt;branch&gt;</code>。
  </p>
</main>
<script>
const fmtTime = t => {
  if (!t) return '';
  const d = new Date(t);
  if (Number.isNaN(d.getTime())) return '';
  return d.toLocaleString('zh-CN', { hour12: false });
};
async function loadProd() {
  try {
    const r = await fetch('../VERSION', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    if (t.trim().startsWith('<')) throw new Error('not version');
    const app = (/^app=(\S+)/m.exec(t) || [])[1] || '?';
    const sw = (/^sw=(\S+)/m.exec(t) || [])[1] || '?';
    const commit = (/^commit=(\S+)/m.exec(t) || [])[1] || '?';
    const ref = (/^ref=(\S+)/m.exec(t) || [])[1] || '';
    document.getElementById('prodMeta').textContent = app + ' / ' + sw + ' / ' + commit + (ref ? ' · ' + ref : '');
  } catch {
    document.getElementById('prodMeta').textContent = '版本读取失败';
  }
}
async function loadBranches() {
  const list = document.getElementById('list');
  try {
    const r = await fetch('./branches.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const items = await r.json();
    if (!Array.isArray(items) || !items.length) throw new Error('empty');
    items.sort((a, b) => String(b.deployedAt || '').localeCompare(String(a.deployedAt || '')));
    list.replaceChildren();
    for (const it of items) {
      const card = document.createElement('div');
      card.className = 'card';
      const row = document.createElement('div'); row.className = 'row';
      const body = document.createElement('div'); body.style.flex = '1'; body.style.minWidth = '0';
      const name = document.createElement('div'); name.className = 'name';
      name.textContent = it.branch || it.slug || '?';
      const meta = document.createElement('div'); meta.className = 'meta';
      meta.textContent = `${it.app || '?'} / ${it.sw || '?'} · ${it.commit || '?'} · ${fmtTime(it.deployedAt)}`;
      body.append(name, meta); row.append(body);
      const pill = document.createElement('span'); pill.className = 'pill'; pill.textContent = '预览';
      row.append(pill); card.append(row);
      const acts = document.createElement('div'); acts.className = 'acts';
      const open = document.createElement('a'); open.className = 'btn primary';
      open.href = './' + encodeURIComponent(it.slug) + '/'; open.textContent = '打开分支 →';
      const copy = document.createElement('button'); copy.className = 'btn'; copy.type = 'button'; copy.textContent = '复制链接';
      copy.onclick = async () => {
        const url = location.origin + location.pathname + encodeURIComponent(it.slug) + '/';
        try { await navigator.clipboard.writeText(url); copy.textContent = '已复制'; }
        catch { copy.textContent = '复制失败'; }
        setTimeout(() => { copy.textContent = '复制链接'; }, 1500);
      };
      acts.append(open, copy); card.append(acts); list.append(card);
    }
  } catch (e) {
    list.replaceChildren();
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = '还没有预览分支。先跑 preview\\deploy-preview.ps1 -Branch <branch>。';
    list.append(d);
  }
}
loadProd(); loadBranches();
</script>
</body>
</html>
