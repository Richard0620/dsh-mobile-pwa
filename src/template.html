<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AI-HUB">
<title>AI-HUB</title>
<script>
  // 手动主题要在首屏绘制前应用，避免闪一下；auto 时不设属性，走系统配色
  try {
    var t = localStorage.getItem('dsh.theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    var sk = localStorage.getItem('dsh.skin');
    if (sk === 'carbon' || sk === 'paper' || sk === 'auto') document.documentElement.dataset.skin = sk;
  } catch (e) {}
</script>
<style>
/* __STYLE__ */
</style>
</head>
<body>
<div id="root">
  <!-- 首屏占位：JS 还没跑起来时先显示这个，避免白屏错觉（render() 会一次性替换掉 #root） -->
  <div style="min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font:15px -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#8a8f98;background:#0f1115">
    <div style="width:56px;height:56px;border-radius:16px;background:#1b1e24;display:grid;place-items:center;font-size:22px;font-weight:700;color:#cfd3da">DSH</div>
    <div>正在连接…</div>
  </div>
</div>
<script type="module">
/* __SCRIPT__ */
</script>
</body>
</html>
