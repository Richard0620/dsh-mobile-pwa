name: preflight

on:
  pull_request:
  push:
    branches: [main]

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Static preflight
        run: node scripts/preflight.mjs
